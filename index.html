const SFX = {
  tap() { tone(700, .05, 'triangle', .12); },
  blip() { tone(880 + Math.random() * 90, .028, 'square', .03); },
  flip() { noise(.09, .16, 3200); tone(520, .06, 'triangle', .06, .02); },
  correct() { tone(784, .12, 'triangle', .24); tone(1175, .2, 'triangle', .22, .1); },
  wrong() { tone(233, .16, 'sawtooth', .1); tone(196, .26, 'sawtooth', .1, .09); },
  coin() { tone(1318, .07, 'square', .08); tone(1760, .14, 'square', .07, .06); },
  energy() { tone(600, .1, 'sine', .14, 0, 1200); },
  card() { noise(.16, .22, 1400); tone(340, .12, 'triangle', .16, .04, 700); },
  hit() { noise(.14, .34, 700); tone(130, .22, 'sine', .42, 0, 55); },
  weak() { this.hit(); tone(1568, .14, 'triangle', .16, .06); tone(2093, .22, 'triangle', .13, .13); },
  block() { tone(420, .08, 'square', .1); noise(.1, .16, 3200, .02); },
  heal() { tone(660, .12, 'sine', .15); tone(990, .18, 'sine', .13, .08); },
  hurt() { noise(.2, .3, 500); tone(160, .24, 'sawtooth', .12, 0, 80); },
  roar() { tone(190, .6, 'sawtooth', .09, 0, 85); noise(.5, .07, 380); },
  stamp() { tone(92, .26, 'sine', .55, 0, 48); noise(.08, .32, 460); },
  build() { noise(.3, .22, 300); tone(110, .3, 'sine', .4, 0, 60); },
  win() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, .2, 'triangle', .2, i * .12)); },
  lose() { [392, 330, 262].forEach((f, i) => tone(f, .3, 'triangle', .16, i * .2)); },
  whoosh() { noise(.3, .12, 800, 0, .7); }
};
const SET = { sfx: true, bgm: false, vib: true, reduce: false };
function sfx(name) { if (!SET.sfx) return; audioOn(); try { SFX[name] && SFX[name](); } catch (e) { } }
function vib(ms) { if (SET.vib && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) { } } }

// 배경 음악: 펜타토닉 16스텝 루프
const MEL = [72, 0, 76, 79, 0, 76, 74, 0, 72, 0, 69, 72, 0, 74, 76, 0, 79, 0, 81, 79, 0, 76, 74, 0, 76, 0, 74, 72, 0, 69, 72, 0];
const BAS = [48, 48, 43, 43, 45, 45, 41, 43];
const mf = n => 440 * Math.pow(2, (n - 69) / 12);
function bgmTick() {
  if (!AC) return;
  const spb = .22;
  while (BGM_NEXT < AC.currentTime + .3) {
    const i = BGM_STEP % MEL.length, at = BGM_NEXT - AC.currentTime;
    if (MEL[i]) tone(mf(MEL[i]), spb * .9, 'triangle', .09, Math.max(0, at), null, BGM_GAIN);
    if (i % 4 === 0) tone(mf(BAS[(i / 4) % BAS.length]), spb * 3.6, 'sine', .12, Math.max(0, at), null, BGM_GAIN);
    BGM_NEXT += spb; BGM_STEP++;
  }
}
function bgm(on) {
  SET.bgm = on; audioOn(); if (!AC) return;
  const t = AC.currentTime;
  BGM_GAIN.gain.cancelScheduledValues(t); BGM_GAIN.gain.setTargetAtTime(on ? .8 : 0, t, .3);
  if (on && !BGM_TIMER) { BGM_NEXT = AC.currentTime + .05; BGM_TIMER = setInterval(bgmTick, 100); }
  if (!on && BGM_TIMER) { setTimeout(() => { if (!SET.bgm) { clearInterval(BGM_TIMER); BGM_TIMER = null; } }, 900); }
}

// ===== 연출 효과 =====
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const sleep = ms => new Promise(r => setTimeout(r, SET.reduce ? Math.min(ms, 60) : ms));
function fxLayer() { let f = $('#fx'); if (!f) { f = document.createElement('div'); f.id = 'fx'; f.className = 'fx'; $('#app').appendChild(f); } return f; }
function rel(el) { const a = $('#app').getBoundingClientRect(), b = el.getBoundingClientRect(); return { x: b.left - a.left + b.width / 2, y: b.top - a.top + b.height / 2, w: b.width, h: b.height }; }
const PAL = ['#E0456A', '#FFE45A', '#3C6FD1', '#1E7A4C', '#F28B3C', '#C9A6F2'];
function burst(x, y, n = 18, opt = {}) {
  if (SET.reduce) return;
  const f = fxLayer();
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div'); p.className = 'pt';
    const col = (opt.colors || PAL)[i % (opt.colors || PAL).length], sz = 6 + Math.random() * 7;
    p.style.cssText = `left:${x}px;top:${y}px;width:${sz}px;height:${sz * (opt.round ? 1 : .6)}px;background:${col};border-radius:${opt.round ? '50%' : '2px'};border:1.5px solid #1E2230`;
    f.appendChild(p);
    const ang = Math.random() * Math.PI * 2, dist = (opt.spread || 90) * (.4 + Math.random() * .8);
    const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - (opt.up || 30);
    p.animate([{ transform: 'translate(-50%,-50%) rotate(0)', opacity: 1 }, { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy + 60}px)) rotate(${Math.random() * 540}deg)`, opacity: 0 }], { duration: 700 + Math.random() * 500, easing: 'cubic-bezier(.2,.7,.4,1)', fill: 'forwards' }).onfinish = () => p.remove();
  }
}
function floatText(x, y, text, cls = '') {
  const f = fxLayer(), d = document.createElement('div');
  d.className = 'float ' + cls; d.textContent = text; d.style.left = x + 'px'; d.style.top = y + 'px'; f.appendChild(d);
  d.animate([{ transform: 'translate(-50%,-50%) scale(.6)', opacity: 0 }, { transform: 'translate(-50%,-90%) scale(1.15)', opacity: 1, offset: .25 }, { transform: 'translate(-50%,-160%) scale(1)', opacity: 0 }], { duration: SET.reduce ? 500 : 1100, easing: 'ease-out', fill: 'forwards' }).onfinish = () => d.remove();
}
function shake(el) { if (SET.reduce || !el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function toast(msg) { $$('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; $('#app').appendChild(t); setTimeout(() => t.remove(), 2300); }
async function stamp(text = '참 잘<br>했어요') {
  const s = document.createElement('div'); s.className = 'stampfx'; s.innerHTML = text; $('#app').appendChild(s);
  await sleep(180); sfx('stamp'); vib(40); shake($('#app .scene'));
  await sleep(1100); s.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' }).onfinish = () => s.remove();
}
const PEN_O = 'M30 6C46 5 55 15 54 30C53 45 42 55 28 54C13 53 5 42 6 29C7 16 17 7 35 8';
const PEN_X = 'M10 52C24 36 36 22 52 6';
function penMark(el, ok) {
  const host = el.querySelector('.n') || el, self = host === el;
  const size = self ? Math.min(el.offsetWidth, el.offsetHeight) + 18 : 46;
  const hx = self ? el.offsetWidth / 2 : host.offsetLeft + host.offsetWidth / 2, hy = self ? el.offsetHeight / 2 : host.offsetTop + host.offsetHeight / 2;
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('class', 'pen'); s.setAttribute('viewBox', '0 0 60 60');
  s.style.cssText = `width:${size}px;height:${size}px;left:${hx - size / 2}px;top:${hy - size / 2}px`;
  s.innerHTML = `<path pathLength="240" d="${ok ? PEN_O : PEN_X}"/>`; el.appendChild(s);

function flyOrb(from, to, color = '#FFE45A') {
  if (SET.reduce) return Promise.resolve();
  const f = fxLayer(), o = document.createElement('div');
  o.className = 'pt'; o.style.cssText = `left:${from.x}px;top:${from.y}px;width:16px;height:16px;border-radius:50%;background:${color};border:2px solid #1E2230`;
  f.appendChild(o);
  const mx = (from.x + to.x) / 2 + (Math.random() * 80 - 40), my = Math.min(from.y, to.y) - 60;
  return new Promise(res => {
    o.animate([{ transform: 'translate(-50%,-50%)' }, { transform: `translate(calc(-50% + ${mx - from.x}px), calc(-50% + ${my - from.y}px)) scale(1.2)`, offset: .45 }, { transform: `translate(calc(-50% + ${to.x - from.x}px), calc(-50% + ${to.y - from.y}px)) scale(.7)` }], { duration: 560, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' }).onfinish = () => { o.remove(); res(); };
  });

// ===== 그림: 스티커 캐릭터, 보스, 아이콘, 지도 =====
const INK = '#1E2230';
const P = (d, fill, x = '') => `<path d="${d}" fill="${fill}" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" ${x}/>`;
const C = (cx, cy, r, fill, x = '') => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="${INK}" stroke-width="2.2" ${x}/>`;
const E = (cx, cy, rx, ry, fill, x = '') => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fill}" stroke="${INK}" stroke-width="2.2" ${x}/>`;
const R = (x0, y0, w, h, rx, fill, x = '') => `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${INK}" stroke-width="2.2" ${x}/>`;
const L = (d, w = 2.2, col = INK, x = '') => `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${x}/>`;

const EXPRS = [['normal', '기본'], ['happy', '기쁨'], ['surprised', '놀람'], ['thinking', '고민'], ['sad', '실망'], ['determined', '결심']];

function face(expr, o = {}) {
  const ey = o.ey ?? 55, my = o.my ?? 70, bc = o.brow || INK, bw = o.bw || 2.4, lx = 48, rx = 72;
  const dot = x => `<ellipse cx="${x}" cy="${ey}" rx="2.9" ry="3.7" fill="${INK}"/><circle cx="${x + 1}" cy="${ey - 1.4}" r=".95" fill="#fff"/>`;
  let eyes = '', brows = '', mouth = '', extra = '';
  switch (expr) {
    case 'happy':
      eyes = L(`M${lx - 4.5} ${ey + 1.5} Q${lx} ${ey - 4.5} ${lx + 4.5} ${ey + 1.5}`, 2.7) + L(`M${rx - 4.5} ${ey + 1.5} Q${rx} ${ey - 4.5} ${rx + 4.5} ${ey + 1.5}`, 2.7);
      brows = L(`M${lx - 5} ${ey - 10} Q${lx} ${ey - 13.5} ${lx + 5} ${ey - 10}`, bw, bc) + L(`M${rx - 5} ${ey - 10} Q${rx} ${ey - 13.5} ${rx + 5} ${ey - 10}`, bw, bc);
      mouth = `<path class="mouth" d="M52 ${my - 3} Q60 ${my + 9} 68 ${my - 3} Z" fill="#C8414F" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>`;
      break;
    case 'surprised':
      eyes = `<circle cx="${lx}" cy="${ey}" r="4.6" fill="#fff" stroke="${INK}" stroke-width="2"/><circle cx="${lx}" cy="${ey}" r="2.1" fill="${INK}"/><circle cx="${rx}" cy="${ey}" r="4.6" fill="#fff" stroke="${INK}" stroke-width="2"/><circle cx="${rx}" cy="${ey}" r="2.1" fill="${INK}"/>`;
      brows = L(`M${lx - 5} ${ey - 12} Q${lx} ${ey - 16} ${lx + 5} ${ey - 12}`, bw, bc) + L(`M${rx - 5} ${ey - 12} Q${rx} ${ey - 16} ${rx + 5} ${ey - 12}`, bw, bc);
      mouth = `<ellipse class="mouth" cx="60" cy="${my + 1}" rx="4.2" ry="5.2" fill="#5A1E2A" stroke="${INK}" stroke-width="2"/>`;
      break;
    case 'thinking':
      eyes = dot(lx) + L(`M${rx - 4} ${ey} L${rx + 4} ${ey}`, 2.7);
      brows = L(`M${lx - 5} ${ey - 12} L${lx + 5} ${ey - 9.5}`, bw, bc) + L(`M${rx - 5} ${ey - 10} Q${rx} ${ey - 15} ${rx + 5} ${ey - 12}`, bw, bc);
      mouth = `<path class="mouth" d="M55 ${my + 1} Q60 ${my - 2} 66 ${my}" fill="none" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/>`;
      extra = `<g fill="${INK}"><circle cx="95" cy="36" r="2"/><circle cx="101" cy="28" r="2.8"/><circle cx="108" cy="18" r="3.6"/></g>`;
      break;
    case 'sad':
      eyes = dot(lx) + dot(rx);
      brows = L(`M${lx - 5} ${ey - 9} L${lx + 5} ${ey - 12.5}`, bw, bc) + L(`M${rx - 5} ${ey - 12.5} L${rx + 5} ${ey - 9}`, bw, bc);
      mouth = `<path class="mouth" d="M53 ${my + 3} Q60 ${my - 4} 67 ${my + 3}" fill="none" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/>`;
      extra = `<path d="M${rx + 8} ${ey + 3} q3.2 5 0 7.4 q-3.2 -2.4 0 -7.4z" fill="#8FD3F0" stroke="${INK}" stroke-width="1.4"/>`;
      break;
    case 'determined':
      eyes = `<ellipse cx="${lx}" cy="${ey + .6}" rx="3" ry="2.7" fill="${INK}"/><ellipse cx="${rx}" cy="${ey + .6}" rx="3" ry="2.7" fill="${INK}"/>`;
      brows = L(`M${lx - 6} ${ey - 12} L${lx + 5} ${ey - 8}`, bw + .5, bc) + L(`M${rx + 6} ${ey - 12} L${rx - 5} ${ey - 8}`, bw + .5, bc);
      mouth = `<path class="mouth" d="M54 ${my} Q60 ${my + 2.5} 66 ${my}" fill="none" stroke="${INK}" stroke-width="2.7" stroke-linecap="round"/>`;
      break;
    case 'smug':
      eyes = `<path d="M${lx - 4.2} ${ey - .5} L${lx + 4.2} ${ey - .5} Q${lx} ${ey + 5} ${lx - 4.2} ${ey - .5} Z" fill="${INK}"/><path d="M${rx - 4.2} ${ey - .5} L${rx + 4.2} ${ey - .5} Q${rx} ${ey + 5} ${rx - 4.2} ${ey - .5} Z" fill="${INK}"/>`;
      brows = L(`M${lx - 5} ${ey - 9} L${lx + 5} ${ey - 9}`, bw, bc) + L(`M${rx - 5} ${ey - 12} Q${rx} ${ey - 17} ${rx + 5} ${ey - 13}`, bw, bc);
      mouth = `<path class="mouth" d="M53 ${my} Q61 ${my + 4.5} 67 ${my - 3}" fill="none" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/>`;
      break;
    default:
      eyes = dot(lx) + dot(rx);
      brows = L(`M${lx - 5} ${ey - 10.5} Q${lx} ${ey - 12.5} ${lx + 5} ${ey - 10.5}`, bw, bc) + L(`M${rx - 5} ${ey - 10.5} Q${rx} ${ey - 12.5} ${rx + 5} ${ey - 10.5}`, bw, bc);

      $('#sv', host).innerHTML = on ? '표값을 넣어도 두 쪽에 똑같이 붙어서 <b>결론은 그대로</b>예요. 어차피 돌아오지 않는 돈이라 빼고 생각해요.' : '보기의 비용은 포기한 놀이(3), 나가기의 비용은 포기한 영화 나머지(1)예요. <b>나가서 노는 쪽</b>이 합리적이에요.';
    }
    $('#sk', host).onchange = () => { sfx('flip'); upd(); };
    upd();
  }
};

  { id: '1-d2', t: 'mc', q: '을은 카페 창업과 회사 취업 가운데 하나를 선택하려 한다. 자료에 대한 옳은 설명만을 <보기>에서 고른 것은?', data: tbl(['구분', '창업', '취업'], [['편익', 500, 400], ['명시적 비용', 300, 0]], '만 원') + '<p class="note">창업 준비로 이미 낸 교육비 50만 원은 돌려받을 수 없다.</p>', box: ['창업의 암묵적 비용은 400만 원이다.', '창업의 기회비용은 750만 원이다.', '취업의 순편익은 양(+)의 값이다.', '교육비 50만 원은 취업을 선택할 때의 암묵적 비용에 포함된다.'], c: COMBO, a: 1, e: '창업의 암묵적 비용은 취업의 (400 − 0) = 400만 원, 기회비용은 300 + 400 = 700만 원이에요. 취업의 기회비용은 0 + (500 − 300) = 200만 원이라 순편익은 +200만 원이에요. 교육비는 매몰 비용이라 어느 쪽 계산에도 넣지 않아요.', cs: ['oc', 'sunk', 'net'], trap: '매몰 비용을 기회비용에 넣음' },
  { id: '1-d3', t: 'mc', q: '그림은 갑이 X~Z 가운데 하나를 선택할 때 대안별 편익과 기회비용을 나타낸다. 이에 대한 설명으로 옳은 것은? (단위: 만 원)', chart: { labels: ['X', 'Y', 'Z'], a: [8, 10, 6], b: [10, 8, 9], an: '편익', bn: '기회비용' }, c: ['X를 선택할 때의 순편익은 양(+)의 값이다.', 'Z의 기회비용은 X의 기회비용보다 크다.', 'Y를 선택하는 것이 합리적이다.', 'Y의 기회비용은 Y의 편익보다 크다.', '순편익이 양(+)인 대안은 두 개이다.'], a: 2, e: '순편익은 X −2, Y +2, Z −3이에요. 순편익이 양(+)인 Y 하나만 합리적 선택이에요.', cs: ['net', 'rat'] },
  { id: '1-d4', t: 'mc', q: '다음 사례에 대한 설명으로 옳은 것은? (단, 다른 조건은 고려하지 않는다.)', data: '<p>병은 환불이 안 되는 공연표를 5만 원에 샀다. 공연 날 하루 7만 원을 받는 아르바이트 제안이 왔다. 병이 공연에서 얻는 편익은 6만 원이다.</p>', c: ['공연을 볼 때의 기회비용은 12만 원이다.', '공연표 값 5만 원은 아르바이트를 할 때의 암묵적 비용이다.', '아르바이트를 하는 것이 합리적이다.', '공연을 볼 때의 순편익은 +1만 원이다.', '공연표 값을 생각하면 공연을 보는 것이 합리적이다.'], a: 2, e: '표값 5만 원은 매몰 비용이라 빼요. 공연을 보면 7만 원을 포기하므로 기회비용은 7만 원이고, 편익 6만 원보다 커요. 순편익은 −1만 원이에요.', cs: ['sunk', 'oc', 'rat'], trap: '매몰 비용을 기회비용에 넣음' },
  { id: '1-d5', t: 'mc', q: '다음 자료에 대한 옳은 설명만을 <보기>에서 고른 것은?', data: '<p>바닷가 마을의 공동 어장에서는 누구나 물고기를 잡을 수 있다. 어부들이 저마다 어획량을 늘리자 5년 만에 물고기가 크게 줄었다. 마을은 어부마다 한 해에 잡을 수 있는 양을 정하는 규칙을 만들었다.</p>', box: ['공동 어장의 물고기는 희소하지 않은 자원이다.', '어부 개인에게는 어획량을 늘리는 것이 이익으로 보였다.', '어획량 규칙은 매몰 비용을 줄이기 위한 정책이다.', '개인의 합리적 선택이 사회 전체에는 바람직하지 않은 결과를 낳은 사례이다.'], c: COMBO, a: 3, e: '물고기는 모두가 원하지만 한정되어 희소해요. 각자에게는 더 잡는 게 이익이었지만 결과는 어장 황폐화, 곧 공유지의 비극이에요. 어획량 규칙은 공동 자원을 지키려는 해결 방안이에요.', cs: ['commons', 'limit', 'scar'] },
  { id: '1-d6', t: 'mc', q: '(가)~(다)에 해당하는 기본적인 경제 문제를 바르게 연결한 것은?', data: '<p>(가) 마을은 목재를 창고와 다리 가운데 어디에 먼저 쓸지 정했다.<br>(나) 목재를 손으로 자를지 기계로 자를지 정했다.<br>(다) 완성된 창고 공간을 상인들에게 어떻게 나눌지 정했다.</p>', c: ['(가) 어떻게 · (나) 무엇을 얼마나 · (다) 누구에게', '(가) 무엇을 얼마나 · (나) 어떻게 · (다) 누구에게', '(가) 무엇을 얼마나 · (나) 누구에게 · (다) 어떻게', '(가) 누구에게 · (나) 어떻게 · (다) 무엇을 얼마나', '(가) 어떻게 · (나) 누구에게 · (다) 무엇을 얼마나'], a: 1, e: '무엇을 먼저 만들지는 "무엇을 얼마나", 생산 방법은 "어떻게", 결과물을 나누는 것은 "누구에게"의 문제예요.', cs: ['econ3'] },
  { id: '1-d7', t: 'mc', q: '표는 갑이 X~Z 가운데 하나를 선택할 때의 편익과 명시적 비용이다. 이에 대한 옳은 설명만을 <보기>에서 고른 것은? (단, 갑은 편익과 기회비용만 고려한다.)', data: tbl(['구분', 'X', 'Y', 'Z'], [['편익', 100, 90, 70], ['명시적 비용', 60, 40, 40]], '만 원'), box: ['편익이 가장 큰 X를 선택하는 것이 합리적이다.', 'Z를 선택할 때의 암묵적 비용은 30만 원이다.', 'Y를 선택할 때의 기회비용은 80만 원이다.', 'X를 선택할 때의 순편익은 −10만 원이다.'], c: COMBO, a: 4, e: '(편익 − 명시적 비용)은 X 40, Y 50, Z 30이에요. Y의 기회비용은 40 + 40 = 80, X는 60 + 50 = 110, Z의 암묵적 비용은 50이에요. 순편익은 X −10, Y +10, Z −20이라 Y가 합리적이에요.', cs: ['oc', 'imp', 'net'], steps: ['① 대안마다 (편익 − 명시적 비용)을 구해요.', '② 암묵적 비용 = 나머지 둘 가운데 큰 값', '③ 기회비용 = 명시적 비용 + 암묵적 비용, 순편익 = 편익 − 기회비용'] },
  { id: '1-d8', t: 'mc', q: '다음 대화에서 ㉠에 해당하는 학생만을 있는 대로 고른 것은?', data: '<p>교사: 기회비용에 대해 말해 볼까요?<br>갑: 명시적 비용과 암묵적 비용을 더한 것입니다.<br>을: 이미 지출해 되찾을 수 없는 비용도 포함합니다.<br>병: 같은 선택이라도 사람마다 다를 수 있습니다.<br>교사: ㉠ 두 명만 옳게 말했네요.</p>', c: ['갑', '을', '갑, 을', '을, 병', '갑, 병'], a: 4, e: '기회비용은 명시적 비용 + 암묵적 비용이고(갑), 사람마다 편익과 포기하는 가치가 달라 기회비용도 달라요(병). 매몰 비용은 포함하지 않아요(을은 틀림).', cs: ['oc', 'sunk', 'subj'] },
  // 통합형
  { id: '1-i1', t: 'mc', tag: '지리 연계', q: '갑은 12월 방학에 A, B 가운데 한 곳으로 봉사 활동을 가려 한다. 자료에 대한 설명으로 옳은 것은? (단, 갑은 편익과 기회비용만 고려한다.)', data: '<p>A는 남위 34도의 해안 도시로, 여름에 건조하고 겨울에 비가 많은 지중해성 기후가 나타난다. B는 북위 60도 부근의 도시로 겨울이 길고 춥다.</p>' + tbl(['구분', 'A', 'B'], [['편익', 250, 200], ['명시적 비용', 150, 120]], '만 원'), c: ['12월에 A는 겨울철이다.', '12월에 A는 비가 적고 건조한 시기이다.', 'B를 선택할 때의 기회비용은 200만 원이다.', 'B를 선택하는 것이 합리적이다.', 'A를 선택할 때의 암묵적 비용은 100만 원이다.'], a: 1, e: 'A는 남반구라 12월이 여름이고, 지중해성 기후는 여름에 건조해요. (편익 − 명시적 비용)은 A 100, B 80이라 B의 기회비용은 120 + 100 = 220만 원, A의 암묵적 비용은 80만 원이에요. 순편익이 양(+)인 A가 합리적이에요.', cs: ['oc', 'imp', 'rat'], src: '수특2 83쪽 유형' },
  { id: '1-i2', t: 'mc', tag: '윤리 연계', q: '다음 사상가 갑의 관점에서 (가)에 대해 내릴 평가로 가장 적절한 것은?', data: '<p>갑: 행위의 옳고 그름은 그 행위가 사회 전체의 행복을 얼마나 늘리는지에 따라 판단해야 한다.</p><p>(가) 공동 목초지가 황폐해지자 마을은 한 사람이 풀어 놓을 수 있는 양의 수를 제한하는 규칙을 만들었다. 그 결과 목초지가 되살아나 마을 전체의 소득이 늘었다.</p>', c: ['마을 전체의 행복을 늘렸으므로 옳은 규칙이다.', '개인의 방목 자유를 제한하므로 결과와 상관없이 옳지 않다.', '목초지는 이미 쓴 매몰 비용이므로 규칙이 필요 없다.', '양을 많이 가진 사람이 손해를 보므로 누구에게도 옳지 않다.', '규칙을 만든 동기가 순수하지 않으면 옳지 않다.'], a: 0, e: '갑은 공리주의 관점이에요. 규칙이 목초지를 지켜 마을 전체의 행복(소득)을 늘렸다면 옳다고 평가해요.', cs: ['commons', 'ethic'] },
  { id: '1-i3', t: 'mc', tag: '지속가능발전 연계', q: '다음 사례에 대한 옳은 설명만을 <보기>에서 고른 것은?', data: '<p>어느 지역의 가게들은 손님이 반찬 통을 가져오면 음식값을 10% 깎아 준다. 지방 자치 단체는 이 가게들을 홍보해 주고, 일회용 포장재 쓰레기는 줄어들었다.</p>', box: ['할인은 손님의 선택을 바꾸는 경제적 유인이다.', '통을 챙기는 수고는 비용으로 볼 수 없다.', '개인의 합리적 선택과 환경 보호가 함께 이루어진 사례이다.', '할인을 받으면 기회비용은 언제나 0이 된다.'], c: COMBO, a: 1, e: '할인은 편익을 키워 선택을 바꾸는 유인이에요. 통을 챙기는 수고와 시간도 비용이라 기회비용은 0이 아니에요. 할인이 수고보다 크다고 느끼면 통을 가져가는 게 합리적이고, 쓰레기도 줄어요.', cs: ['incent', 'ethic', 'oc'], src: '천재2 72쪽 사례와 같은 구조' },
  // 보스전
  { id: '1-b1', t: 'mc', q: '표를 보고, 창고를 지을 때의 기회비용을 고르면?', data: WOOD, c: ['40점', '55점', '60점', '65점', '70점'], a: 2, e: '기회비용 = 명시적 비용 40 + 암묵적 비용 20(다리의 55 − 35) = 60점이에요.', cs: ['oc', 'imp'], steps: ['① 창고를 고르면 다리와 학교를 포기해요.', '② 포기한 대안의 (편익 − 명시적 비용): 다리 55 − 35, 학교 40 − 25', '③ 둘 가운데 큰 값이 암묵적 비용', '④ 기회비용 = 40 + 암묵적 비용'] },
  { id: '1-b2', t: 'mc', q: '표를 보고, 다리를 지을 때의 순편익을 고르면?', data: WOOD, c: ['+20점', '+10점', '0점', '−10점', '−20점'], a: 3, e: '기회비용 = 35 + 30(창고의 70 − 40) = 65점. 순편익 = 55 − 65 = −10점이에요.', cs: ['net', 'oc'], steps: ['① 암묵적 비용 = 창고(70 − 40)와 학교(40 − 25) 가운데 큰 값', '② 기회비용 = 35 + ①', '③ 순편익 = 55 − ②'] },
  { id: '1-b3', t: 'mc', q: '표를 보고, 학교를 지을 때의 암묵적 비용을 고르면?', data: WOOD, c: ['30점', '25점', '20점', '15점', '35점'], a: 0, e: '학교를 고르면 창고(70 − 40 = 30)와 다리(55 − 35 = 20)를 포기해요. 큰 값 30점이 암묵적 비용이에요.', cs: ['imp'] },
  { id: '1-b4', t: 'mc', q: '표를 보고, 순편익이 양(+)인 대안과 그 값을 바르게 짝지은 것은?', data: WOOD, c: ['다리, +20점', '창고, +30점', '학교, +15점', '창고, +10점', '다리, +5점'], a: 3, e: '창고의 기회비용은 40 + 20 = 60점, 순편익은 70 − 60 = +10점이에요. 나머지는 음(−)이에요.', cs: ['net', 'rat'] },
  { id: '1-b5', t: 'mc', q: '표에 대한 옳은 설명만을 <보기>에서 고른 것은?', data: WOOD, box: ['창고의 기회비용은 창고의 명시적 비용과 같다.', '다리의 암묵적 비용은 30점이다.', '학교의 순편익은 −15점이다.', '창고는 편익이 가장 크기 때문에 합리적 선택이다.'], c: COMBO, a: 2, e: '창고의 기회비용은 60점으로 명시적 비용 40점보다 커요. 다리의 암묵적 비용은 창고의 30점, 학교의 순편익은 40 − (25 + 30) = −15점이에요. 창고가 합리적인 까닭은 편익이 커서가 아니라 순편익이 양(+)이어서예요.', cs: ['oc', 'imp', 'net'] },
  { id: '1-b6', t: 'mc', q: '다음 자료에 대한 옳은 설명만을 <보기>에서 고른 것은? (목재 1개의 가치는 1이다.)', data: '<p>부서진 배를 고치는 데 이미 목재 30개를 썼다. 수리를 마치려면 목재 40개가 더 필요하고, 다 고친 배의 편익은 50이다. 같은 목재 40개로 창고를 지으면 편익이 60이다.</p>', box: ['이미 쓴 목재 30개는 매몰 비용이다.', '배 수리를 마칠 때의 기회비용은 110이다.', '창고를 짓는 것이 합리적이다.', '이미 쓴 목재를 생각하면 배를 끝까지 고치는 것이 합리적이다.'], c: COMBO, a: 1, e: '이미 쓴 목재 30개는 매몰 비용이라 빼요. 배 수리의 기회비용은 40 + (60 − 40) = 60, 순편익은 50 − 60 = −10이에요. 창고의 순편익은 +10이라 창고가 합리적이에요.', cs: ['sunk', 'oc', 'rat'] },
  { id: '1-b7', t: 'mc', q: '개념에 대한 옳은 설명만을 <보기>에서 고른 것은?', box: ['희소성은 자원의 절대량이 적은 상태이다.', '암묵적 비용은 실제로 지불한 금액이다.', '매몰 비용은 기회비용에 포함되지 않는다.', '편익이 기회비용보다 크면 순편익은 양(+)이다.'], c: COMBO, a: 4, e: '희소성은 욕구와 견준 상대적 부족이고, 실제로 지불한 금액은 명시적 비용이에요. ㄷ과 ㄹ이 옳아요.', cs: ['scar', 'imp', 'sunk', 'net'] },

  { id: '2-d1', t: 'mc', q: '다음은 시장과 국가의 역할에 대한 갑, 을의 주장이다. 이에 대한 설명으로 옳은 것은? (단, 갑, 을은 각각 애덤 스미스, 케인스 중 한 명이다.)', data: '<p>갑: 나라의 부는 금·은을 쌓는 데서가 아니라 분업과 생산에서 나옵니다. 시장의 가격이 자원을 알맞게 나누니 국가는 간섭을 줄여야 합니다.</p><p>을: 불황이 깊을 때 시장은 스스로 회복하지 못합니다. 정부가 공공사업으로 수요를 만들어야 합니다.</p>', c: ['갑은 수입을 억제해 금·은을 모으는 정책을 지지한다.', '을은 경제 활동의 자유와 사유 재산 제도를 부정한다.', '을의 주장은 1930년대 대공황 극복 정책의 이론적 바탕이 되었다.', '갑과 달리 을은 작은 정부를 지향한다.', '을과 달리 갑은 시장 가격 기구의 기능을 불신한다.'], a: 2, e: '갑은 애덤 스미스, 을은 케인스예요. 케인스의 생각은 뉴딜 같은 대공황 극복 정책의 바탕이 되었어요. 케인스도 사유 재산과 경제 활동의 자유는 인정해요.', cs: ['laissez', 'keynes', 'govsize'], src: '수특2 79쪽 유형' },
  { id: '2-d2', t: 'mc', q: '다음 대화에 대한 설명으로 옳은 것은? (단, A~C는 각각 상업 자본주의, 산업 자본주의, 신자유주의 중 하나이다.)', data: '<p>교사: A~C의 특징을 말해 볼까요?<br>갑: A는 석유 파동 뒤 정부 실패를 비판하며 등장했어요.<br>을: B는 절대 왕정의 보호 아래 상인들이 교역으로 부를 쌓았어요.<br>병: C는 공장제 기계 공업이 발달하며 생산에서 이윤을 얻었어요.<br>교사: 모두 옳게 말했어요.</p>', c: ['A는 공기업 민영화와 규제 완화를 추진하였다.', 'B는 자유방임주의를 바탕으로 한다.', 'C는 대공황을 계기로 등장하였다.', 'A와 달리 C는 정부의 적극적 개입을 강조한다.', 'B와 C는 모두 1970년대 이후에 나타났다.'], a: 0, e: 'A는 신자유주의, B는 상업 자본주의, C는 산업 자본주의예요. 신자유주의는 공기업 민영화와 규제 완화를 추진했어요.', cs: ['neolib', 'merc', 'ind'] },
  { id: '2-d3', t: 'mc', q: '다음 (가)~(라)를 일어난 순서대로 바르게 나열한 것은?', data: '<p>(가) 두 차례의 석유 파동으로 물가가 오르고 경기가 침체되었다.<br>(나) 신항로 개척 이후 절대 왕정이 수출을 장려하고 수입을 억제하였다.<br>(다) 뉴욕 주식 시장의 폭락으로 기업과 은행이 잇따라 무너졌다.<br>(라) 증기 기관을 이용한 공장에서 상품이 대량으로 만들어졌다.</p>', c: ['(라) → (나) → (다) → (가)', '(나) → (다) → (라) → (가)', '(나) → (라) → (다) → (가)', '(나) → (라) → (가) → (다)', '(라) → (나) → (가) → (다)'], a: 2, e: '중상주의(나), 산업 혁명(라), 대공황(다), 석유 파동(가) 순서예요.', cs: ['merc', 'ind', 'dep', 'stag'], steps: ['① 16~18세기: 중상주의', '② 18세기 후반: 산업 혁명', '③ 1929년: 대공황', '④ 1970년대: 석유 파동'] },
  { id: '2-d4', t: 'mc', q: '표는 경제 체제 A, B를 비교한 것이다. 이에 대한 옳은 설명만을 <보기>에서 고른 것은?', data: tbl(['구분', 'A', 'B'], [['경제 문제 해결', '시장 가격', '정부의 계획과 명령'], ['생산 수단 소유', '주로 개인', '주로 사회·국가']]), box: ['A에서는 경제적 유인이 강조된다.', 'A에서는 정부가 생산량과 가격을 정한다.', 'B는 A보다 자원 배분의 효율성이 낮은 편이다.', '오늘날 대부분의 나라는 B를 원래 모습 그대로 유지한다.'], c: COMBO, a: 1, e: 'A는 시장경제, B는 계획경제 체제예요. 시장경제는 경제적 유인이 강하고, 계획경제는 효율성이 낮은 편이에요. 오늘날 대부분의 나라는 혼합 경제 체제예요.', cs: ['mkt', 'plan', 'mixed'] },
  { id: '2-d5', t: 'mc', q: '그래프는 1929~1937년 미국의 실업률(대략적인 값)을 나타낸다. 이 시기에 대한 설명으로 옳은 것은? (단위: %)', chart: { labels: ['1929', '1931', '1933', '1935', '1937'], a: [3, 16, 25, 20, 14], an: '실업률' }, c: ['이 시기 미국 정부는 자유방임을 더 강화하였다.', '실업률이 높아지자 유효 수요도 늘었다.', '석유 파동으로 인한 스태그플레이션이 원인이었다.', '1933년 무렵에는 노동자 네 명 가운데 한 명꼴로 일자리가 없었다.', '공기업 민영화로 불황을 극복하였다.'], a: 3, e: '1933년 실업률은 약 25%로 네 명 중 한 명꼴이었어요. 일자리를 잃은 사람이 늘면 유효 수요는 줄어요. 이 시기 미국은 뉴딜로 정부 개입을 넓혔어요.', cs: ['dep', 'effd', 'newdeal'], src: '천재2 67쪽' },
  { id: '2-d6', t: 'mc', q: '다음 사례의 ㉮~㉰에 해당하는 경제 체제를 바르게 짝지은 것은?', data: '<p>쌀 생산량이 크게 줄었을 때, ㉮ 나라는 쌀값이 오르도록 두어 소비가 줄게 했고, ㉯ 나라는 정부가 배급량을 줄였으며, ㉰ 나라는 가격은 시장에 맡기되 정부가 보조금을 주어 소비를 도왔다.</p>', c: ['㉮ 계획 · ㉯ 시장 · ㉰ 혼합', '㉮ 시장 · ㉯ 혼합 · ㉰ 계획', '㉮ 혼합 · ㉯ 계획 · ㉰ 시장', '㉮ 계획 · ㉯ 혼합 · ㉰ 시장', '㉮ 시장 · ㉯ 계획 · ㉰ 혼합'], a: 4, e: '가격에 맡기면 시장경제, 정부 배급은 계획경제, 시장을 바탕으로 정부가 보완하면 혼합 경제예요.', cs: ['mkt', 'plan', 'mixed'], src: '천재2 71쪽 사례와 같은 구조' },
  { id: '2-d7', t: 'mc', q: '다음 자료에 나타난 정책에 대한 옳은 설명만을 <보기>에서 고른 것은?', data: '<p>1980년대 이후 여러 나라가 공기업을 민간에 팔고, 기업 규제를 풀고, 복지 지출을 줄였다.</p>', box: ['대공황을 극복하려는 정책이었다.', '정부의 시장 개입을 확대하였다.', '정부 실패에 대한 비판이 배경이었다.', '빈부 격차가 커질 수 있다는 비판을 받았다.'], c: COMBO, a: 4, e: '신자유주의 정책이에요. 정부 실패 비판이 배경이었고, 빈부 격차 확대와 시장 불안정이 한계로 꼽혀요.', cs: ['neolib'], src: '비상2 63쪽' },
  { id: '2-d8', t: 'mc', q: '그림은 시기별 정부의 시장 개입 정도를 나타낸다. A~C 시기의 자본주의를 바르게 짝지은 것은? (A: 18~19세기, B: 1930~1970년대, C: 1980년대 이후)', chart: { labels: ['A', 'B', 'C'], a: [2, 8, 4], an: '정부 개입 정도' }, c: ['상업 · 산업 · 수정', '산업 · 수정 · 신자유주의', '산업 · 신자유주의 · 수정', '수정 · 산업 · 신자유주의', '상업 · 수정 · 신자유주의'], a: 1, e: 'A는 자유방임의 산업 자본주의, B는 적극 개입의 수정 자본주의, C는 개입을 줄인 신자유주의예요.', cs: ['ind', 'keynes', 'neolib', 'govsize'] },
  { id: '2-i1', t: 'mc', tag: '윤리 연계', q: '다음 사상가 갑의 입장으로 가장 적절한 것은?', data: '<p>갑: 사람은 자기 이익을 좇지만, 다른 사람의 처지에 공감하는 마음도 지니고 있다. 시장이 제대로 돌아가려면 정의의 규칙이 지켜져야 한다.</p>', c: ['시장 거래에는 도덕이 필요 없다.', '사익 추구는 공정한 규칙 안에서 이루어져야 한다.', '국가가 모든 상품의 가격을 정해야 한다.', '이기심은 모든 경제 문제의 원인이므로 없애야 한다.', '공감은 계획경제에서만 생길 수 있다.'], a: 1, e: '갑은 공감과 정의를 함께 강조했어요. 사익 추구를 인정하되 공정한 규칙 안에서 이루어져야 한다고 봐요. 『도덕 감정론』을 쓴 애덤 스미스의 생각과 같아요.', cs: ['laissez', 'freedom'] },
  { id: '2-i2', t: 'mc', tag: '지리 연계', q: '다음 자료에 대한 옳은 설명만을 <보기>에서 고른 것은?', data: '<p>18~19세기 영국에서는 방직 공장이 들어선 맨체스터 같은 도시로 농촌 사람들이 몰려들었다. 공장 주변 노동자들은 좁고 위생이 나쁜 집에서 살았다.</p>', box: ['산업 혁명은 이촌 향도와 도시화를 이끌었다.', '이 시기 생산 과정에서 이윤을 추구하는 자본주의가 발달하였다.', '정부는 뉴딜 정책으로 노동자의 주거 문제를 해결하였다.', '공업의 입지는 석탄과 노동력의 분포와 관계가 없었다.'], c: COMBO, a: 0, e: '산업 혁명은 공업 도시로의 인구 이동을 이끌었고 산업 자본주의가 발달했어요. 뉴딜은 1930년대 미국의 정책이고, 당시 공업은 석탄 산지와 노동력이 풍부한 곳에 몰렸어요.', cs: ['ind'] },
  { id: '2-i3', t: 'mc', tag: '정의·복지 연계', q: '다음 사례에 대한 설명으로 옳은 것은?', data: '<p>갑국은 1930년대 이후 실업 보험과 연금을 도입해, 일자리를 잃거나 나이가 들어도 누구나 최소한의 생활을 누릴 수 있도록 하였다.</p>', c: ['신자유주의가 추구한 복지 축소 사례이다.', '사유 재산 제도를 폐지한 사례이다.', '중상주의 정책의 결과이다.', '수정 자본주의 시기의 복지 확대와 관련이 있다.', '정부 실패를 해결하려고 시장 개입을 줄인 사례이다.'], a: 3, e: '대공황 뒤 정부의 역할을 키운 수정 자본주의 시기에 복지 제도가 넓어졌어요.', cs: ['keynes'] },
  { id: '2-b1', t: 'mc', q: '다음 갑~병의 주장에 대한 설명으로 옳은 것은?', data: '<p>갑: 시장의 보이지 않는 손이 자원을 효율적으로 나눕니다.<br>을: 불황의 원인은 유효 수요의 부족이니 정부가 지출을 늘려야 합니다.<br>병: 정부가 경제를 계획하려 하면 개인의 자유와 효율이 무너집니다.</p>', c: ['갑은 대공황 극복을 위한 공공사업을 주장하였다.', '을은 스태그플레이션 시기에 정부 역할 축소를 주장하였다.', '병의 주장은 신자유주의의 이론적 바탕이 되었다.', '갑과 을은 모두 작은 정부를 지지한다.', '을과 병은 모두 정부의 적극적 개입을 지지한다.'], a: 2, e: '갑은 애덤 스미스, 을은 케인스, 병은 하이에크의 생각이에요. 하이에크의 생각은 신자유주의의 바탕이 되었어요.', cs: ['laissez', 'keynes', 'neolib'] },
  { id: '2-b2', t: 'mc', q: '다음 (가)~(라)를 일어난 순서대로 나열한 것은?', data: '<p>(가) 정부가 실업 보험을 넓히고 대규모 댐을 지었다.<br>(나) 정부가 공기업을 팔고 규제를 풀었다.<br>(다) 왕실이 금·은을 모으려고 수입을 막았다.<br>(라) 공장주들이 정부 간섭 없는 자유로운 시장을 요구했다.</p>', c: ['(다) → (가) → (라) → (나)', '(라) → (다) → (가) → (나)', '(다) → (라) → (나) → (가)', '(다) → (라) → (가) → (나)', '(라) → (다) → (나) → (가)'], a: 3, e: '상업 자본주의(다), 산업 자본주의(라), 수정 자본주의(가), 신자유주의(나) 순서예요.', cs: ['merc', 'ind', 'keynes', 'neolib'] },
  { id: '2-b3', t: 'mc', q: '수정 자본주의에 대한 옳은 설명만을 <보기>에서 고른 것은?', box: ['1929년 대공황을 계기로 등장하였다.', '사유 재산 제도를 부정하였다.', '유효 수요를 늘리려고 정부 지출을 확대하였다.', '공기업 민영화를 추진하였다.'], c: COMBO, a: 1, e: '수정 자본주의는 대공황을 계기로 정부 지출을 늘려 유효 수요를 만들었어요. 사유 재산은 인정했고, 민영화는 신자유주의 정책이에요.', cs: ['keynes', 'effd'] },
  { id: '2-b4', t: 'mc', q: '다음 경제 체제 A~C에 대한 옳은 설명만을 <보기>에서 고른 것은?', data: '<p>A는 시장 가격으로, B는 정부의 계획으로 경제 문제를 해결한다. C는 A를 기반으로 B의 요소를 일부 받아들였다.</p>', box: ['A는 B보다 개인의 경제적 자유를 폭넓게 보장한다.', 'B는 A보다 분배의 평등을 중시한다.', '우리나라는 B를 기반으로 한 C이다.', 'C에서는 시장과 정부가 대립하기만 한다.'], c: COMBO, a: 0, e: 'A 시장경제는 자유를, B 계획경제는 분배의 평등을 중시해요. 우리나라는 A를 기반으로 한 혼합 경제(C)이고, C에서 시장과 정부는 서로 보완해요.', cs: ['mkt', 'plan', 'mixed'] },
  { id: '2-b5', t: 'mc', q: '다음 흐름의 (가), (나)에 들어갈 말로 옳은 것은? "석유 파동 → (가) → 정부 대처의 한계와 정부 실패 → (나)의 등장"', c: ['(가) 대공황 · (나) 수정 자본주의', '(가) 산업 혁명 · (나) 자유방임주의', '(가) 디플레이션 · (나) 계획경제', '(가) 독점 · (나) 중상주의', '(가) 스태그플레이션 · (나) 신자유주의'], a: 4, e: '석유 파동이 스태그플레이션을 낳았고, 정부 실패 비판 속에 신자유주의가 등장했어요.', cs: ['stag', 'neolib'] },
  { id: '2-b6', t: 'mc', q: '다음 갑, 을의 주장에 대한 설명으로 옳은 것은?', data: '<p>갑: 불황일 때는 정부가 지출을 늘려 일자리를 만들어야 합니다.<br>을: 정부가 커지면 비효율과 재정 적자가 생깁니다. 시장에 맡겨야 합니다.</p>', c: ['을은 수정 자본주의를 지지한다.', '갑은 공기업 민영화를 지지한다.', '을은 유효 수요 창출을 위한 공공사업을 강조한다.', '갑과 을은 모두 계획경제 체제를 지지한다.', '갑의 주장은 뉴딜 정책과 맥을 같이한다.'], a: 4, e: '갑은 큰 정부(케인스, 뉴딜), 을은 작은 정부(신자유주의) 쪽이에요.', cs: ['govsize', 'newdeal', 'neolib'] },
  { id: '2-b7', t: 'mc', q: '다음 사례에 대한 설명으로 옳은 것은?', data: '<p>갑국 정부는 불황기에 고속도로를 건설해 실업자를 고용하였다. 임금을 받은 노동자들이 소비를 늘리자 기업의 생산도 늘었다.</p>', c: ['신자유주의 정책의 전형이다.', '정부 실패를 해결하려고 개입을 줄인 사례이다.', '유효 수요를 늘려 불황에서 벗어나려 한 정책이다.', '중상주의의 보호 무역 정책이다.', '계획경제 체제로 바꾼 사례이다.'], a: 2, e: '공공사업으로 일자리와 소득을 만들어 유효 수요를 늘린 케인스식 정책이에요.', cs: ['effd', 'keynes'] },

  { id: '3-d1', t: 'mc', q: '표는 재화 A~D의 성질을 나타낸다. 이에 대한 설명으로 옳은 것은?', data: tbl(['재화', '값을 안 낸 사람을 막을 수 있나', '누가 쓰면 남의 몫이 줄어드나'], [['A', '있다', '줄어든다'], ['B', '없다', '줄지 않는다'], ['C', '없다', '줄어든다'], ['D', '있다', '줄지 않는다']]), c: ['A는 공공재이다.', 'C는 비경합성을 가진다.', 'D는 대가를 치르지 않아도 소비할 수 있다.', 'B는 시장에서 충분히 공급된다.', 'B는 무임승차자 문제가 나타나기 쉽다.'], a: 4, e: 'B는 비배제성과 비경합성을 모두 가진 공공재라 무임승차자 문제가 생겨요. A는 보통의 재화, C는 어장 같은 공유 자원(1장 공유지의 비극), D는 값을 내야 쓸 수 있어요.', cs: ['pubgood', 'nonexcl', 'nonriv', 'freerider'], trap: '배제성과 경합성 판별' },
  { id: '3-d2', t: 'mc', q: '다음 사례에 대한 옳은 설명만을 <보기>에서 고른 것은?', data: '<p>갑: 공장의 매연 때문에 이웃 주민들이 기침으로 고생하지만 공장은 아무 보상도 하지 않는다.<br>을: 집 앞에 꽃밭을 가꾸자 지나가는 사람들이 즐거워했지만 을은 아무 대가도 받지 못했다.</p>', box: ['갑의 사례는 외부 불경제이다.', '을의 사례에서는 사회적으로 바람직한 수준보다 적게 생산되기 쉽다.', '갑의 사례에서는 사회적으로 바람직한 수준보다 적게 생산된다.', '을의 사례에는 부담금 부과가 알맞은 대책이다.'], c: COMBO, a: 0, e: '갑은 외부 불경제로 과다 생산, 을은 외부 경제로 과소 생산이 나타나요. 을에게는 보조금이 알맞아요.', cs: ['extneg', 'extpos', 'overunder'] },
  { id: '3-d3', t: 'mc', q: '다음 게임에서 갑이 받는 이자의 합은?', data: '<p>개인 계좌의 이자는 10%, 공동 계좌의 이자는 20%이다. 공동 계좌에서 나온 이자는 참여자 5명이 똑같이 나눈다. 갑은 개인 계좌에 60만 원, 공동 계좌에 40만 원을 넣었고, 5명이 공동 계좌에 넣은 돈은 모두 200만 원이다.</p>', c: ['10만 원', '14만 원', '18만 원', '26만 원', '46만 원'], a: 1, e: '개인 계좌 이자 60 × 10% = 6만 원, 공동 계좌 이자 200 × 20% = 40만 원을 5명이 나눠 8만 원이에요. 합은 14만 원이에요. 공동 계좌 몫은 넣은 돈과 상관없이 똑같이 받으니 무임승차의 유혹이 생겨요.', cs: ['freerider', 'pubgood'], steps: ['① 개인 계좌 이자 = 60 × 10%', '② 공동 계좌 이자 전체 = 200 × 20%, 이것을 5명이 나눠요.', '③ ①과 ②의 내 몫을 더해요.'], src: '천재2 74쪽 활동과 같은 구조' },
  { id: '3-d4', t: 'mc', q: '다음 사례에 대한 설명으로 옳은 것은?', data: '<p>중고차를 파는 사람은 차의 사고 이력을 알지만 사는 사람은 알기 어렵다. 그래서 사는 사람은 좋은 차도 의심하며 값을 깎으려 하고, 상태가 좋은 차의 주인들은 차를 팔지 않으려 한다.</p>', c: ['외부 경제의 사례이다.', '공공재 부족의 사례이다.', '정보의 비대칭성이 나타난 사례이다.', '담합이 나타난 사례이다.', '비경합성이 나타난 사례이다.'], a: 2, e: '파는 사람과 사는 사람의 정보가 달라 시장이 제대로 작동하지 않는 정보의 비대칭성이에요. 성능 점검 기록 공개, 품질 보증 제도가 대책이에요.', cs: ['asym'] },
  { id: '3-d5', t: 'mc', q: '(가)~(다)의 문제와 대책 A~C를 바르게 연결한 것은?', data: '<p>(가) 기업들이 몰래 가격을 똑같이 올렸다.<br>(나) 공장 폐수로 어장이 오염되었다.<br>(다) 꺼진 등대를 아무도 고치려 하지 않는다.</p><p>A: 공정 거래 규제 · B: 부담금 부과 · C: 정부의 직접 공급</p>', c: ['(가) B · (나) A · (다) C', '(가) A · (나) C · (다) B', '(가) C · (나) B · (다) A', '(가) A · (나) B · (다) C', '(가) B · (나) C · (다) A'], a: 3, e: '담합은 공정 거래 규제, 외부 불경제는 부담금, 공공재 부족은 정부의 직접 공급이 대책이에요.', cs: ['govcure', 'cartel', 'extneg', 'pubgood'] },
  { id: '3-d6', t: 'mc', q: '그림은 재화 A, B의 시장 거래량과 사회적으로 바람직한 양을 나타낸다. 이에 대한 설명으로 옳은 것은?', chart: { labels: ['A', 'B'], a: [8, 3], b: [5, 6], an: '시장 거래량', bn: '바람직한 양' }, c: ['A에서는 외부 경제가 나타난다.', 'A에는 세금 감면이 알맞은 대책이다.', 'B는 사회적으로 바람직한 양보다 많이 거래된다.', 'A와 B 모두 시장이 효율적으로 작동한다.', 'B에는 보조금 지급이 대책이 될 수 있다.'], a: 4, e: 'A는 바람직한 양보다 많이(과다) 거래되니 외부 불경제, B는 적게(과소) 거래되니 외부 경제예요. B에는 보조금, A에는 세금·부담금이 대책이에요.', cs: ['overunder', 'extpos', 'extneg'], steps: ['① 시장 거래량과 바람직한 양 가운데 어느 쪽이 큰지 봐요.', '② 과다면 외부 불경제, 과소면 외부 경제예요.', '③ 과다는 세금·부담금, 과소는 보조금이에요.'] },
  { id: '3-d7', t: 'mc', q: '시장 실패와 정부의 역할에 대한 옳은 설명만을 <보기>에서 고른 것은?', box: ['시장 실패는 정부가 시장에 개입하는 근거가 된다.', '정부도 정보 부족이나 비효율로 실패할 수 있다.', '정부가 개입하면 효율이 언제나 높아진다.', '정부 실패가 나타나면 시장 실패는 사라진다.'], c: COMBO, a: 0, e: '시장 실패는 개입의 근거지만, 정부 실패도 있으니 개입이 늘 효율을 높이지는 않아요.', cs: ['mfail', 'govrole'] },
  { id: '3-d8', t: 'mc', q: '다음 사례에 대한 설명으로 옳은 것은?', data: '<p>밀가루 회사 세 곳이 가격을 함께 올리기로 약속했다가 공정거래위원회에 적발되어 과징금을 냈다.</p>', c: ['담합으로 소비자는 더 싼 값에 살 수 있다.', '불완전 경쟁으로 나타난 문제의 사례이다.', '외부 경제가 나타난 사례이다.', '정보의 비대칭성을 줄인 사례이다.', '과징금은 기업에 주는 보조금의 일종이다.'], a: 1, e: '경쟁해야 할 기업들이 짜고 값을 올린 담합은 불완전 경쟁의 문제예요. 과징금은 벌로 매기는 돈이에요.', cs: ['cartel', 'ftclaw', 'imperf'] },
  { id: '3-i1', t: 'mc', tag: '환경 연계', q: '다음 사례에 대한 설명으로 옳은 것은?', data: '<p>강 상류의 공장이 폐수를 흘려보내 하류 마을의 어획량이 크게 줄었다. 공장은 어민에게 아무런 보상도 하지 않았다.</p>', c: ['하류 어민이 공장에 이익을 주고 있다.', '공장은 사회적으로 바람직한 양보다 적게 생산한다.', '폐수는 외부 불경제이며 부담금 부과가 대책이 될 수 있다.', '강물은 누구도 쓸 수 없는 공공재이다.', '정부가 개입할 필요가 전혀 없다.'], a: 2, e: '상류의 생산이 하류에 손해를 주고도 대가를 치르지 않는 외부 불경제예요. 과다 생산되니 부담금으로 비용을 치르게 해요.', cs: ['extneg', 'govcure'] },
  { id: '3-i2', t: 'mc', tag: '윤리 연계', q: '다음 갑의 입장에 대한 설명으로 가장 적절한 것은?', data: '<p>갑: 국방과 치안의 혜택은 모두가 함께 누린다. 그러니 공동체 구성원이라면 저마다 능력에 맞게 그 비용을 함께 부담해야 한다.</p>', c: ['갑은 공공재를 시장에만 맡겨야 한다고 본다.', '갑은 비용을 내지 않고 혜택만 누리는 것을 바람직하게 여긴다.', '갑은 공공재의 비경합성을 부정한다.', '갑의 입장은 세금으로 공공재를 공급하는 근거가 될 수 있다.', '갑은 국방을 사적 재화로 본다.'], a: 3, e: '갑은 무임승차를 경계하고 공동 부담을 강조해요. 세금으로 공공재를 공급하는 근거가 돼요.', cs: ['pubgood', 'freerider'] },
  { id: '3-i3', t: 'mc', tag: '법·정치 연계', q: '다음 법에 대한 설명으로 옳은 것은?', data: '<p>우리나라는 「독점 규제 및 공정 거래에 관한 법률」을 만들고, 이 법에 따라 공정거래위원회를 두고 있다.</p>', c: ['외부 경제를 늘리려는 법이다.', '공공재를 직접 생산하게 하는 법이다.', '정보의 비대칭성을 모두 없애는 법이다.', '소득 재분배를 위한 법이다.', '공정한 경쟁을 촉진해 불완전 경쟁 문제를 줄이려는 법이다.'], a: 4, e: '독과점의 횡포와 담합을 규제해 공정한 경쟁을 되살리려는 법이에요.', cs: ['ftclaw', 'imperf'], src: '수특2 77쪽' },
  { id: '3-b1', t: 'mc', q: '다음 흐름의 (가), (나)에 들어갈 말로 옳은 것은?', data: '<p>경쟁 기업들의 가격 약속 → (가) → 소비자 피해 → (나)의 조사와 과징금</p>', c: ['(가) 담합 · (나) 공정거래위원회', '(가) 외부 경제 · (나) 공정거래위원회', '(가) 담합 · (나) 중앙은행', '(가) 무임승차 · (나) 국회', '(가) 정보 비대칭 · (나) 법원'], a: 0, e: '가격 약속은 담합이고, 공정거래위원회가 조사해요.', cs: ['cartel', 'ftclaw'] },

  csr: { name: '기업의 사회적 책임', core: '기업이 이윤뿐 아니라 노동자, 소비자, 지역 사회, 환경에 대한 책임을 다하려는 노력이에요.', why: '환경 보호, 소비자 안전, 노동자 권리 존중, 기업 윤리 준수가 대표적이에요. 기업의 행동은 사회 전체에 영향을 주기 때문이에요.', exam: '캐럴은 사회적 책임을 경제적 → 법적 → 윤리적 → 자선적 책임의 네 단계 피라미드로 설명했어요.', deep: '피라미드의 단계는 위아래 서열이 아니라, 시대가 흐르며 사회가 기업에 요구한 책임이 더해진 순서예요.', src: '천재2 77쪽 · 비상2 74쪽' },

  labor: { name: '노동권', core: '모든 국민이 인간다운 생활을 위해 일할 기회와 공정한 근로 조건을 요구할 수 있는 권리예요.', why: '헌법 제32조는 근로의 권리와 최저 임금제 시행을, 제33조는 노동 3권을 정해 두었어요.', exam: '노동권(근로권)과 노동 3권은 모두 헌법에 근거해요. "법률에만 있다"는 선지는 틀려요.', deep: '헌법에 근거한 법률로 근로 기준법, 최저 임금법, 노동조합법 등이 만들어졌어요.', src: '천재2 78쪽 · 수특2 77쪽' },
  three: { name: '노동 3권', core: '단결권, 단체 교섭권, 단체 행동권이에요.', why: '단결권은 노동조합을 만들고 가입할 권리, 단체 교섭권은 노동조합이 사용자와 임금·근로 조건을 협상할 권리, 단체 행동권은 협상이 결렬되었을 때 파업 등으로 맞설 권리예요.', exam: '사례가 셋 가운데 무엇인지 고르는 문항이 많아요. 순서도 "단결 → 교섭 → 행동"으로 기억해요.', deep: '노동자 한 사람은 사용자보다 힘이 약하니, 함께 뭉쳐 대등하게 협상하도록 보장한 권리예요.', src: '수특2 77쪽 · 천재2 78쪽' },
  lsa: { name: '근로 기준법과 최저 임금법', core: '근로 기준법은 근로 조건의 최저 기준을, 최저 임금법은 받을 수 있는 임금의 최저 수준을 정해 노동자를 보호해요.', why: '근로 시간, 휴게 시간, 휴일 같은 기준이 있어요. 예를 들어 4시간을 일하면 30분 이상 쉬는 시간을 주어야 해요.', exam: '최저 임금보다 낮게 정한 임금은 둘이 합의했어도 그 부분이 무효예요.', deep: '법이 정한 기준은 "이 아래로는 안 된다"는 최소선이에요. 더 좋은 조건으로 약속하는 것은 얼마든지 괜찮아요.', src: '천재2 78쪽 · 비상2 75쪽' },
  lduty: { name: '노동자의 책임', core: '근로 계약에 따라 성실하게 일하고 전문성을 키우며, 협력적인 노사 관계로 경제 발전에 이바지해야 해요.', why: '기업이 없으면 일자리도 없고, 노동자가 없으면 생산도 없어요. 서로가 동반자라는 의식이 필요해요.', exam: '권리만 있고 책임은 없다는 선지는 틀려요. 경제 주체마다 권리와 책임이 함께 있어요.', deep: '노사가 대화로 문제를 풀면 파업으로 생기는 손실을 모두 줄일 수 있어요.', src: '천재2 78쪽 · 수특2 77쪽' },

  crights: { name: '소비자의 권리', core: '안전할 권리, 알 권리, 선택할 권리, 의견을 반영할 권리, 피해 보상을 받을 권리 등이 있어요.', why: '소비자는 기업보다 정보가 적고 힘이 약해서 법으로 권리를 보장해요. 소비자 기본법이 기본적인 권리를 정해 두었어요.', exam: '피해를 입었을 때는 한국소비자원 같은 기관에 피해 구제를 신청할 수 있어요. 사례와 권리를 짝짓는 문항이 나와요.', deep: '온라인으로 산 물건은 받은 뒤 7일 안에 청약을 철회할 수 있는 것처럼, 거래 방식별로 보호 제도가 있어요.', src: '수특2 77쪽 · 천재2 78쪽' },
  cduty: { name: '소비자의 책임', core: '권리를 정당하게 행사하고, 스스로 지식과 정보를 익히며, 자원을 아끼고 환경을 생각하는 소비를 해야 해요.', why: '사용 설명서를 무시하고 물건을 망가뜨린 뒤 무리한 보상을 요구하면 다른 소비자와 기업 모두 손해를 봐요.', exam: '"소비자는 권리만 있다"는 틀린 선지예요.', deep: '악성 민원이나 허위 후기는 시장의 신뢰를 무너뜨리는 행동이에요.', src: '천재2 78쪽' },

  fair: { name: '공정 무역', core: '개발도상국 생산자에게 정당한 대가가 돌아가도록 하여 생산자가 자립하도록 돕는 무역이에요.', why: '커피·카카오 농민이 헐값에 팔지 않도록 최저 구매 가격을 보장하고 공동체 발전을 지원해요.', exam: '공정 무역 상품 구매는 윤리적 소비의 대표 사례예요. 9장의 지속 가능한 무역과도 이어져요.', deep: '공정 무역 인증 표시가 있는 상품은 정해진 기준을 지켜 생산·거래되었다는 뜻이에요.', src: '비상2 75쪽 · 천재2 78쪽' }
};

  { id: '4-r03', t: 'ox', q: '기업은 생산 요소의 대가로 임금·지대·이자를 지급한다.', a: true, e: '생산 요소 시장의 돈의 흐름이에요.', cs: ['factor'] },
  { id: '4-r04', t: 'ox', q: '지속가능발전은 미래 세대의 필요를 해치지 않으면서 현재의 필요를 채우는 발전이다.', a: true, e: '경제 성장·사회 통합·환경 보전을 함께 추구해요.', cs: ['sd'] },
  { id: '4-r05', t: 'ox', q: '기업가 정신의 핵심은 위험을 피하고 현상을 유지하는 것이다.', a: false, e: '위험을 감수하고 혁신하는 정신이에요.', cs: ['entre'] },
  { id: '4-r06', t: 'ox', q: 'ESG 경영은 환경·사회·지배 구조를 함께 고려하는 경영이다.', a: true, e: 'E·S·G의 세 기준이에요.', cs: ['esg'] },
  { id: '4-r07', t: 'ox', q: '근로 기준법은 근로 조건의 최저 기준을 정한다.', a: true, e: '그보다 좋은 조건은 얼마든지 가능해요.', cs: ['lsa'] },
  { id: '4-r08', t: 'ox', q: '최저 임금보다 낮은 임금도 두 사람이 합의하면 유효하다.', a: false, e: '최저 임금에 못 미치는 부분은 무효예요.', cs: ['lsa'] },
  { id: '4-r09', t: 'ox', q: '단결권은 노동조합을 조직하고 가입할 수 있는 권리이다.', a: true, e: '노동 3권의 첫째예요.', cs: ['three'] },
  { id: '4-r10', t: 'ox', q: '노동 3권은 법률에만 있고 헌법에는 없다.', a: false, e: '헌법 제33조에 규정되어 있어요.', cs: ['labor', 'three'] },
  { id: '4-r11', t: 'ox', q: '소비자는 권리만 있고 책임은 없다.', a: false, e: '권리를 정당하게 행사하고 스스로 정보를 익힐 책임이 있어요.', cs: ['cduty'] },
  { id: '4-r12', t: 'ox', q: '공정 무역은 생산자에게 정당한 대가가 돌아가게 하려는 무역이다.', a: true, e: '생산자의 자립을 돕는 무역이에요.', cs: ['fair'] },
  { id: '4-r13', t: 'ox', q: '정부는 소득 재분배에 전혀 관여하지 않는다.', a: false, e: '누진세와 사회 보장 제도로 소득을 재분배해요.', cs: ['gov4'] },
  { id: '4-r14', t: 'ox', q: '기업의 사회적 책임은 기업에 손해만 줄 뿐 이익은 전혀 없다.', a: false, e: '평판과 신뢰가 올라 오래가는 기업이 되는 데 도움이 돼요.', cs: ['csr', 'esg'] },
  { id: '4-r15', t: 'blank', q: '가계가 노동을 제공하고 받는 대가는 (＿＿)이다.', c: ['임금', '지대'], a: 0, e: '노동의 대가는 임금이에요.', cs: ['factor'] },
  { id: '4-r16', t: 'blank', q: '노동조합이 사용자와 협상할 권리는 (＿＿)권이다.', c: ['단체 행동', '단체 교섭'], a: 1, e: '단체 교섭권이에요.', cs: ['three'] },
  { id: '4-r17', t: 'blank', q: '교섭이 결렬되면 파업 등으로 맞설 수 있는 권리는 (＿＿)권이다.', c: ['단체 행동', '단결'], a: 0, e: '단체 행동권이에요.', cs: ['three'] },
  { id: '4-r18', t: 'blank', q: '소비자가 생산을 이끄는 힘을 가진다는 것은 소비자 (＿＿)이다.', c: ['책임', '주권'], a: 1, e: '소비자 주권이에요.', cs: ['csov'] },
  { id: '4-r19', t: 'blank', q: '위험을 무릅쓰고 혁신하려는 정신은 (＿＿) 정신이다.', c: ['기업가', '소비자'], a: 0, e: '기업가 정신이에요.', cs: ['entre'] },
  { id: '4-r20', t: 'blank', q: '환경·사회·지배 구조를 함께 고려하는 경영은 (＿＿) 경영이다.', c: ['독점', 'ESG'], a: 1, e: 'ESG 경영이에요.', cs: ['esg'] },
  // 자료 해석
  { id: '4-d1', t: 'mc', q: '다음은 경제 순환의 일부를 설명한 것이다. A, B는 각각 가계, 기업 중 하나이고, (가), (나)는 각각 생산물 시장, 생산 요소 시장 중 하나이다. 이에 대한 설명으로 옳은 것은?', data: '<p>A는 (가) 시장에 노동을 공급하고 임금을 받는다.<br>B는 (나) 시장에 빵을 공급하고 판매 수입을 얻는다.</p>', c: ['A는 생산의 주체이다.', 'B는 (가) 시장에서 공급자이다.', '(나) 시장에서는 지대가 결정된다.', '(가) 시장에서 A는 수요자이다.', '(가) 시장에서 임금이 결정된다.'], a: 4, e: '노동을 공급하는 A는 가계, (가)는 생산 요소 시장이에요. 빵을 공급하는 B는 기업, (나)는 생산물 시장이에요. 임금은 생산 요소 시장에서 정해져요.', cs: ['flow', 'agents'] },
  { id: '4-d2', t: 'mc', q: '다음 사례에 대한 옳은 설명만을 <보기>에서 고른 것은?', data: '<p>(가) 빵 공장 직원들이 모여 노동조합을 만들었다.<br>(나) 노동조합이 회사와 임금 인상을 협상하였다.<br>(다) 협상이 결렬되자 노동조합이 파업에 들어갔다.</p>', box: ['(가)는 단결권을 행사한 것이다.', '(나)는 단체 교섭권을 행사한 것이다.', '(다)는 단체 교섭권을 행사한 것이다.', '노동 3권은 법률에만 규정되어 있다.'], c: COMBO, a: 0, e: '(가) 단결권, (나) 단체 교섭권, (다) 단체 행동권이에요. 노동 3권은 헌법 제33조에 있어요.', cs: ['three', 'labor'] },
  { id: '4-d3', t: 'mc', q: '다음 사례에서 갑이 행사하려는 소비자의 권리로 가장 적절한 것은?', data: '<p>갑은 새로 산 전기 주전자가 처음부터 물이 샜다. 가게에 교환을 요구했지만 거절당하자, 갑은 한국소비자원에 피해 구제를 신청하였다.</p>', c: ['단결할 권리', '피해 보상을 받을 권리', '의견을 반영할 권리', '교육을 받을 권리', '단체 교섭권'], a: 1, e: '불량품 때문에 입은 피해를 보상받으려는 거예요.', cs: ['crights'] },
  { id: '4-d4', t: 'mc', q: '표는 두 기업의 올해 활동이다. 이에 대한 설명으로 옳은 것은?', data: tbl(['구분', 'A 기업', 'B 기업'], [['포장', '재활용 용기 도입', '값싼 일회용 포장'], ['노동', '노동조합과 정기 교섭', '휴게 시간 없이 근무'], ['경영', '이사회 회의록 공개', '회계 자료 비공개']]), c: ['A는 이윤을 추구하지 않는 기업이다.', 'B는 ESG 경영을 모범적으로 실천한다.', 'A는 환경·사회·지배 구조를 함께 고려한다.', 'B는 근로 기준법을 잘 지키고 있다.', 'A와 B 모두 사회적 책임을 다하지 않는다.'], a: 2, e: 'A는 재활용 용기(환경), 노조와의 교섭(사회), 회의록 공개(지배 구조)로 ESG를 실천해요. B는 휴게 시간을 주지 않아 근로 기준법도 어기고 있어요.', cs: ['esg', 'csr', 'lsa'] },
  { id: '4-d5', t: 'mc', q: '다음은 캐럴의 기업의 사회적 책임 피라미드이다. (가)~(라)에 들어갈 사례를 바르게 연결한 것은?', data: '<p>(라) 자선적 책임<br>(다) 윤리적 책임<br>(나) 법적 책임<br>(가) 경제적 책임</p>', c: ['(가) 세금을 성실히 낸다', '(나) 이윤을 내 일자리를 지킨다', '(다) 지역 도서관에 기부한다', '(다) 법에 없어도 친환경 포장을 쓴다', '(라) 근로 기준법을 지킨다'], a: 3, e: '(가) 경제적 책임은 이윤과 일자리, (나) 법적 책임은 납세와 법 준수, (다) 윤리적 책임은 법 이상으로 사회의 기대에 맞추는 것, (라) 자선적 책임은 기부와 봉사예요.', cs: ['csr'], src: '비상2 74쪽' },
  { id: '4-d6', t: 'mc', q: '다음 갑, 을의 주장에 대한 설명으로 옳은 것은?', data: '<p>갑: 기업의 책임은 법을 지키면서 이윤을 늘려 주주에게 돌려주는 것뿐입니다.<br>을: 기업은 노동자, 소비자, 지역 사회와 환경에 대한 책임도 함께 져야 합니다.</p>', c: ['갑은 자선적 책임을 가장 중시한다.', '을은 기업의 이윤 추구 자체가 옳지 않다고 본다.', '갑은 ESG 경영의 확대에 찬성할 것이다.', '갑과 을 모두 기업이 법을 어겨도 된다고 본다.', '을은 기업의 사회적 책임을 넓게 인정한다.'], a: 4, e: '을은 이윤 추구를 부정하지 않으면서, 여러 이해관계자와 환경에 대한 책임까지 넓게 인정해요.', cs: ['csr', 'esg'] },
  { id: '4-d7', t: 'mc', q: '다음 사례에 대한 옳은 설명만을 <보기>에서 고른 것은?', data: '<p>동물 실험을 하는 화장품에 대한 불매 운동이 퍼지자, 여러 화장품 기업이 동물 실험을 중단하고 대체 시험법을 쓰겠다고 발표하였다.</p>', box: ['윤리적 소비의 사례이다.', '기업이 소비자와 상관없이 생산을 정한 사례이다.', '소비자 주권이 드러난 사례이다.', '정부가 가격을 통제한 사례이다.'], c: COMBO, a: 1, e: '소비자의 윤리적 선택이 기업의 생산 방식을 바꾼 사례로, 소비자 주권이 드러났어요.', cs: ['ethcon', 'csov'] },
  { id: '4-d8', t: 'mc', q: '다음 사례에 대한 설명으로 옳은 것은?', data: '<p>편의점에서 일하는 을은 하루 5시간씩 일하는데 쉬는 시간을 한 번도 받지 못했다. 사장은 을이 동의했으니 문제가 없다고 말했다.</p>', c: ['근로 기준법이 정한 휴게 시간을 지키지 않았다.', '을이 동의했으므로 법 위반이 아니다.', '이 문제는 소비자의 권리와 관련 있다.', '휴게 시간은 단체 교섭권으로만 보장된다.', '근로 기준법은 정규직에게만 적용된다.'], a: 0, e: '4시간을 일하면 30분 이상 쉬게 해야 해요. 법이 정한 최저 기준은 당사자가 동의해도 낮출 수 없어요.', cs: ['lsa'] },
  // 통합형
  { id: '4-i1', t: 'mc', tag: '윤리 연계', q: '다음 글의 관점에서 공정 무역 커피 구매에 대해 내릴 평가로 가장 적절한 것은?', data: '<p>정의로운 사회는 가장 불리한 처지에 있는 사람에게도 정당한 몫이 돌아가도록 제도를 설계해야 한다.</p><p>공정 무역 커피는 개발도상국 농민에게 최저 구매 가격을 보장하고, 마을 학교를 짓는 기금도 지원한다.</p>', c: ['가격이 비싸므로 어떤 경우에도 정의롭지 않다.', '개인의 소비는 사회 정의와 아무 관계가 없다.', '불리한 처지의 생산자에게 정당한 몫이 돌아가게 하므로 바람직하다.', '생산자의 소득을 낮추므로 부정의하다.', '국가 간 무역을 모두 금지해야 정의가 실현된다.'], a: 2, e: '가장 불리한 사람에게 정당한 몫이 돌아가도록 하는 관점에서, 공정 무역은 생산자에게 정당한 대가를 보장해 바람직해요.', cs: ['fair', 'ethcon'] },
  { id: '4-i2', t: 'mc', tag: '지리 연계', q: '다음 자료에 대한 설명으로 옳은 것은?', data: tbl(['구분', '이동 거리', '운송 수단'], [['A 딸기 (우리 지역 농장)', '약 20km', '트럭'], ['B 딸기 (외국산)', '약 9,000km', '비행기와 트럭']]) + '<p class="note">먹을거리가 생산지에서 식탁까지 이동한 거리를 푸드 마일리지라고 한다.</p>', c: ['B는 A보다 푸드 마일리지가 짧다.', 'A를 사는 것은 공정 무역 상품 구매이다.', 'B는 운송 과정에서 탄소를 덜 배출한다.', 'A를 사는 것은 로컬 푸드 소비로 탄소 배출을 줄이는 데 도움이 된다.', 'A와 B의 소비는 환경에 주는 영향이 같다.'], a: 3, e: '가까운 곳에서 온 로컬 푸드는 이동 거리가 짧아 운송에서 나오는 탄소가 적어요. 윤리적 소비의 한 방법이에요.', cs: ['ethcon', 'sd'] },
  { id: '4-i3', t: 'mc', tag: '헌법 연계', q: '다음 헌법 조항에 대한 설명으로 옳은 것은?', data: '<p>제32조 ① 모든 국민은 근로의 권리를 가진다. 국가는 … 법률이 정하는 바에 의하여 최저 임금제를 시행하여야 한다.<br>제33조 ① 근로자는 근로 조건의 향상을 위하여 자주적인 단결권·단체 교섭권 및 단체 행동권을 가진다.</p>', c: ['노동 3권은 사용자에게만 보장된다.', '최저 임금제는 헌법과 관계없는 제도이다.', '단체 행동권은 헌법이 아니라 회사 규칙에 근거한다.', '근로의 권리는 일부 국민에게만 인정된다.', '노동 3권과 최저 임금제는 모두 헌법에 근거를 둔다.'], a: 4, e: '제32조는 근로의 권리와 최저 임금제를, 제33조는 노동 3권을 정해요.', cs: ['labor', 'three', 'lsa'], src: '천재2 78쪽' },
  // 보스전: 소비자 분쟁 조정실
  { id: '4-b1', t: 'mc', q: '다음 사례에 대한 설명으로 옳은 것은?', data: '<p>병은 온라인으로 산 운동화를 받은 지 3일째에 마음에 들지 않아 반품을 요청하였다.</p>', c: ['온라인 구매는 받은 뒤 7일 안에 청약을 철회할 수 있다.', '한번 산 물건은 어떤 경우에도 반품할 수 없다.', '반품 요청은 단체 교섭권의 행사이다.', '병은 소비자의 책임을 어겼다.', '청약 철회는 판매자만 할 수 있다.'], a: 0, e: '전자 상거래로 산 물건은 받은 날부터 7일 안에 청약을 철회할 수 있어요.', cs: ['crights'] },
  { id: '4-b2', t: 'mc', q: '다음 사례에서 정이 소홀히 한 것으로 가장 적절한 것은?', data: '<p>정은 사용 설명서에 "물에 넣지 마세요"라고 적힌 전자 체중계를 물로 씻다가 고장 냈다. 정은 판매자에게 새 제품으로 바꿔 달라고 계속 요구하였다.</p>', c: ['단결권', '소비자의 책임', '기업가 정신', '최저 임금법', '단체 행동권'], a: 1, e: '스스로 정보를 익히고 물건을 올바르게 쓰는 것은 소비자의 책임이에요.', cs: ['cduty'] },

  { id: '5-d1', t: 'mc', q: '그림은 금융 자산 A~C의 특징을 점수로 나타낸 것이다. A~C는 각각 예금, 채권, 주식 중 하나이다. 이에 대한 설명으로 옳은 것은? (점수가 클수록 높음)', chart: { labels: ['A', 'B', 'C'], a: [5, 3, 1], b: [1, 3, 5], an: '안전성', bn: '수익성' }, c: ['A는 배당 수익을 기대할 수 있다.', 'B를 가진 사람은 회사의 주주가 된다.', 'C는 예금자 보호 대상이다.', 'A는 C보다 가격 변동이 크다.', 'C는 시세 차익을 기대할 수 있다.'], a: 4, e: '안전성이 가장 높은 A는 예금, 중간인 B는 채권, 수익성이 가장 높은 C는 주식이에요. 주식은 배당과 시세 차익을 기대할 수 있어요.', cs: ['deposit', 'bond', 'stock', 'tradeoff'] },
  { id: '5-d2', t: 'mc', q: '표는 두 금융 자산을 비교한 것이다. A, B는 각각 채권, 주식 중 하나이다. 이에 대한 옳은 설명만을 <보기>에서 고른 것은?', data: tbl(['구분', 'A', 'B'], [['발행하면 늘어나는 것', '발행자의 부채', '발행자의 자본금'], ['투자자의 지위', '(가)', '(나)']]), box: ['A는 채권, B는 주식이다.', '(가)는 채권자, (나)는 주주이다.', 'A를 가진 사람은 배당을 받는다.', 'B는 원금과 이자 지급이 약속되어 있다.'], c: COMBO, a: 0, e: '부채가 늘어나는 A는 채권(채권자), 자본금이 늘어나는 B는 주식(주주)이에요. 배당은 주식의 수익이고, 원리금 약속은 채권의 특징이에요.', cs: ['bond', 'stock'], src: '수특2 89쪽 개념 플러스' },
  { id: '5-d3', t: 'mc', q: '다음 사례에서 갑이 가장 중시한 자산 관리 원칙은?', data: '<p>갑은 다음 달 이사할 때 낼 보증금 잔금을 언제든 바로 찾을 수 있는 보통 예금에 넣어 두었다.</p>', c: ['수익성', '유동성', '배당성', '분산성', '위험성'], a: 1, e: '곧 써야 할 돈을 바로 찾을 수 있게 두었으니 유동성을 중시했어요.', cs: ['liquid', 'demand'] },

  { id: '5-d6', t: 'mc', q: '다음 갑, 을의 투자 방식에 대한 설명으로 옳은 것은?', data: tbl(['구분', '예금', '채권', '주식'], [['갑', '0%', '0%', '100%'], ['을', '40%', '30%', '30%']]), c: ['갑은 을보다 안전성을 중시한다.', '을은 한 자산에 모든 돈을 집중하였다.', '갑은 분산 투자를 하였다.', '주가가 크게 떨어지면 을이 갑보다 손실이 크다.', '을은 갑보다 분산 투자를 통해 위험을 줄이고 있다.'], a: 4, e: '을은 세 자산에 나누어 담아 한 자산이 떨어져도 버틸 수 있어요. 갑은 주식에 몰아 가격 변동에 크게 흔들려요.', cs: ['divers', 'tradeoff'] },
  { id: '5-d7', t: 'mc', q: '다음 자료의 (가)에 들어갈 원칙으로 가장 적절한 것은?', data: '<p>금융 소비자 보호에 관한 법률에 따라, 금융 회사는 금융 상품을 권할 때 소비자의 재산 상황, 투자 목적과 경험, 위험에 대한 태도를 먼저 파악하고, 이에 맞지 않는 상품을 권해서는 안 된다. 이를 (가)이라고 한다.</p>', c: ['적합성의 원칙', '수익성의 원칙', '분산성의 원칙', '예금자 보호의 원칙', '배당의 원칙'], a: 0, e: '투자 성향에 맞는 상품을 권하는 적합성의 원칙이에요.', cs: ['profile'], src: '천재2 84쪽' },

  { id: '6-d1', t: 'mc', q: '그림은 생애 주기별 1인당 소득과 소비를 나타낸 가상의 자료이다. A~E가 나이순일 때, 이에 대한 설명으로 옳은 것은?', chart: { labels: ['A', 'B', 'C', 'D', 'E'], a: [0, 30, 60, 40, 10], b: [20, 25, 40, 35, 25], an: '소득', bn: '소비' }, c: ['A 시기에는 저축이 가장 많다.', 'C 시기에 흑자가 가장 크다.', 'E 시기에는 소득이 소비보다 많다.', 'B 시기에는 적자가 나타난다.', 'D 시기부터 소득이 늘기 시작한다.'], a: 1, e: '소득 − 소비가 C에서 20으로 가장 커요. A와 E는 적자예요.', cs: ['curve'] },
  { id: '6-d2', t: 'mc', q: '갑의 금융 생활 설계 활동 (가)~(마)를 과정 순서대로 바르게 나열한 것은?', data: '<p>(가) 가계부로 한 달 수입과 지출을 정리했다.<br>(나) 3년 뒤 대학 등록금 1,000만 원을 모으기로 했다.<br>(다) 매달 25만 원씩 정기 적금에 넣기로 계획했다.<br>(라) 매달 적금에 돈을 넣었다.<br>(마) 장학금을 받게 되어 적금 금액을 줄이기로 계획을 고쳤다.</p>', c: ['(가)-(나)-(다)-(라)-(마)', '(나)-(다)-(가)-(라)-(마)', '(다)-(나)-(가)-(라)-(마)', '(나)-(가)-(라)-(다)-(마)', '(나)-(가)-(다)-(라)-(마)'], a: 4, e: '목표 설정(나) → 상태 분석(가) → 계획 수립(다) → 실행(라) → 평가 및 수정(마)이에요.', cs: ['plan5'] },
  { id: '6-d3', t: 'mc', q: '표는 원금 100만 원을 연 10%로 맡겼을 때의 원리금이다. (가), (나)는 각각 단리, 복리 중 하나이다. 이에 대한 설명으로 옳은 것은?', data: tbl(['구분', '1년 뒤', '2년 뒤', '3년 뒤'], [['(가)', '110', '120', '130'], ['(나)', '110', '121', '133.1']]) + '<p class="note">(단위: 만 원, 세금은 고려하지 않음)</p>', c: ['(가)는 복리 방식이다.', '(나)는 원금에만 이자를 붙인다.', '(나)는 이자에도 이자가 붙는 복리 방식이다.', '기간이 길어질수록 (가)와 (나)의 차이는 줄어든다.', '3년 뒤 (가)가 (나)보다 원리금이 많다.'], a: 2, e: '(가)는 해마다 10만 원씩 느는 단리, (나)는 이자에도 이자가 붙는 복리예요.', cs: ['simple', 'compound'] },
  { id: '6-d4', t: 'mc', q: '다음 사례에서 을에게 해 줄 조언으로 가장 적절한 것은?', data: '<p>을은 비상 자금 300만 원을 모두 3년 만기 정기 예금에 넣어 두었다. 그런데 갑자기 수리비가 필요해 중도에 해지하느라 약속한 이자를 거의 받지 못했다.</p>', c: ['비상 자금은 바로 꺼낼 수 있는 요구불 예금 같은 곳에 두어요.', '비상 자금은 수익성이 가장 높은 주식에 두어요.', '비상 자금은 필요 없어요.', '비상 자금은 만기가 더 긴 상품에 넣어요.', '갑작스러운 지출은 늘 대출로 해결해요.'], a: 0, e: '비상 자금은 유동성이 먼저예요.', cs: ['emerg', 'priority'] },
  { id: '6-d5', t: 'mc', q: '표는 갑의 재무 목표이다. 이에 대한 옳은 설명만을 <보기>에서 고른 것은?', data: tbl(['목표', '필요 금액', '기간'], [['배낭여행', '500만 원', '1년'], ['주택 마련 자금', '1억 원', '10년'], ['노후 자금', '3억 원', '30년']]), box: ['배낭여행 자금은 수익성을 가장 먼저 따진다.', '주택 마련 자금은 중장기 목표이다.', '세 목표 모두 같은 방식으로 준비하는 것이 가장 좋다.', '노후 자금은 기간이 길어 복리의 효과를 크게 누릴 수 있다.'], c: COMBO, a: 3, e: '단기 목표는 안전성과 유동성이 먼저이고, 목표마다 준비 방법이 달라요. 긴 기간은 복리에 유리해요.', cs: ['goal', 'priority', 'compound'] },
  { id: '6-d6', t: 'mc', q: '을은 100만 원을 연 20% 복리로 빌리고 3년 동안 원금과 이자를 전혀 갚지 않았다. 3년 뒤 갚아야 할 금액에 대한 설명으로 옳은 것은? (단, 다른 비용은 없다.)', c: ['160만 원으로, 단리와 같다.', '120만 원이다.', '빚은 복리로 늘지 않는다.', '100만 원 그대로이다.', '약 172.8만 원으로, 빚도 복리로 불어난다.'], a: 4, e: '100 → 120 → 144 → 172.8만 원이에요.', cs: ['debt', 'compound'] },
  { id: '6-d7', t: 'mc', q: '표는 갑과 을의 저축 계획이다. 이에 대한 설명으로 옳은 것은? (단, 둘 다 연 5% 복리로 불어난다.)', data: tbl(['구분', '저축 기간', '넣은 돈 합계', '65세의 금액'], [['갑', '20~39세 (매년 100만 원)', '2,000만 원', '약 1억 1,200만 원'], ['을', '40~64세 (매년 100만 원)', '2,500만 원', '약 4,800만 원']]), c: ['을이 더 많이 넣었으므로 65세 금액도 을이 많다.', '갑은 을보다 적게 넣었지만 불어나는 기간이 길어 65세 금액이 더 많다.', '복리에서는 시작 시기가 결과에 영향을 주지 않는다.', '갑은 단리, 을은 복리로 계산되었다.', '두 사람의 65세 금액은 같다.'], a: 1, e: '일찍 시작한 갑의 돈이 더 오래 복리로 불어났어요.', cs: ['early', 'compound'] },
  { id: '6-d8', t: 'mc', q: '노후 대비에 대한 설명으로 옳은 것은?', c: ['국가가 운영하는 공적 연금과 퇴직 연금, 개인 연금을 함께 쌓을 수 있다.', '노년기에는 소비가 없으므로 준비가 필요 없다.', '노후 준비는 은퇴한 뒤에 시작하는 것이 가장 좋다.', '연금은 한 가지만 가입할 수 있다.', '평균 수명이 늘면 노후 준비 기간은 짧아진다.'], a: 0, e: '연금의 세 층을 함께 쌓고, 일찍 시작할수록 유리해요.', cs: ['retire'] },
  // 통합형
  { id: '6-i1', t: 'mc', tag: '인구 변화 연계', q: '다음 자료가 개인의 금융 생활에 주는 시사점으로 가장 적절한 것은?', data: '<p>평균 수명이 늘어나면서 은퇴한 뒤 살아가는 기간이 이전보다 크게 길어졌다.</p>', c: ['노후 준비는 필요 없어졌다.', '은퇴 뒤 소득이 늘어난다.', '청·장년기의 소비를 모두 늘려야 한다.', '노년기의 적자 기간이 길어져 일찍부터 노후를 준비해야 한다.', '연금은 가입할수록 손해이다.'], a: 3, e: '적자인 노년기가 길어지니 일찍, 꾸준히 준비해야 해요.', cs: ['retire', 'life'] },
  { id: '6-i2', t: 'mc', tag: '수학 연계', q: '1,000만 원을 연 10%로 3년 맡길 때, 복리로 받는 원리금은 단리보다 얼마 많은가? (단, 세금은 고려하지 않는다.)', c: ['0원', '10만 원', '31만 원', '100만 원', '331만 원'], a: 2, e: '단리 1,300만 원, 복리 1,331만 원이라 31만 원 차이예요.', cs: ['compound', 'simple'] },
  { id: '6-i3', t: 'mc', tag: '윤리 연계', q: '다음 글의 관점에서 바람직한 금융 생활 태도로 가장 적절한 것은?', data: '<p>지혜로운 사람은 오늘의 즐거움을 누리되, 내일의 자신을 위한 몫을 남겨 둘 줄 안다.</p>', c: ['오늘 번 돈은 오늘 모두 쓴다.', '미래를 위해 현재의 필요를 모두 포기한다.', '다른 사람의 소비를 따라 한다.', '빚을 내서라도 원하는 것을 지금 산다.', '현재의 필요와 미래의 필요를 균형 있게 계획한다.'], a: 4, e: '현재와 미래 사이의 균형 잡힌 계획이 필요해요.', cs: ['longview', 'budget'] },
  // 보스전: 재무 상담 챌린지
  { id: '6-b1', t: 'mc', q: '[상담 1] 그림은 어느 사람의 생애 주기별 소득과 소비를 나타낸 가상의 자료이다. 이에 대한 설명으로 옳은 것은?', chart: { labels: ['20대', '30대', '40대', '50대', '60대', '70대'], a: [30, 45, 55, 50, 15, 10], b: [25, 35, 45, 40, 30, 28], an: '소득', bn: '소비' }, c: ['60대부터 적자가 나타나므로 50대까지의 흑자를 저축해 대비해야 한다.', '모든 시기에 흑자이다.', '20대에 적자가 가장 크다.', '70대에 흑자가 가장 크다.', '소득은 일생 동안 계속 늘어난다.'], a: 0, e: '60대와 70대는 소비가 소득보다 많은 적자예요.', cs: ['curve', 'retire'] },
  { id: '6-b2', t: 'mc', q: '[상담 2] "매달 말 가계부를 보며 계획대로 되었는지 확인하고, 모자란 부분은 다음 달 계획에 반영해요." 이 활동은 금융 생활 설계의 어느 단계인가?', c: ['재무 목표 설정', '재무 상태 분석', '재무 계획 수립', '재무 계획 실행', '평가 및 수정'], a: 4, e: '결과를 평가하고 계획을 고치는 마지막 단계예요.', cs: ['adjust', 'plan5'] },
  { id: '6-b3', t: 'mc', q: '[상담 3] 다음 사례에 대한 설명으로 옳은 것은?', data: '<p>병은 비상 자금 없이 지내다가 갑자기 200만 원의 수리비가 생겨 높은 이자의 대출을 받았다.</p>', c: ['병은 비상 자금이 있었기 때문에 대출을 받았다.', '미리 비상 자금을 모아 두었다면 대출과 이자 부담을 피할 수 있었다.', '대출은 이자 부담이 없다.', '비상 자금은 주식에 넣어 두는 것이 가장 좋다.', '갑작스러운 지출은 예산과 관계없다.'], a: 1, e: '비상 자금은 빚을 막는 안전판이에요.', cs: ['emerg', 'debt'] },
  { id: '6-b4', t: 'mc', q: '[상담 4] 원금 100만 원을 연 5% 복리로 2년 맡기면 받는 원리금은? (단, 세금은 고려하지 않는다.)', c: ['105만 원', '110만 원', '110.25만 원', '115만 원', '120만 원'], a: 2, e: '100 × 1.05 × 1.05 = 110.25만 원이에요.', cs: ['compound'] },
  { id: '6-b5', t: 'mc', q: '[상담 5] 72의 법칙으로 어림할 때, 연 9% 복리로 원금이 두 배가 되는 데 걸리는 기간은?', c: ['약 4년', '약 6년', '약 72년', '약 8년', '약 18년'], a: 3, e: '72 ÷ 9 = 약 8년이에요.', cs: ['rule72'] },
  { id: '6-b6', t: 'mc', q: '[상담 6] 다음 대화에서 옳게 말한 사람만을 있는 대로 고른 것은?', data: '<p>갑: 노후 준비는 은퇴 직전에 한꺼번에 하는 게 가장 좋아요.<br>을: 복리는 기간이 길수록 효과가 커져요.<br>병: 같은 돈이면 일찍 모으기 시작할수록 유리해요.</p>', c: ['갑', '을', '갑, 을', '갑, 병', '을, 병'], a: 4, e: '복리의 힘 때문에 일찍, 꾸준히 모으는 것이 유리해요.', cs: ['early', 'compound'] },
  { id: '6-b7', t: 'mc', q: '[상담 7] 재무 목표에 대한 옳은 설명만을 <보기>에서 고른 것은?', box: ['재무 목표는 단기 목표와 중장기 목표로 나눌 수 있다.', '목표를 세울 때는 필요한 금액과 기간을 함께 정한다.', '모든 목표는 가장 수익성이 높은 상품으로 준비한다.', '재무 목표는 누구에게나 똑같이 정해져 있다.'], c: COMBO, a: 0, e: '목표는 사람마다 다르고, 기간과 성격에 맞게 준비해요.', cs: ['goal'] },
  { id: '6-b8', t: 'mc', q: '[상담 8] 대출을 받으려는 손님에게 해 줄 조언으로 가장 적절한 것은?', c: ['이자는 신경 쓰지 않아도 돼요.', '빚은 저절로 줄어들어요.', '이자까지 갚을 수 있는지 수입과 지출을 먼저 따져 보세요.', '최대한 많이 빌리는 것이 좋아요.', '대출은 재무 상태와 관계없어요.'], a: 2, e: '부채는 갚을 능력 안에서 계획적으로 써야 해요.', cs: ['debt', 'status'] },
  { id: '6-b9', t: 'mc', q: '[상담 9] 노년기의 적자에 대비하는 방법으로 옳은 것만을 <보기>에서 고른 것은?', box: ['청·장년기의 흑자 일부를 꾸준히 저축한다.', '은퇴한 뒤에 처음으로 저축을 시작한다.', '연금을 일찍부터 쌓아 둔다.', '노년기에는 소비가 없으므로 준비하지 않는다.'], c: COMBO, a: 1, e: '흑자 시기의 저축과 연금으로 적자 시기를 대비해요.', cs: ['retire', 'curve'] },
  { id: '6-b10', t: 'mc', q: '[상담 10] 다음 사례에서 두리가 한 일로 가장 적절한 것은?', data: '<p>두리는 회사 사정으로 월급이 20% 줄자, 외식비를 줄이고 교육비 적금은 유지하되 여행 계획은 1년 미루기로 금융 계획을 다시 짰다.</p>', c: ['재무 목표를 모두 포기했다.', '소득이 줄었는데도 지출을 늘렸다.', '재무 상태를 분석하지 않았다.', '소득 변화에 맞게 계획을 평가하고 수정했다.', '비상 자금을 모두 주식에 넣었다.'], a: 3, e: '소득이 바뀌어 계획을 점검하고 수정했어요.', cs: ['adjust', 'budget'] }
];

  { id: '7-d3', t: 'mc', q: '원/달러 환율이 1월 1,200원에서 6월 1,350원이 되었다. 이 기간의 변화에 대한 설명으로 옳은 것은?', c: ['원화 가치가 달러에 비해 하락하였다.', '달러 가치가 원화에 비해 하락하였다.', '미국 여행 경비 부담이 줄었다.', '미국산 수입품의 원화 가격이 내렸다.', '달러 예금의 원화 환산 가치가 줄었다.'], a: 0, e: '환율이 올랐으니 원화 가치는 떨어지고 달러 가치는 올랐어요.', cs: ['won', 'fxup'] },
  { id: '7-d4', t: 'mc', q: '원/엔 환율이 1년 전 100엔당 1,040원에서 지금 950원이 되었다. 이에 대한 설명으로 옳은 것은? (단, 수수료는 없다.)', c: ['엔화에 비해 원화 가치가 떨어졌다.', '10만 엔을 바꾸는 데 드는 원화가 9만 원 줄었다.', '일본 여행 경비 부담이 커졌다.', '엔화 표시 자산의 원화 환산 가치가 커졌다.', '원/엔 환율이 올랐다.'], a: 1, e: '10만 엔은 1년 전 104만 원, 지금 95만 원이에요. 환율이 내려 원화 가치가 올랐어요.', cs: ['won', 'fxcalc'], src: '비상2 81쪽 자료' },
  { id: '7-d5', t: 'mc', q: '다음 대화에서 갑의 예상이 맞다면 을에게 해 줄 조언으로 가장 적절한 것은?', data: '<p>갑: 기준 금리가 곧 오를 것 같아요.<br>을: 그럼 모아 둔 돈을 예금에 넣을 때 어떻게 하면 좋을까요?</p>', c: ['지금 만기가 가장 긴 예금에 가입한다.', '대출을 최대한 늘린다.', '예금을 모두 해지해 현금으로 둔다.', '만기가 짧은 예금에 가입했다가 금리가 오른 뒤 다시 가입한다.', '금리와 상관없이 아무것도 바꾸지 않는다.'], a: 3, e: '금리가 오른 뒤 높은 금리로 다시 가입할 수 있도록 짧은 만기가 유리해요.', cs: ['rateup', 'findec'], src: '천재2 86쪽 활동' },
  { id: '7-d6', t: 'mc', q: '다음 뉴스에 대한 옳은 설명만을 <보기>에서 고른 것은?', data: '<p>먼 지역에서 전쟁이 일어난 뒤 국제 유가가 최근 5개월 사이 가장 높은 수준으로 올랐다.</p>', box: ['물가가 내려 화폐의 실질 가치가 오를 것이다.', '물가 상승 가능성이 커진다.', '실물 자산에 대한 선호가 커질 수 있다.', '불확실성이 줄어 위험 자산 선호가 커진다.'], c: COMBO, a: 2, e: '유가 상승은 물가를 끌어올리고, 사람들은 실물 자산을 더 찾을 수 있어요.', cs: ['war', 'pricefin'], src: '천재2 87쪽 활동과 같은 구조' },
  { id: '7-d7', t: 'mc', q: '표는 갑~병의 상황이다. 원/달러 환율이 오를 때에 대한 설명으로 옳은 것은?', data: tbl(['구분', '상황'], [['갑', '미국 주식을 가지고 있다.'], ['을', '미국에서 공부하는 자녀에게 매달 달러를 보낸다.'], ['병', '미국산 밀을 수입해 밀가루를 만든다.']]), c: ['갑은 원화 환산 수익이 줄어든다.', '을은 보내야 할 원화가 줄어든다.', '병은 원료를 더 싸게 들여온다.', '세 사람 모두 이익을 본다.', '갑은 이익을 보고, 을과 병은 부담이 커진다.'], a: 4, e: '외화 자산을 가진 갑은 유리하고, 달러를 사야 하는 을과 병은 부담이 커져요.', cs: ['fxup'] },
  { id: '7-d8', t: 'mc', q: '다음 사례에 대한 설명으로 옳은 것은?', data: '<p>금융 회사들이 잇따라 파산하자 주가가 폭락하였고, 사람들은 은행 예금과 현금을 늘렸다.</p>', c: ['수익성보다 안전성과 유동성을 중시한 결정이다.', '위험 자산 선호가 커진 사례이다.', '금융 자산 가격이 크게 오른 사례이다.', '인플레이션의 사례이다.', '환율 하락의 사례이다.'], a: 0, e: '금융 위기 때 나타나는 안전 자산 선호예요.', cs: ['fincrisis', 'safeasset'] },
  { id: '7-d9', t: 'mc', q: '(가)~(라)를 원인에서 결과의 순서로 바르게 나열한 것은?', data: '<p>(가) 대출 이자 부담 증가<br>(나) 기준 금리 인상<br>(다) 소비와 투자 감소<br>(라) 물가 상승 억제</p>', c: ['(가)-(나)-(다)-(라)', '(나)-(가)-(다)-(라)', '(나)-(다)-(가)-(라)', '(라)-(나)-(가)-(다)', '(다)-(가)-(나)-(라)'], a: 1, e: '금리 인상 → 이자 부담 증가 → 소비·투자 감소 → 물가 안정이에요.', cs: ['pricerate', 'baserate'] },
  { id: '7-d10', t: 'mc', q: '표는 어느 가계의 금융 자산 비중 변화이다. 이 변화의 원인으로 가장 적절한 것은?', data: tbl(['구분', 't년', 't+1년'], [['예금', '60%', '40%'], ['주식', '20%', '40%'], ['기타', '20%', '20%']]), c: ['금리 상승', '금융 위기 발생', '불확실성 증가', '금리 하락', '물가 하락'], a: 3, e: '금리가 내리면 예금 비중을 줄이고 수익성 높은 자산 비중을 늘려요.', cs: ['ratedown'] },
  { id: '7-d11', t: 'mc', q: '여행 경비 800달러를 환전하려 한다. 달마다 원/달러 환율이 3월 1,250원, 4월 1,300원, 5월 1,350원이었다면, 원화가 가장 적게 드는 달과 그 금액은? (단, 수수료는 없다.)', c: ['5월, 108만 원', '4월, 104만 원', '3월, 100만 원', '3월, 125만 원', '5월, 100만 원'], a: 2, e: '800 × 1,250 = 100만 원이에요. 환율이 낮을 때 바꾸면 원화가 덜 들어요.', cs: ['fxcalc', 'fxdown'] },
  { id: '7-d12', t: 'mc', q: '다음 사례에 대한 설명으로 옳은 것은?', data: '<p>몇 년째 물가가 조금씩 내려가자 사람들은 물건 사기를 미루고 현금과 예금을 늘렸다.</p>', c: ['화폐의 실질 가치가 떨어졌다.', '실물 자산 선호가 크게 늘었다.', '인플레이션의 사례이다.', '중앙은행이 금리를 올려야 한다는 신호이다.', '화폐의 실질 가치가 올라 현금을 가질 유인이 커졌다.'], a: 4, e: '물가가 내리면 돈의 실질 가치가 올라요.', cs: ['realval', 'pricefin'] },
  // 통합형 (5개 가운데 3개)
  { id: '7-i1', t: 'mc', tag: '지리 연계', q: '다음 자료에 대한 설명으로 옳은 것은?', data: '<p>A국은 원유를 대부분 수입한다. 먼 지역의 분쟁으로 국제 유가가 크게 올랐다.</p>', c: ['A국의 수입 물가와 전체 물가가 오를 수 있다.', 'A국의 물가는 반드시 내린다.', 'A국은 국제 유가와 관계가 없다.', 'A국 화폐의 실질 가치가 오른다.', 'A국 사람들은 실물 자산을 팔 것이다.'], a: 0, e: '에너지를 수입에 기대는 나라일수록 유가 상승이 물가로 이어져요.', cs: ['war'] },
  { id: '7-i2', t: 'mc', tag: '역사 연계', q: '다음 자료에 나타난 시기에 대한 설명으로 옳은 것은?', data: '<p>1997년 말 우리나라는 외환 보유액이 부족해 국제 통화 기금(IMF)의 지원을 받았다. 이 시기 원/달러 환율이 크게 올랐다.</p>', c: ['원화 가치가 크게 올랐다.', '원화 가치가 크게 떨어져 수입 물가 부담이 커졌다.', '해외여행 비용 부담이 줄었다.', '달러 자산의 원화 환산 가치가 줄었다.', '금융 자산 가격이 크게 올랐다.'], a: 1, e: '1997년 외환 위기 때 환율이 치솟아 원화 가치가 크게 떨어졌어요.', cs: ['fincrisis', 'won'] },
  { id: '7-i3', t: 'mc', tag: '환경 연계', q: '다음 변화가 금융 결정에 줄 수 있는 영향으로 가장 적절한 것은?', data: '<p>기후 위기에 대응하려고 여러 나라가 온실가스 감축 정책을 강화하고 있다.</p>', c: ['온실가스를 많이 내는 기업의 투자 수익이 늘어난다.', '환경 정책은 금융 결정과 관계없다.', '친환경 에너지 산업 관련 투자 수익이 늘어날 수 있다.', '모든 산업의 주가가 똑같이 오른다.', '예금 금리가 반드시 내려간다.'], a: 2, e: '저탄소 흐름 속에서 친환경 산업의 수익은 늘고 온실가스 배출 기업은 줄 수 있어요.', cs: ['socenv'], src: '천재2 87쪽' },
  { id: '7-i4', t: 'mc', tag: '수학 연계', q: '작년에 100만 원으로 살 수 있던 물건들의 값이 올해 모두 10% 올랐다. 작년의 100만 원어치를 올해 사려면 필요한 돈은?', c: ['90만 원', '100만 원', '105만 원', '110만 원', '120만 원'], a: 3, e: '100만 원 × 1.1 = 110만 원이에요. 같은 100만 원의 실질 가치는 떨어졌어요.', cs: ['realval', 'inflation'] },
  { id: '7-i5', t: 'mc', tag: '정치 연계', q: '다음 글의 (가)로 가장 적절한 것은?', data: '<p>(가)은/는 물가 안정을 위해 우리나라의 기준 금리를 결정한다. 이렇게 정해진 기준 금리는 시중 은행의 예금과 대출 금리에 영향을 준다.</p>', c: ['국회', '공정거래위원회', '시중 은행', '예금 보험 공사', '한국은행 금융통화위원회'], a: 4, e: '한국은행 금융통화위원회가 기준 금리를 정해요.', cs: ['baserate'] },
  // 보스전: 경제 뉴스 앵커 (15개)
  { id: '7-b1', t: 'mc', q: '[속보 1] "한국은행, 기준 금리 0.5%p 인상" 이 뉴스가 가져올 변화로 옳은 것만을 <보기>에서 고른 것은?', box: ['예금 금리가 오를 수 있다.', '대출 이자 부담이 커질 수 있다.', '대출 수요가 늘어날 것이다.', '주식의 상대적 매력이 커질 것이다.'], c: COMBO, a: 0, e: '금리가 오르면 예금은 매력적이 되고 대출은 부담스러워져요.', cs: ['baserate', 'rateup'] },
  { id: '7-b2', t: 'mc', q: '[속보 2] "원/달러 환율 1,400원 돌파" 이 뉴스에 대한 설명으로 옳은 것은?', c: ['원화 가치가 올랐다.', '달러에 비해 원화 가치가 떨어졌다.', '미국 여행이 더 싸졌다.', '미국산 수입품의 원화 가격이 내린다.', '달러 예금의 원화 가치가 줄었다.'], a: 1, e: '환율 상승 = 원화 가치 하락이에요.', cs: ['won'] },
  { id: '7-b3', t: 'mc', q: '[속보 3] "소비자 물가 5% 급등" 예금 금리가 연 3%일 때 옳은 설명은?', c: ['예금의 실질 가치가 늘어난다.', '현금을 가지고 있는 것이 가장 유리하다.', '예금의 실질 가치가 줄어들 수 있다.', '중앙은행은 금리를 내릴 것이다.', '물가와 예금은 관계없다.'], a: 2, e: '물가 상승률이 이자율보다 높으면 예금의 실질 가치가 줄어요.', cs: ['realval'] },
  { id: '7-b4', t: 'mc', q: '[속보 4] "먼 나라 분쟁으로 국제 유가 급등" 예상되는 흐름을 바르게 연결한 것은?', c: ['유가 상승 → 물가 하락 → 현금 선호', '유가 상승 → 물가 상승 → 화폐의 실질 가치 상승', '유가 하락 → 물가 상승 → 실물 자산 선호', '유가 상승 → 물가 상승 → 실물 자산 선호', '유가 상승 → 금융 자산 가격 급등 → 위험 자산 선호'], a: 3, e: '유가가 오르면 물가가 오르고 실물 자산을 더 찾아요.', cs: ['war', 'pricefin'] },
  { id: '7-b5', t: 'mc', q: '[속보 5] "대형 금융 회사 파산, 주가 폭락" 사람들의 금융 결정으로 가장 적절한 것은?', c: ['빚을 내 주식을 산다.', '위험 자산의 비중을 늘린다.', '유동성을 무시한다.', '수익률만 따진다.', '안전성과 유동성이 높은 자산을 늘린다.'], a: 4, e: '금융 위기 때는 안전성과 유동성이 먼저예요.', cs: ['fincrisis', 'safeasset'] },
  { id: '7-b6', t: 'mc', q: '[속보 6] "기준 금리 역대 최저 수준으로 인하" 나타날 수 있는 변화로 옳은 것은?', c: ['예금 비중을 줄이고 주식 등 수익성 높은 자산 비중을 늘린다.', '대출 이자 부담이 커진다.', '예금 선호가 커진다.', '대출 수요가 크게 준다.', '소비가 줄어든다.'], a: 0, e: '금리가 내리면 예금의 매력이 줄어요.', cs: ['ratedown'] },
  { id: '7-b7', t: 'mc', q: '[속보 7] "원/엔 환율 하락, 일본 여행객 급증" 이 뉴스에 대한 설명으로 옳은 것은?', c: ['엔화에 비해 원화 가치가 떨어졌다.', '엔화에 비해 원화 가치가 올라 일본 여행 경비 부담이 줄었다.', '일본산 수입품의 원화 가격이 오른다.', '엔화 자산의 원화 환산 가치가 커졌다.', '환율 하락은 여행과 관계없다.'], a: 1, e: '환율이 내리면 원화 가치가 올라 여행에 유리해요.', cs: ['fxdown', 'won'] },

  { id: '8-r02', t: 'ox', q: '특화하면 각 나라가 모든 상품을 똑같이 생산하게 된다.', a: false, e: '잘하는 상품에 집중해요.', cs: ['spec'] },
  { id: '8-r03', t: 'ox', q: '규모의 경제는 무역의 이익 가운데 하나이다.', a: true, e: '시장이 넓어져 대량 생산이 가능해요.', cs: ['scale'] },
  { id: '8-r04', t: 'ox', q: '온대 기후 지역은 커피와 카카오를 재배하기 가장 유리하다.', a: false, e: '커피와 카카오는 열대 기후에서 재배해요.', cs: ['nature'] },
  { id: '8-r05', t: 'ox', q: '자본이 풍부한 나라는 의류처럼 노동 집약적 상품 생산에 유리하다.', a: false, e: '자본 집약적 상품이 유리해요.', cs: ['factor8'] },
  { id: '8-r06', t: 'ox', q: '나라마다 기술 수준이 같아 기술은 무역의 원인이 되지 않는다.', a: false, e: '기술 수준의 차이도 무역의 원인이에요.', cs: ['tech'] },
  { id: '8-r07', t: 'ox', q: '절대 우위론은 애덤 스미스가 주장하였다.', a: true, e: '비교 우위론은 리카도예요.', cs: ['absadv'] },
  { id: '8-r08', t: 'ox', q: '비교 우위론은 자유 무역의 이론적 근거가 되었다.', a: true, e: '비교 우위론의 의의예요.', cs: ['freetrade'] },
  { id: '8-r09', t: 'ox', q: '한 나라가 두 재화 모두 절대 우위이면 무역의 이익이 전혀 없다.', a: false, e: '비교 우위로 이익을 얻을 수 있어요.', cs: ['compadv'] },
  { id: '8-r10', t: 'ox', q: '비교 우위는 생산비의 절대적인 크기만으로 정해진다.', a: false, e: '기회비용을 비교해요.', cs: ['compadv', 'ocalc'] },
  { id: '8-r11', t: 'ox', q: '기회비용이 더 큰 재화는 수입하는 것이 유리하다.', a: true, e: '기회비용이 작은 재화를 수출해요.', cs: ['compadv'] },
  { id: '8-r12', t: 'ox', q: '교환 비율은 두 나라의 기회비용 사이에서 정해져야 두 나라 모두 이익이다.', a: true, e: '교환 비율의 조건이에요.', cs: ['tot'] },
  { id: '8-r13', t: 'ox', q: '생산 가능 곡선 안쪽의 점은 자원을 모두 효율적으로 쓰는 점이다.', a: false, e: '자원을 다 쓰지 못한 점이에요.', cs: ['ppf'] },
  { id: '8-r14', t: 'ox', q: '직선인 생산 가능 곡선에서는 기회비용이 일정하다.', a: true, e: '기울기가 일정하니까요.', cs: ['ppf'] },
  { id: '8-r15', t: 'ox', q: '생산 가능 곡선 밖의 점은 무역 없이도 언제나 생산할 수 있다.', a: false, e: '혼자서는 생산할 수 없어요.', cs: ['ppf'] },
  { id: '8-r16', t: 'ox', q: '글로벌 가치 사슬은 상품 생산 과정이 여러 나라에 걸쳐 이루어지는 것이다.', a: true, e: '생산 단계를 나라별로 나눠요.', cs: ['gvc'] },
  { id: '8-r17', t: 'ox', q: '무역을 하면 소비자의 선택 폭이 줄어든다.', a: false, e: '다양한 상품을 고를 수 있어요.', cs: ['tgain'] },
  { id: '8-r18', t: 'ox', q: '부존자원은 나라마다 같다.', a: false, e: '나라마다 양과 질이 달라요.', cs: ['endow'] },
  { id: '8-r19', t: 'ox', q: '비교 우위 재화에 특화하면 무역 전보다 더 많이 소비할 수 있다.', a: true, e: '교환의 이익이에요.', cs: ['tgaincalc'] },
  { id: '8-r20', t: 'ox', q: '두 나라의 기회비용이 같으면 비교 우위가 뚜렷하게 생긴다.', a: false, e: '기회비용이 같으면 비교 우위가 생기지 않아요.', cs: ['compadv'] },
  { id: '8-r21', t: 'ox', q: '국내에서 생산할 수 있는 상품은 무역으로 거래하지 않는다.', a: false, e: '외국이 더 싸게 만들면 수입해요.', cs: ['costdiff'] },
  { id: '8-r22', t: 'blank', q: '각 나라가 유리한 것을 전문적으로 생산하는 것은 (＿＿)이다.', c: ['특화', '관세'], a: 0, e: '특화예요.', cs: ['spec'] },
  { id: '8-r23', t: 'blank', q: '생산량이 늘수록 평균 생산 단가가 내려가는 것은 규모의 (＿＿)이다.', c: ['불경제', '경제'], a: 1, e: '규모의 경제예요.', cs: ['scale'] },
  { id: '8-r24', t: 'blank', q: '절대 우위론을 주장한 학자는 (＿＿)이다.', c: ['애덤 스미스', '리카도'], a: 0, e: '애덤 스미스예요.', cs: ['absadv'] },
  { id: '8-r25', t: 'blank', q: '기회비용이 더 작은 재화에 있는 우위는 (＿＿) 우위이다.', c: ['절대', '비교'], a: 1, e: '비교 우위예요.', cs: ['compadv'] },
  { id: '8-r26', t: 'blank', q: '두 나라 모두 이익이려면 교환 비율이 두 나라의 (＿＿) 사이에 있어야 한다.', c: ['기회비용', '인구'], a: 0, e: '기회비용 사이예요.', cs: ['tot'] },
  { id: '8-r27', t: 'blank', q: '최대로 생산할 수 있는 두 상품의 조합을 나타낸 선은 생산 가능 (＿＿)이다.', c: ['표', '곡선'], a: 1, e: '생산 가능 곡선이에요.', cs: ['ppf'] },
  { id: '8-r28', t: 'blank', q: '석유나 철광석처럼 나라마다 가진 양이 다른 자원은 (＿＿)자원이다.', c: ['부존', '인적'], a: 0, e: '부존자원이에요.', cs: ['endow'] },
  { id: '8-r29', t: 'blank', q: 'X재 10달러, Y재 20달러가 드는 나라의 X재 1단위 기회비용은 Y재 (＿＿)단위이다.', c: ['2', '1/2'], a: 1, e: '10 ÷ 20 = 1/2이에요.', cs: ['ocalc'] },
  { id: '8-r30', t: 'blank', q: '상품 생산 과정이 여러 나라에 걸쳐 이루어지는 것은 글로벌 가치 (＿＿)이다.', c: ['사슬', '분배'], a: 0, e: '글로벌 가치 사슬이에요.', cs: ['gvc'] },
  // 자료 해석 (12개 가운데 8개)
  { id: '8-d1', t: 'mc', q: '표는 갑국과 을국의 X재, Y재 1단위 생산비이다. 이에 대한 설명으로 옳은 것은? (단, 두 나라는 X재와 Y재만 생산한다.)', data: T1H, c: ['을국은 X재 생산에 절대 우위가 있다.', '갑국은 Y재 생산에 비교 우위가 있다.', '갑국은 X재, 을국은 Y재 생산에 비교 우위가 있다.', '을국의 Y재 1단위 생산의 기회비용은 X재 4/3단위이다.', '갑국은 두 재화 모두 절대 우위가 없다.'], a: 2, e: 'X재 기회비용: 갑국 Y재 1/2, 을국 Y재 4/3. Y재 기회비용: 갑국 X재 2, 을국 X재 3/4이에요.', cs: ['compadv', 'ocalc', 'absadv'], src: '수특2 104쪽 자료' },
  { id: '8-d2', t: 'mc', q: '표에 대한 설명으로 옳은 것은?', data: T2H, c: ['B국은 쌀 생산에 절대 우위가 있다.', 'A국의 옷 1벌 생산의 기회비용은 쌀 1/2가마이다.', 'B국은 쌀 생산에 비교 우위가 있다.', 'A국은 옷 생산에 비교 우위가 있다.', 'A국은 쌀, B국은 옷 생산에 비교 우위가 있다.'], a: 4, e: '생산량표예요. 쌀 1가마의 기회비용은 A국 옷 1/2벌, B국 옷 1벌이라 A국이 쌀에, B국이 옷에 비교 우위가 있어요.', cs: ['compadv', 'tables'] },
  { id: '8-d3', t: 'mc', q: '표에 대한 설명으로 옳은 것은?', data: T3H, c: ['갑국은 휴대폰, 을국은 옷 생산에 비교 우위가 있다.', '을국은 휴대폰 생산에 절대 우위가 있다.', '갑국의 휴대폰 1대 생산의 기회비용은 옷 3벌이다.', '을국의 옷 1벌 생산의 기회비용은 휴대폰 1/2대이다.', '두 나라는 옷 생산에서 비교 우위가 같다.'], a: 0, e: '휴대폰 1대의 기회비용은 갑국 옷 2벌, 을국 옷 3벌이고, 옷 1벌은 갑국 휴대폰 1/2대, 을국 1/3대예요.', cs: ['compadv', 'ocalc'] },
  { id: '8-d4', t: 'mc', q: '자료에 대한 설명으로 옳은 것은?', data: T4TXT, c: ['갑국의 X재 1개 기회비용은 Y재 2개이다.', '갑국은 X재, 을국은 Y재 생산에 비교 우위가 있다.', '을국의 Y재 1개 기회비용은 X재 2개이다.', '을국은 X재 생산에 절대 우위가 있다.', '두 나라의 X재 기회비용은 같다.'], a: 1, e: 'X재 1개 기회비용은 갑국 Y재 1/2개, 을국 Y재 1개라 갑국이 X재에 비교 우위가 있어요.', cs: ['ppfread', 'compadv'] },
  { id: '8-d5', t: 'mc', q: '표의 두 나라가 비교 우위 재화에 특화하여 X재와 Y재를 1:1로 교환한다. 이에 대한 설명으로 옳은 것은?', data: T1H, c: ['갑국은 Y재에 특화한다.', '을국은 X재 2단위를 생산해 수출한다.', '교환 후 갑국이 X재와 Y재를 1단위씩 소비하는 비용은 무역 전보다 커진다.', '갑국은 X재 2단위를 20달러로 생산해 1단위를 Y재 1단위와 바꾸면 무역 전보다 10달러를 아낀다.', '1:1 교환에서 을국은 손해를 본다.'], a: 3, e: '갑국은 무역 전 30달러가 들던 소비를 20달러로 해요. 을국도 70달러에서 60달러로 줄어요.', cs: ['tgaincalc', 'tot'], src: '수특2 104쪽 자료' },
  { id: '8-d6', t: 'mc', q: '표의 두 나라가 비교 우위에 따라 특화해 교환할 때, 옳은 설명만을 <보기>에서 고른 것은?', data: T2H, box: ['쌀 1가마 = 옷 2벌이면 두 나라 모두 이익이다.', '쌀 3가마 = 옷 2벌이면 두 나라 모두 이익이다.', 'A국은 쌀을 수출하고 옷을 수입한다.', '쌀 1가마 = 옷 1/4벌이면 A국이 이익이다.'], c: COMBO, a: 2, e: '쌀 1가마가 옷 1/2벌보다 많고 1벌보다 적게 교환되어야 두 나라 모두 이익이에요. 쌀 3가마 = 옷 2벌은 쌀 1가마 = 옷 2/3벌이라 범위 안이에요.', cs: ['tot'] },
  { id: '8-d7', t: 'mc', q: '(가)~(라)에 나타난 무역의 원인을 바르게 연결한 것은?', data: '<p>(가) 석유가 많이 묻힌 나라가 석유를 수출한다.<br>(나) 비가 많고 더운 나라가 커피를 수출한다.<br>(다) 노동력이 풍부한 나라가 의류를 수출한다.<br>(라) 기술이 앞선 나라가 반도체를 수출한다.</p>', c: ['(가) 기술 수준 · (나) 자연환경', '(가) 자연환경 · (다) 기술 수준', '(나) 부존자원 · (라) 생산 요소', '(다) 부존자원 · (라) 자연환경', '(가) 부존자원 · (라) 기술 수준'], a: 4, e: '(가) 부존자원, (나) 자연환경, (다) 생산 요소, (라) 기술 수준의 차이예요.', cs: ['endow', 'nature', 'factor8', 'tech'] },
  { id: '8-d8', t: 'mc', q: '표는 변호사 갑과 비서 을이 일 1건을 처리하는 데 걸리는 시간이다. 이에 대한 설명으로 옳은 것은?', data: tbl(['구분', '서류 작성', '변론 준비'], [['갑', '1시간', '2시간'], ['을', '2시간', '8시간']]), c: ['갑은 변론 준비, 을은 서류 작성을 맡으면 둘 다 이익을 볼 수 있다.', '갑은 두 일 모두 직접 해야 가장 이익이다.', '을은 어떤 일에도 비교 우위가 없다.', '갑이 두 일 모두 절대 우위이므로 분업은 손해이다.', '비교 우위는 개인 사이에서는 성립하지 않는다.'], a: 0, e: '서류 1건의 기회비용은 갑 변론 1/2건, 을 1/4건이라 을이 서류에 비교 우위가 있어요.', cs: ['compadv', 'absadv'] },
  { id: '8-d9', t: 'mc', q: '그림은 갑국의 생산 가능 곡선과 점 A~C이다. 이에 대한 설명으로 옳은 것은?', data: ppfMini(), c: ['점 A는 자원을 모두 효율적으로 쓰는 조합이다.', '점 C는 혼자서는 생산할 수 없지만 특화와 무역으로 소비할 수 있는 조합이다.', '점 B는 생산할 수 없는 조합이다.', '점 A는 생산 가능 곡선 밖에 있다.', '세 점 모두 무역 없이 생산할 수 있다.'], a: 1, e: 'A는 안쪽(비효율), B는 곡선 위(효율), C는 바깥(혼자서는 불가능)이에요.', cs: ['ppf', 'ppfread'] },
  { id: '8-d10', t: 'mc', q: '무역의 이득을 주체별로 바르게 연결한 것은?', c: ['소비자 – 세계 시장을 상대로 한 대량 생산', '기업 – 싼 가격으로 다양한 상품 소비', '정부 – 모든 세금의 폐지', '소비자 – 싼 가격으로 다양한 상품 소비, 기업 – 규모의 경제', '기업 – 자원과 기술력 부족 문제만 해결'], a: 3, e: '정부는 자원과 기술력 부족 문제를 해결할 수 있어요.', cs: ['tgain', 'scale'], src: '천재2 90쪽' },
  { id: '8-d11', t: 'mc', q: '다음 사례에 대한 설명으로 옳은 것은?', data: '<p>어느 스마트폰은 설계는 A국, 핵심 부품은 B국과 C국, 조립은 D국에서 이루어진다.</p>', c: ['한 나라 안에서만 생산이 이루어진 사례이다.', '완제품만 거래되고 부품은 거래되지 않는다.', '생산 단계를 가장 알맞은 나라에 나누어 배치한 글로벌 가치 사슬의 사례이다.', '국제 분업과 관계없는 사례이다.', '무역이 줄어든 사례이다.'], a: 2, e: '중간재의 국제 거래가 늘어난 글로벌 가치 사슬이에요.', cs: ['gvc'] },
  { id: '8-d12', t: 'mc', q: 'A국 노동자 1명은 하루에 쌀 4가마 또는 옷 2벌을 생산할 수 있다. 무역 전 A국은 쌀 2가마와 옷 1벌을 소비했다. 쌀에 특화해 쌀 3가마 = 옷 2벌의 비율로 교환해 옷 1벌을 얻었다면 옳은 설명은?', c: ['A국은 옷을 수출하였다.', 'A국의 소비는 무역 전보다 줄었다.', 'A국은 쌀 3가마를 모두 주고 옷 1벌을 받았다.', 'A국은 무역 전과 똑같이 소비한다.', 'A국은 쌀 2.5가마와 옷 1벌을 소비할 수 있어 무역 전보다 이익이다.'], a: 4, e: '쌀 4가마를 생산해 1.5가마를 옷 1벌과 바꾸면 쌀 2.5가마와 옷 1벌이 남아요.', cs: ['tgaincalc', 'tot'] },
  // 통합형 (5개 가운데 3개)
  { id: '8-i1', t: 'mc', tag: '지리 연계', q: '다음 자료에 나타난 무역의 원인으로 가장 적절한 것은?', data: '<p>적도 부근의 덥고 비가 많은 지역에서는 커피와 카카오를, 사계절이 뚜렷한 지역에서는 쌀과 밀을 주로 재배해 서로 거래한다.</p>', c: ['자연환경의 차이', '기술 수준의 차이', '생산 요소의 차이', '인구 구조의 차이', '화폐 단위의 차이'], a: 0, e: '기후와 토양 같은 자연환경의 차이예요.', cs: ['nature'] },
  { id: '8-i2', t: 'mc', tag: '역사 연계', q: '다음 시기에 나타난 변화로 가장 적절한 것은?', data: '<p>15세기 말 이후 유럽 여러 나라가 새로운 바닷길을 개척하면서 아메리카와 아시아의 물건이 유럽으로 들어오기 시작했다.</p>', c: ['세계 무역이 줄어들었다.', '대륙 사이의 교역이 크게 늘었다.', '모든 나라가 무역을 금지했다.', '글로벌 가치 사슬이 처음 생겼다.', '비교 우위론이 등장한 직후이다.'], a: 1, e: '신항로 개척으로 대륙 사이의 교역이 크게 늘었어요(2장의 상업 자본주의).', cs: ['trade'] },
  { id: '8-i3', t: 'mc', tag: '수학 연계', q: '같은 노동으로 X재 3단위 또는 Y재 6단위를 생산할 수 있는 나라에서 X재 1단위 생산의 기회비용은?', c: ['Y재 1/2단위', 'Y재 3단위', 'Y재 2단위', 'Y재 6단위', 'X재 2단위'], a: 2, e: '생산량표 방식이라 6 ÷ 3 = 2, Y재 2단위예요.', cs: ['ocalc', 'tables'] },
  { id: '8-i4', t: 'mc', tag: '윤리 연계', q: '다음 글의 관점에서 교환 비율에 대해 가장 적절하게 말한 것은?', data: '<p>교환은 한쪽만 이익을 보는 것이 아니라 서로에게 이익이 될 때 오래 이어질 수 있다.</p>', c: ['힘센 나라가 원하는 대로 정해야 한다.', '한 나라만 이익을 보면 충분하다.', '교환 비율은 무역과 관계없다.', '두 나라 모두 이익을 얻는 범위에서 정해야 한다.', '교환하지 않는 것이 가장 공정하다.'], a: 3, e: '두 나라의 기회비용 사이에서 정하면 모두 이익이에요.', cs: ['tot'] },
  { id: '8-i5', t: 'mc', tag: '세계화 연계', q: '다음 자료에 대한 설명으로 옳은 것은?', data: '<p>교통과 통신이 발달하면서 재화와 서비스뿐 아니라 노동, 자본, 기술도 나라 사이를 활발히 오가고 있다.</p>', c: ['국제 교역량이 줄고 있다.', '국제 분업은 사라지고 있다.', '기술은 나라 사이를 이동할 수 없다.', '모든 나라가 자급자족으로 돌아가고 있다.', '국제 교역량이 늘고 국제 분업이 더 활발해지고 있다.'], a: 4, e: '국제 교역이 늘며 국제 분업이 더 복잡해지고 있어요.', cs: ['trade', 'gvc'], src: '수특2 104쪽' },

  { id: '8-b2', t: 'mc', q: '[협상 2] X재 1개 생산의 기회비용이 갑국은 Y재 1/2개, 을국은 Y재 4/3개이다. 두 나라 모두 이익을 얻는 X재 1개의 교환 비율 범위는?', c: ['Y재 1/2개 미만', 'Y재 1/2개보다 크고 4/3개보다 작다.', 'Y재 4/3개 초과', 'Y재 1/2개와 정확히 같다.', '어떤 비율이든 된다.'], a: 1, e: '두 나라의 기회비용 사이예요.', cs: ['tot'] },
  { id: '8-b3', t: 'mc', q: '[협상 3] 쌀 1가마 생산의 기회비용이 A국은 옷 1/2벌, B국은 옷 1벌이다. 기사가 "쌀 1가마 = 옷 2벌"을 제안했다. 이에 대한 판단으로 옳은 것은?', c: ['두 나라 모두 이익이다.', 'A국이 손해를 본다.', 'B국은 쌀 1가마를 얻으려고 자기 기회비용(옷 1벌)보다 많은 옷을 내야 하므로 손해이다.', '교환 비율은 이익과 관계없다.', 'B국만 이익이다.'], a: 2, e: '범위(옷 1/2벌~1벌)를 벗어나 B국이 손해예요.', cs: ['tot'] },
  { id: '8-b4', t: 'mc', q: '[협상 4] 기사: "우리 나라는 모든 걸 더 적은 비용으로 만들어. 무역은 필요 없어!" 이 주장에 대한 반박으로 가장 적절한 것은?', c: ['맞아요, 절대 우위가 있으면 무역은 손해예요.', '비용이 적게 드는 쪽이 모두 만들어야 해요.', '기회비용은 무역과 관계없어요.', '두 재화 모두 절대 우위여도 기회비용이 작은 재화에 특화해 교환하면 이익이에요.', '무역은 가난한 나라만 해요.'], a: 3, e: '비교 우위론이 보여 준 핵심이에요.', cs: ['compadv'] },

  { id: '8-b9', t: 'mc', q: '[협상 9] 표의 두 나라가 비교 우위 재화에 특화해 1:1로 교환할 때, 을국이 X재와 Y재를 1단위씩 소비하는 비용은 무역 전보다 얼마 줄어드는가?', data: T1H, c: ['0달러', '5달러', '30달러', '10달러', '70달러'], a: 3, e: '무역 전 70달러, 무역 후 Y재 2단위 60달러라 10달러가 줄어요.', cs: ['tgaincalc'] },

  { id: '8-b12', t: 'mc', q: '[협상 12] 표에서 B국의 옷 1벌 생산의 기회비용은?', data: T2H, c: ['쌀 2가마', '쌀 1가마', '쌀 1/2가마', '옷 1벌', '쌀 4가마'], a: 1, e: '생산량표예요. B국은 쌀 1가마 또는 옷 1벌이라 옷 1벌 = 쌀 1가마예요.', cs: ['ocalc', 'tables'] },
  { id: '8-b13', t: 'mc', q: '[협상 13] 생산 가능 곡선 밖의 점에 대한 설명으로 옳은 것은?', c: ['현재 자원과 기술로 혼자 생산할 수 있다.', '자원을 낭비하는 점이다.', '혼자서는 생산할 수 없지만 특화와 무역으로 소비할 수 있다.', '무역을 해도 절대 소비할 수 없다.', '생산 가능 곡선 위의 점과 같다.'], a: 2, e: '무역의 이익이 바로 이 점이에요.', cs: ['ppf', 'ppfread'] },
