    }
    setProg(sc, N, N, '완료');
    stageClear(sc, ch, stg.n, { stars: starsBy(pts, N * 2, 1, .7), xp: 5 * pts + 10, coins: 3 * pts, lines: [['맞힌 진단·처방', `${pts} / ${N * 2}`], ['힌트 확인', `${hints}회`]], snap });
  })();
};

// ---------- 대표 게임: 공동 계좌 게임 ----------
const PGG = { rounds: 5, n: 5, pr: .1, pc: .2, cash: 100 };
const PGG_AI = [{ n: '짠돌이 노을', k: 'free', d: '한 푼도 안 넣어요' }, { n: '모범생 하늘', k: 'coop', d: '늘 다 넣는 편이에요' }, { n: '따라쟁이 구름', k: 'mimic', d: '내 지난 선택을 따라 해요' }, { n: '눈치파 바람', k: 'avg', d: '지난 판 평균만큼 넣어요' }];
function pggPay(dep) { const pool = dep.reduce((a, b) => a + b, 0), share = pool * PGG.pc / PGG.n; return { pool, share, pay: dep.map(d => Math.round((PGG.cash - d) * PGG.pr + share)) }; }
STAGES.pgg = (sc, ch, stg) => {
  sc.innerHTML = pageHTML(stg.title, `${ch}장 · ${stg.label}`);
  let started = false; bindClose(sc, ch, () => started);
  const body = $('#pBody', sc), snap = snapMast();
  const names = ['나', ...PGG_AI.map(a => a.n)], tot = [0, 0, 0, 0, 0], hist = [];
  let rule = false, lastMe = 50, lastAvg = 50, low = 0;
  setProg(sc, 0, PGG.rounds, `0 / ${PGG.rounds}판`);
  body.innerHTML = introBox('keeper', 'thinking', `다섯 명이 판마다 ${PGG.cash}코인씩 나눠 넣어요. <b>개인 계좌</b>는 이자 10%가 내 것이고, <b>공동 계좌</b>는 이자 20%를 다섯 명이 똑같이 나눠요. 공동 계좌에 넣지 않은 사람도 몫을 받아요. 5판 동안 얼마나 넣을지 정해 보세요.`, '게임 시작하기');
  const aiDep = k => {
    if (k === 'free') return rule ? 50 : 0;
    if (k === 'coop') return Math.max(rule ? 50 : 0, low >= 2 ? 50 : 100);
    if (k === 'mimic') return Math.max(rule ? 50 : 0, lastMe);
    return Math.max(rule ? 50 : 0, Math.round(lastAvg / 25) * 25);
  };
  function choose(r) {
    return new Promise(res => {
      const opts = [0, 25, 50, 75, 100];
      body.innerHTML = `<div class="pgg-top"><div class="pg-acc"><b>개인 계좌</b><span>이자 10% · 내 것</span></div><div class="pg-acc pub"><b>공동 계좌</b><span>이자 20% · 5명이 나눔</span></div></div>
<div class="pg-table">${names.map((n, k) => `<div class="pg-row ${k ? '' : 'me'}"><b>${n}</b><span>${k ? PGG_AI[k - 1].d : '나'}</span><em>${tot[k]}코인</em></div>`).join('')}</div>
<p class="ask">${r}판 · 공동 계좌에 얼마를 넣을까요?${rule ? ' <span class="rule">규칙: 50 이상 의무</span>' : ''}</p><div class="nums five">${opts.map(v => `<button data-v="${v}" ${rule && v < 50 ? 'disabled' : ''}>${v}</button>`).join('')}</div><button class="btn omr block" id="pgo" disabled>넣기</button>`;
      body.scrollTop = 0;
      let v = null; const go = $('#pgo', body);
      $$('.nums button', body).forEach(b => b.onclick = () => { v = +b.dataset.v; $$('.nums button', body).forEach(x => x.classList.toggle('on', x === b)); sfx('tap'); go.disabled = false; });
      go.onclick = () => { sfx('coin'); res(v); };
    });
  }
  function proposeRule() {
    return new Promise(res => {
      const d = overlay(`<div class="rulebox"><div class="ichr">${charSVG('chief', 'thinking', 'idle')}</div><div><b>이장님의 제안</b><p>공동 계좌가 자꾸 비는구먼. 이제부터 모두 50코인은 <b>세금처럼 반드시</b> 공동 계좌에 넣는 규칙을 만들면 어떻겠나?</p></div></div><div class="row2"><button class="btn line" id="rNo">반대</button><button class="btn omr" id="rYes">찬성</button></div>`);
      d.dataset.lock = 1;
      $('#rYes', d).onclick = () => { sfx('stamp'); d.remove(); res(true); };
      $('#rNo', d).onclick = () => { sfx('tap'); d.remove(); res(false); };
    });
  }
  async function reveal(r, dep) {
    const { pool, share, pay } = pggPay(dep);
    pay.forEach((p, k) => tot[k] += p);
    hist.push({ dep, pool });
    const avg = pool / PGG.n; if (avg < 40) low++; else low = 0; lastAvg = avg; lastMe = dep[0];
    body.innerHTML = `<p class="ask">${r}판 결과</p><div class="pool"><span>공동 계좌</span><i class="pbar"><em style="width:0%"></em></i><b>${pool} / ${PGG.cash * PGG.n}</b></div>
<div class="pg-table">${names.map((n, k) => `<div class="pg-row ${k ? '' : 'me'}"><b>${n}</b><span>넣은 돈 ${dep[k]} · 이자 ${pay[k]}</span><em>${tot[k]}코인</em></div>`).join('')}</div>
<p class="ex">공동 계좌 이자 ${pool} × 20% = ${Math.round(pool * PGG.pc)}을 다섯 명이 나눠 한 사람에 ${share % 1 ? share.toFixed(1) : share}씩 받았어요. 넣지 않은 사람도 똑같이 받아요.</p><button class="btn omr block" id="pnx">${r < PGG.rounds ? '다음 판' : '결과 보기'}</button>`;
    requestAnimationFrame(() => { $('.pool em', body).style.width = (pool / (PGG.cash * PGG.n) * 100) + '%'; });
    sfx(pool >= 300 ? 'correct' : 'coin');
    const me = rel($('.pg-row.me', body)); floatText(me.x + 80, me.y, `+${pay[0]}`, 'heal');
    await new Promise(res => $('#pnx', body).onclick = () => { sfx('tap'); res(); });
  }
  function debrief() {
    const share = hist.reduce((a, h) => a + h.pool, 0) / (PGG.cash * PGG.n * PGG.rounds);
    const stars = share >= .6 ? 3 : share >= .35 ? 2 : 1;
    const allIn = PGG.cash * PGG.pc * PGG.rounds, allOut = PGG.cash * PGG.pr * PGG.rounds;
    const best = names[tot.indexOf(Math.max(...tot))];
    body.innerHTML = `<h3 class="gtitle">5판이 끝났어요</h3><div class="pg-table">${names.map((n, k) => `<div class="pg-row ${k ? '' : 'me'}"><b>${n}</b><span>${k ? PGG_AI[k - 1].d : '나'}</span><em>${tot[k]}코인</em></div>`).join('')}</div>
<div class="tscroll"><table class="tbl"><thead><tr><th>만약 모두가</th><th>한 사람 이자 (5판)</th></tr></thead><tbody><tr class="best"><th>전부 공동 계좌에</th><td>${allIn}</td></tr><tr><th>전부 개인 계좌에</th><td>${allOut}</td></tr></tbody></table></div>
<div class="qfb ${stars === 3 ? 'ok' : 'ng'}"><span class="v hw">공동 계좌 참여율 ${Math.round(share * 100)}%</span>모두가 공동 계좌에 넣으면 한 사람이 ${allIn}씩 받아 가장 이익이에요. 그런데 나 혼자만 보면 안 넣고 몫만 받는 쪽이 더 이득처럼 보여요. 이번에 가장 많이 번 사람은 <b>${best}</b>이었어요. 이것이 <b>무임승차자 문제</b>이고, 등대 같은 공공재가 시장에서 부족해지는 까닭이에요. ${rule ? '규칙(세금)을 만들자 공동 계좌가 채워졌어요. 정부가 세금으로 공공재를 공급하는 것과 같아요.' : '그래서 정부는 세금을 걷어 공공재를 직접 공급해요.'}</div><button class="btn omr block" id="pEnd">결과 보기</button>`;
    practice(['freerider', 'pubgood'], share >= .6);
    $('#pEnd', body).onclick = () => { sfx('tap'); stageClear(sc, ch, stg.n, { stars, xp: 40 + stars * 10, coins: Math.round(tot[0] / 5), lines: [['공동 계좌 참여율', `${Math.round(share * 100)}%`], ['내가 받은 이자', `${tot[0]}코인`], ['세금 규칙', rule ? '찬성' : '반대']], snap }); };
  }
  (async () => {
    await waitGo(body); started = true;
    for (let r = 1; r <= PGG.rounds; r++) {
      setProg(sc, r - 1, PGG.rounds, `${r} / ${PGG.rounds}판`);
      if (r === 4) rule = await proposeRule();
      const me = await choose(r);
      const dep = [me, ...PGG_AI.map(a => aiDep(a.k))];
      await reveal(r, dep);
    }
    setProg(sc, PGG.rounds, PGG.rounds, '완료');
    debrief();
  })();
};

function bakeQuarter(st, pick, ev) {
  const [, p, base, rp] = BAKE.price[pick.price], [, pk, disc, rpk, ev2] = BAKE.pack[pick.pack], [, w, rw] = BAKE.wage[pick.wage], [, g, rg] = BAKE.give[pick.give];

}

function portSim(P, w, yrs) {
  const keys = ['deposit', 'bond', 'stock'], vals = [100];
  const b = keys.map(k => w[k]);
  for (let t = 0; t < yrs; t++) { keys.forEach((k, i) => { b[i] *= 1 + P.ret[k][t] / 100; }); vals.push(+(b.reduce((a, c) => a + c, 0)).toFixed(1)); }
  return vals;
}
function portChart(series, yrs) {
  const all = series.flatMap(s => s.v), mx = Math.max(...all, 120), mn = Math.min(...all, 80), W = 320, H = 170, x0 = 34, y0 = 146, sx = (W - x0 - 10) / yrs, sy = 120 / (mx - mn);
  const pt = (v, i) => `${(x0 + i * sx).toFixed(1)},${(y0 - (v - mn) * sy).toFixed(1)}`;
  let s = `<line x1="${x0}" y1="${y0}" x2="${W - 6}" y2="${y0}" stroke="currentColor"/><line x1="${x0}" y1="${y0 - (100 - mn) * sy}" x2="${W - 6}" y2="${y0 - (100 - mn) * sy}" stroke="currentColor" stroke-dasharray="4 4" opacity=".35"/><text x="${x0 - 4}" y="${y0 - (100 - mn) * sy + 4}" font-size="10" text-anchor="end" fill="currentColor">100</text>`;
  series.forEach(se => { s += `<polyline points="${se.v.map(pt).join(' ')}" fill="none" stroke="${se.c}" stroke-width="${se.w || 2.4}" ${se.d ? 'stroke-dasharray="6 5"' : ''}/>`; });
  s += series.map((se, i) => `<g transform="translate(${x0 + i * 96} 12)"><rect width="12" height="4" y="-4" fill="${se.c}"/><text x="16" y="0" font-size="10.5" fill="currentColor">${se.n}</text></g>`).join('');
  s += `<text x="${W - 6}" y="${y0 + 16}" font-size="10" text-anchor="end" fill="currentColor">${yrs}년 뒤</text>`;
  return `<svg viewBox="0 0 ${W} ${H + 6}" class="pchart" role="img" aria-label="자산 가치 변화">${s}</svg>`;
}

function lifeSim(ch) {
  const INC = { 20: 2800, 30: 3800, 40: 4600, 50: 4200 }, LIV = { 30: 3000, 40: 3600, 50: 3400, 60: 2600, 70: 2600 };
  let S = 0, EF = 0, edu = 0, pens = 0, payout = 0, loan = 0;
  const curve = [], incs = [], livs = [];
  for (let age = 20; age < 80; age++) {
    const dec = Math.floor(age / 10) * 10;
    let inc = INC[dec] || 0;
    if (age >= 40 && age < 60 && ch[4] === 1) inc *= 1.1;
    if (age >= 60 && age < 65 && ch[7] === 1) inc = 3000;
    if (age >= 60 && age < 70 && ch[7] === 2) inc = 1600;
    if (age >= 65) inc += 1000;
    const liv = age < 30 ? [2800, 2200, 1700][ch[0]] : LIV[dec] + (ch[0] === 2 && age < 40 ? 300 : 0) + (age >= 70 ? 300 : 0);
    let flow = inc - liv;
    if (age === 23 && ch[1] === 0) { S -= 600; EF += 600; }
    if (age === 33) { if (EF >= 800) EF -= 800; else { S -= 800 - EF; EF = 0; } }
    if (age === 38 && ch[4] === 1) flow -= 500;
    if (ch[3] === 0 && age >= 45 && age < 55) flow -= 1200;
    if (ch[3] === 1) { if (age >= 35 && age < 45) { flow -= 600; edu += 600; } if (age >= 45 && age < 55) { const use = Math.min(edu, 1200); edu -= use; flow -= 1200 - use; } edu *= 1.03; }
    if (ch[3] === 2) { if (age >= 45 && age < 55) loan += 1200; if (age >= 55 && age < 65) { const pay = loan / (65 - age); flow -= pay; loan -= pay; } loan *= 1.06; }
    if (ch[5] === 0 && age >= 45 && age < 65) { flow -= 300; pens += 300; }
    if (ch[5] === 1 && age >= 60 && age < 65) { flow -= 900; pens += 900; }
    pens *= 1.04;
    if (age === 65 && pens > 0) { payout = pens * 0.04 / (1 - Math.pow(1.04, -15)); pens = 0; }
    if (age >= 65) flow += payout;
    let r = age < 27 ? 0.02 : [0.02, 0.04, 0.06][ch[2]];
    if (age >= 55) r = [0.03, r, 0.06][ch[6]];
    if (age === 50 && S > 0) S *= [1, 0.9, 0.5][ch[2]];
    if (age === 62 && ch[6] === 2 && S > 0) S *= 0.5;
    S = S * (1 + (S > 0 ? r : 0.08)) + flow;
    EF *= 1.01;
    curve.push(Math.round(S + EF)); incs.push(Math.round(inc + (age >= 65 ? payout : 0))); livs.push(liv);
  }
  return { curve, incs, livs, payout: Math.round(payout) };
}

function tariffModel(t, world) {
  const price = world * (1 + t), qs = price / 25 - 10, qd = 160 - price / 25, imp = Math.max(0, qd - qs), rev = t * world * imp / 1000;
  return { price, qs, qd, imp, rev };
}

const IND = [['inc', '소득', '#F28B3C'], ['hap', '행복', '#E0456A'], ['env', '환경', '#5E9A5A'], ['fair', '공정', '#3C6FD1'], ['fin', '재정', '#8E5BD6']];
const ALLQ = () => CHAPTERS.flatMap(c => (c.quests || []).map(q => ({ ...q, ch: c.n })));
const findQuest = id => ALLQ().find(q => q.id === id);
const polById = id => CHAPTERS.flatMap(c => c.policies || []).find(p => p.id === id);
const evById = id => CHAPTERS.flatMap(c => c.events || []).find(e => e.id === id);
const clamp = v => Math.max(0, Math.min(100, v));
function applyInd(T, d) { Object.entries(d || {}).forEach(([k, v]) => { T.ind[k] = clamp((T.ind[k] || 50) + v); }); }
function townState() {
  if (!chS(1).built) return null;
  if (!ST.town) {
    ST.town = { ind: { ...TOWN_START }, pol: [], done: [], cur: null, firstDay: today(), log: [] };
    ALLQ().forEach(q => { if (ST.quests[q.id] && ST.quests[q.id].done) applyInd(ST.town, q.ind); });
  }
  const T = ST.town;
  CHAPTERS.forEach(c => { if (chS(c.n).built) (c.policies || []).forEach(p => { if (!T.pol.includes(p.id)) T.pol.push(p.id); }); });
  if (!T.cur) {
    const pool = CHAPTERS.flatMap(c => chS(c.n).built ? (c.events || []) : []).filter(e => !T.done.includes(e.id));
    const questsDone = Object.values(ST.quests).filter(q => q.done).length;
    const allowed = 1 + questsDone + (today() - T.firstDay);
    if (pool.length && T.done.length < allowed) T.cur = pool[0].id;
  }
  save(); return T;
}
const townScore = T => Math.round(IND.reduce((a, [k]) => a + T.ind[k], 0) / IND.length);
function indHTML(T, delta = {}) {
  return `<div class="inds">${IND.map(([k, n, col]) => `<div class="ind" data-k="${k}"><span>${n}</span><i class="ib"><em style="width:${T.ind[k]}%;background:${col}"></em></i><b>${T.ind[k]}</b>${delta[k] ? `<small class="${delta[k] > 0 ? 'pos' : 'neg'}">${delta[k] > 0 ? '+' : '−'}${Math.abs(delta[k])}</small>` : ''}</div>`).join('')}</div>`;
}

const chOfId = id => +id.split('-')[0];
const kindOf = id => id.split('-')[1][0];
function rngOf(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function seededShuffle(arr, rnd) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const ECON = [1, 2, 3, 4, 5, 6, 7, 8, 9];
const MOCKS = [
  { n: 1, title: '1회', sub: '1~3장', chs: [1, 2, 3], extra: [], integ: 0 },
  { n: 2, title: '2회', sub: '4~6장', chs: [4, 5, 6], extra: [], integ: 0 },
  { n: 3, title: '3회', sub: '7~9장', chs: [7, 8, 9], extra: [], integ: 0 },
  { n: 4, title: '4회', sub: '경제 종합', chs: ECON, extra: [], integ: 0 },
  { n: 5, title: '5회', sub: '도시·공간 통합', chs: ECON, extra: [10], integ: 8 },
  { n: 6, title: '6회', sub: '정의·복지 통합', chs: ECON, extra: [11], integ: 8 },
  { n: 7, title: '7회', sub: '인구·자원·기후 통합', chs: ECON, extra: [12], integ: 8 },
  { n: 8, title: '8회', sub: '최종 실전', chs: ECON, extra: [10, 11, 12], integ: 8 }

let MOCK_SETS = null;
function buildMocks() {
  if (MOCK_SETS) return MOCK_SETS;
  const used = new Set(), sets = {};
  const mcOf = (chs, kinds) => Object.keys(QBANK).filter(id => chs.includes(chOfId(id)) && QBANK[id].t === 'mc' && kinds.includes(kindOf(id)));
  MOCKS.forEach(m => {
    const rnd = rngOf(20260929 + m.n * 7919), pos = [0, 0, 0, 0, 0], perCh = {}, pick = [];
    const cap = Math.ceil((20 - m.integ) / m.chs.length) + 1;
    const take = (pool, need, capCh) => {
      const fresh = seededShuffle(pool.filter(id => !used.has(id)), rnd), old = seededShuffle(pool.filter(id => used.has(id)), rnd);
      for (const pass of [0, 1, 2]) for (const id of fresh.concat(old)) {
        if (need <= 0) return;
        if (pick.includes(id)) continue;
        const a = QBANK[id].a, c = chOfId(id);
        if (pass < 2 && pos[a] >= 4) continue;
        if (pass < 1 && capCh && (perCh[c] || 0) >= capCh) continue;
        pick.push(id); pos[a]++; perCh[c] = (perCh[c] || 0) + 1; need--;
      }
    };
    if (m.integ) {
      const ipool = mcOf(m.extra, ['c', 'd', 'b', 'i']).concat(Object.keys(QBANK).filter(id => kindOf(id) === 'i' && QBANK[id].t === 'mc' && !m.extra.includes(chOfId(id)) && /연계/.test(QBANK[id].tag || '')));
      take(ipool, m.integ, m.extra.length > 1 ? Math.ceil(m.integ / m.extra.length) : 0);
    }
    take(mcOf(m.chs, ['c', 'd', 'b']), 20 - pick.length, cap);
    const easy = pick.filter(id => 'ci'.includes(kindOf(id))), hard = pick.filter(id => !'ci'.includes(kindOf(id)));
    const ordered = seededShuffle(easy, rnd).concat(seededShuffle(hard, rnd));
    ordered.forEach(id => used.add(id));
    sets[m.n] = ordered.map((id, i) => ({ id, pts: i < 10 ? 2 : 3 }));
  });
  return (MOCK_SETS = sets);
}
