  { id: '9-c3e', t: 'mc', q: '보호 무역의 한계로 가장 적절한 것은?', c: ['국내 산업을 키울 수 있다.', '일자리를 지킬 수 있다.', '식량 같은 중요한 산업을 지킬 수 있다.', '소비자 가격이 오르고 상대국의 보복을 부를 수 있다.', '관세 수입이 생긴다.'], a: 3, e: '나머지는 보호 무역의 근거예요.', cs: ['protwhy'] },
  // 개념 3: 국제기구와 협정
  { id: '9-c4a', t: 'ox', q: '세계 무역 기구(WTO)는 1995년에 출범하였다.', a: true, e: '무역 장벽 완화와 분쟁 조정을 맡아요.', cs: ['wto'] },
  { id: '9-c4b', t: 'ox', q: '자유 무역 협정(FTA)은 관세만 낮추고 서비스나 투자는 다루지 않는다.', a: false, e: '비관세 장벽까지 완화해요.', cs: ['fta'] },
  { id: '9-c4c', t: 'ox', q: '유럽 연합(EU)은 지역 경제 협력체의 한 예이다.', a: true, e: 'APEC, USMCA도 있어요.', cs: ['bloc'] },
  { id: '9-c4d', t: 'mc', q: 'FTA 체결로 이익을 보기 쉬운 쪽과 피해를 보기 쉬운 쪽을 바르게 연결한 것은?', c: ['이익 – 경쟁력 약한 국내 농가', '피해 – 수출 기업', '이익 – 수입품과 경쟁하는 국내 생산자', '피해 – 싼 수입품을 사는 소비자', '이익 – 수출 기업, 피해 – 경쟁력 약한 국내 산업'], a: 4, e: '관세가 낮아지면 수출 기업과 소비자는 이익, 경쟁력 약한 산업은 어려워져요.', cs: ['ftaeffect'] },
  { id: '9-c4e', t: 'mc', q: '다음 설명에 해당하는 것은? "1995년 출범한 국제기구로, 관세 인하와 반덤핑 규제, 무역 분쟁 조정 등을 한다."', c: ['세계 무역 기구(WTO)', '유럽 연합(EU)', '자유 무역 협정(FTA)', '국제 노동 기구(ILO)', '아시아·태평양 경제 협력체(APEC)'], a: 0, e: 'WTO예요.', cs: ['wto'] },
  // 개념 4: 지속가능한 무역
  { id: '9-c5a', t: 'ox', q: '지속가능한 국제 무역은 경제적 효율성과 함께 사회적 책임과 환경 보호를 고려한다.', a: true, e: '미래 세대의 필요도 해치지 않아야 해요.', cs: ['sustrade'] },
  { id: '9-c5b', t: 'ox', q: '무역의 이익을 공정하게 나누려면 다국적 기업의 이윤 극대화를 가장 먼저 생각해야 한다.', a: false, e: '개발 도상국 생산자에게 정당한 대가를 보장하는 노력이 필요해요.', cs: ['fairt'], src: '수특2 106쪽' },
  { id: '9-c5c', t: 'ox', q: '국제 노동 기준은 아동 노동과 강제 노동을 금지한다.', a: true, e: '노동자의 권리를 지키는 기준이에요.', cs: ['ils'] },
  { id: '9-c5d', t: 'mc', q: '탄소국경조정제도에 대한 설명으로 옳은 것은?', c: ['아동 노동을 금지하는 국제 협약이다.', '온실가스 규제가 약한 나라의 제품을 EU로 수출할 때 탄소 배출량에 따라 비용을 물린다.', '모든 관세를 없애는 협정이다.', '공정 무역 인증 제도이다.', '무역 의존도를 계산하는 방법이다.'], a: 1, e: 'EU가 기후 변화 대응을 위해 도입했어요.', cs: ['cbam'] },
  { id: '9-c5e', t: 'mc', q: '지속가능한 국제 무역을 위한 방안으로 옳지 않은 것은?', c: ['공정 무역을 활성화한다.', '국제 노동 기준을 지킨다.', '친환경 생산과 운송 방식을 도입한다.', '생산 비용을 줄이려고 아동 노동을 허용한다.', '환경 관련 국제 협약을 지킨다.'], a: 3, e: '아동 노동은 금지해야 해요.', cs: ['sustrade', 'ils'] },
  // 퀴즈 러시 (30개 가운데 20개)
  { id: '9-r01', t: 'ox', q: '무역이 늘면 해외 기업과의 경쟁으로 상품의 질이 좋아질 수 있다.', a: true, e: '무역의 긍정적 영향이에요.', cs: ['tpos'] },
  { id: '9-r02', t: 'ox', q: '무역은 모든 사람에게 똑같이 이익만 준다.', a: false, e: '이익과 손해가 사람마다 달라요.', cs: ['tneg'] },
  { id: '9-r03', t: 'ox', q: '무역 의존도를 구할 때는 수출액만 GDP로 나눈다.', a: false, e: '수출액과 수입액을 더해요.', cs: ['tdepcalc'] },
  { id: '9-r04', t: 'ox', q: '무역을 통해 한 지역의 경제 문제가 다른 나라로 퍼질 수 있다.', a: true, e: '경제 문제의 전파예요.', cs: ['spill'] },
  { id: '9-r05', t: 'ox', q: '자유 무역의 이론적 근거는 비교 우위론이다.', a: true, e: '8장에서 배웠어요.', cs: ['freet'] },
  { id: '9-r06', t: 'ox', q: '관세를 내리면 수입품 가격이 오른다.', a: false, e: '관세를 내리면 수입품 가격이 내려요.', cs: ['tariff'] },
  { id: '9-r07', t: 'ox', q: '비관세 장벽은 관세가 아닌 방법으로 수입을 막는 장치이다.', a: true, e: '수량 제한이나 까다로운 기준 등이 있어요.', cs: ['ntb'] },
  { id: '9-r08', t: 'ox', q: '보호 무역이 지나치면 상대국의 보복 관세를 부를 수 있다.', a: true, e: '보호 무역의 한계예요.', cs: ['protwhy'] },
  { id: '9-r09', t: 'ox', q: 'WTO는 두 나라만 맺는 협정이다.', a: false, e: 'WTO는 국제기구예요. FTA가 협정이에요.', cs: ['wto', 'fta'] },
  { id: '9-r10', t: 'ox', q: 'FTA가 체결되면 모든 국내 산업이 반드시 이익을 본다.', a: false, e: '경쟁력 약한 산업은 피해를 볼 수 있어요.', cs: ['ftaeffect'] },
  { id: '9-r11', t: 'ox', q: 'USMCA는 미국·멕시코·캐나다가 맺은 협정이다.', a: true, e: '지역 경제 협력체의 예예요.', cs: ['bloc'] },
  { id: '9-r12', t: 'ox', q: 'WTO 출범 이후 무역 장벽을 낮추려는 노력이 이어졌다.', a: true, e: '자유 무역 질서의 확대예요.', cs: ['tradeorder'] },
  { id: '9-r13', t: 'ox', q: '공정 무역은 선진국 소비자에게 가장 싼 값을 보장하는 무역이다.', a: false, e: '생산자에게 정당한 대가를 보장하는 무역이에요.', cs: ['fairt'] },
  { id: '9-r14', t: 'ox', q: '아동 노동으로 만든 값싼 상품은 국제 노동 기준에 어긋난다.', a: true, e: '아동 노동은 금지돼요.', cs: ['ils'] },
  { id: '9-r15', t: 'ox', q: '탄소국경조정제도는 온실가스 배출과 관계없는 제도이다.', a: false, e: '탄소 배출량에 따라 비용을 물려요.', cs: ['cbam'] },
  { id: '9-r16', t: 'ox', q: '탄소국경조정제도는 보호 무역주의라는 비판을 받기도 한다.', a: true, e: '개발 도상국에 불공정한 압박이 될 수 있다는 비판이에요.', cs: ['cbam'] },
  { id: '9-r17', t: 'ox', q: '무역 과정의 대량 운송은 온실가스 배출과 관계가 없다.', a: false, e: '운송도 온실가스를 내요.', cs: ['envtrade'] },
  { id: '9-r18', t: 'ox', q: '무역 의존도가 높으면 무역의 이익이 전혀 없다.', a: false, e: '이익도 크지만 해외 충격에 약해요.', cs: ['tdep'] },
  { id: '9-r19', t: 'ox', q: '보호 무역은 국내 산업을 보호하고 육성하려는 목적이 있다.', a: true, e: '보호 무역의 목적이에요.', cs: ['protect'] },
  { id: '9-r20', t: 'ox', q: '관세가 높을수록 정부의 관세 수입은 언제나 늘어난다.', a: false, e: '너무 높으면 수입이 사라져 관세 수입도 줄어요.', cs: ['tariff'] },
  { id: '9-r21', t: 'ox', q: '파리 협정은 환경 관련 국제 협약이다.', a: true, e: '온실가스 감축을 위한 협약이에요.', cs: ['envtrade'] },
  { id: '9-r22', t: 'blank', q: '수입품에 매기는 세금은 (＿＿)이다.', c: ['관세', '소득세'], a: 0, e: '관세예요.', cs: ['tariff'] },
  { id: '9-r23', t: 'blank', q: '(수출액 + 수입액) ÷ GDP × 100으로 구하는 지표는 무역 (＿＿)이다.', c: ['수지', '의존도'], a: 1, e: '무역 의존도예요.', cs: ['tdep'] },
  { id: '9-r24', t: 'blank', q: '1995년 출범해 무역 분쟁을 조정하는 국제기구는 (＿＿)이다.', c: ['WTO', 'EU'], a: 0, e: '세계 무역 기구예요.', cs: ['wto'] },
  { id: '9-r25', t: 'blank', q: '협정국끼리 관세와 비관세 장벽을 완화하는 협정은 (＿＿)이다.', c: ['WTO', 'FTA'], a: 1, e: '자유 무역 협정이에요.', cs: ['fta'] },
  { id: '9-r26', t: 'blank', q: '국내 산업 보호를 위해 무역을 규제하는 것은 (＿＿) 무역이다.', c: ['보호', '자유'], a: 0, e: '보호 무역이에요.', cs: ['protect'] },
  { id: '9-r27', t: 'blank', q: '저개발국 생산자에게 정당한 대가를 지급하는 무역은 (＿＿) 무역이다.', c: ['중개', '공정'], a: 1, e: '공정 무역이에요.', cs: ['fairt'] },
  { id: '9-r28', t: 'blank', q: '탄소 배출량에 따라 EU 수입품에 비용을 물리는 제도는 탄소(＿＿)조정제도이다.', c: ['국경', '가격'], a: 0, e: '탄소국경조정제도예요.', cs: ['cbam'] },
  { id: '9-r29', t: 'blank', q: '가까운 나라들이 공동의 이익을 위해 만든 경제 공동체는 지역 경제 (＿＿)이다.', c: ['위원회', '협력체'], a: 1, e: '지역 경제 협력체예요.', cs: ['bloc'] },
  { id: '9-r30', t: 'blank', q: '아동 노동과 강제 노동을 금지하는 것은 국제 (＿＿) 기준이다.', c: ['노동', '회계'], a: 0, e: '국제 노동 기준이에요.', cs: ['ils'] },
  // 자료 해석 (12개 가운데 8개)
  { id: '9-d1', t: 'mc', q: '표에 대한 설명으로 옳은 것은?', data: DEP9, c: ['갑국의 무역 의존도는 30%이다.', '을국의 무역 의존도는 갑국보다 높다.', '갑국의 무역 의존도는 을국의 2.5배이다.', '을국의 무역 의존도는 40%이다.', '두 나라의 무역 의존도는 같다.'], a: 2, e: '갑국 (300 + 200) ÷ 1,000 = 50%, 을국 (200 + 200) ÷ 2,000 = 20%라 2.5배예요.', cs: ['tdepcalc'] },
  { id: '9-d2', t: 'mc', q: '표에 대한 설명으로 옳은 것은?', data: DEP9, c: ['을국은 갑국보다 해외 경제 충격에 더 크게 흔들리기 쉽다.', '갑국은 무역에 전혀 기대지 않는다.', '을국의 수출 의존도는 20%이다.', '두 나라 모두 수입액이 수출액보다 많다.', '갑국이 을국보다 해외 경제 문제의 영향을 더 크게 받기 쉽다.'], a: 4, e: '무역 의존도가 높은 갑국(50%)이 해외 충격에 더 민감해요. 을국의 수출 의존도는 10%예요.', cs: ['tdep', 'spill'] },
  { id: '9-d3', t: 'mc', q: '다음 대화의 갑, 을에 대한 설명으로 옳은 것은?', data: '<p>갑: 비교 우위에 따라 특화하고 자유롭게 교역해야 모두 더 잘살 수 있어요.<br>을: 아직 경쟁력이 약한 우리 산업은 관세로 한동안 보호해야 해요.</p>', c: ['갑은 자유 무역, 을은 보호 무역의 입장이다.', '갑은 관세를 크게 올리자고 한다.', '을은 무역 장벽을 모두 없애자고 한다.', '갑과 을 모두 보호 무역의 입장이다.', '을은 비교 우위론을 근거로 든다.'], a: 0, e: '갑은 자유 무역, 을은 보호 무역이에요.', cs: ['freet', 'protect'] },
  { id: '9-d4', t: 'mc', q: '표는 A국이 수입 쌀에 매기는 관세율 변화에 따른 결과이다. 이에 대한 설명으로 옳은 것은?', data: tbl(['관세율', '0%', '50%'], [['수입 쌀 국내 가격', '1,000원', '1,500원'], ['수입량', '90만 톤', '50만 톤'], ['국산 쌀 생산량', '30만 톤', '50만 톤']]) + '<p class="note">가상의 자료, 1kg당 가격</p>', c: ['관세를 올리자 수입량이 늘었다.', '관세를 올리자 소비자 가격은 오르고 국산 쌀 생산은 늘었다.', '관세를 올려도 소비자 부담은 변하지 않았다.', '관세를 올리자 국산 쌀 생산이 줄었다.', '관세 0%일 때 국내 생산자가 가장 많이 보호된다.'], a: 1, e: '관세가 국내 생산자를 보호하는 대신 소비자 부담을 키웠어요.', cs: ['tariff', 'protwhy'] },
  { id: '9-d5', t: 'mc', q: '다음 사례에 대한 설명으로 옳은 것은?', data: '<p>갑국과 을국이 자유 무역 협정(FTA)을 맺자 갑국의 자동차 수출이 크게 늘었고, 을국산 과일이 싸게 들어와 갑국의 과일 농가는 어려움을 호소하였다.</p>', c: ['FTA는 갑국의 모든 산업에 이익만 주었다.', '갑국 소비자는 과일을 더 비싸게 사게 되었다.', 'FTA는 관세만 다루고 다른 것은 다루지 않는다.', 'FTA로 이익을 본 산업과 피해를 본 산업이 함께 나타났다.', '과일 농가는 FTA로 가장 큰 이익을 보았다.'], a: 3, e: '수출 기업은 이익, 경쟁력 약한 농가는 피해예요.', cs: ['ftaeffect'] },
  { id: '9-d6', t: 'mc', q: '다음 국제기구와 협정에 대한 옳은 설명만을 <보기>에서 고른 것은?', box: ['WTO는 협정을 맺은 두 나라 사이에서만 효력이 있다.', 'FTA는 서비스와 투자 분야의 장벽도 완화한다.', 'EU, APEC, USMCA는 지역 경제 협력체이다.', 'WTO는 반덤핑 규제를 하지 않는다.'], c: COMBO, a: 2, e: 'WTO는 여러 나라가 참여하는 국제기구로, 반덤핑 규제도 해요.', cs: ['wto', 'fta', 'bloc'] },
  { id: '9-d7', t: 'mc', q: '다음 초콜릿 한 개 값의 몫을 비교한 가상의 자료에 대한 설명으로 옳은 것은?', data: tbl(['구분', '카카오 농가의 몫', '중간 유통의 몫', '판매 회사의 몫'], [['일반 거래', '5%', '35%', '60%'], ['공정 무역', '15%', '30%', '55%']]), c: ['공정 무역에서 농가의 몫이 더 작다.', '두 거래에서 농가의 몫은 같다.', '공정 무역은 판매 회사의 몫을 가장 크게 늘린다.', '일반 거래가 생산자에게 더 정당한 대가를 준다.', '공정 무역은 생산자에게 더 큰 몫을 돌려주려는 무역이다.'], a: 4, e: '공정 무역은 소외된 생산자에게 정당한 대가를 돌려줘요.', cs: ['fairt'] },
  { id: '9-d8', t: 'mc', q: '다음 자료의 제도에 대한 설명으로 옳은 것은?', data: '<p>EU는 기후 변화 대응을 위해 온실가스 배출 규제가 약한 나라에서 만든 철강 등을 수입할 때, 생산 과정의 탄소 배출량만큼 인증서를 사도록 하는 제도를 2026년부터 확정 적용하였다.</p>', c: ['기업의 친환경 투자를 이끌 수 있지만 보호 무역주의라는 비판도 있다.', '아동 노동을 금지하는 제도이다.', '모든 관세를 없애는 협정이다.', 'EU 밖에서만 적용되는 제도이다.', '탄소 배출량과 관계없이 같은 비용을 물린다.'], a: 0, e: '탄소국경조정제도(CBAM)의 양면이에요.', cs: ['cbam'] },
  { id: '9-d9', t: 'mc', q: '(가)~(라)를 지속가능한 무역의 방안과 바르게 연결한 것은?', data: '<p>(가) 생산자에게 정당한 값을 치르는 인증 상품을 산다.<br>(나) 공장에서 아이들이 일하지 않는지 감시한다.<br>(다) 친환경 운송 방식을 도입한다.<br>(라) 나라들이 함께 무역 규범을 만든다.</p>', c: ['(가) 환경 보호 · (나) 공정한 분배', '(가) 공정한 분배 · (나) 노동자의 권리', '(나) 환경 보호 · (다) 국제 협력', '(다) 노동자의 권리 · (라) 공정한 분배', '(가) 국제 협력 · (라) 환경 보호'], a: 1, e: '(가) 공정한 분배, (나) 노동자의 권리, (다) 환경 보호, (라) 국제 협력이에요.', cs: ['sustrade', 'fairt', 'ils'] },
  { id: '9-d10', t: 'mc', q: '다음 대화에서 옳게 말한 학생만을 있는 대로 고른 것은?', data: '<p>갑: 관세를 올리면 국내 생산자는 보호받지만 소비자 부담은 커져요.<br>을: 관세를 올리면 관세 수입은 언제나 끝없이 늘어요.<br>병: 관세를 크게 올리면 상대국이 보복할 수 있어요.</p>', c: ['갑', '을', '을, 병', '갑, 병', '갑, 을, 병'], a: 3, e: '관세가 너무 높으면 수입이 사라져 관세 수입도 줄어요.', cs: ['tariff', 'protwhy'] },
  { id: '9-d11', t: 'mc', q: '다음 사례와 가장 관련 깊은 무역의 영향은?', data: '<p>A국의 최대 교역국인 B국에 경제 위기가 닥치자, 수출이 국내 총생산의 절반을 넘는 A국의 수출과 고용이 크게 줄었다.</p>', c: ['관세 수입의 증가', '국내 산업의 기술 향상', '무역을 통한 경제 문제의 전파', '다양한 상품의 소비', '공정 무역의 확대'], a: 2, e: '무역 의존도가 높을수록 해외 경제 문제의 영향이 커요.', cs: ['spill', 'tdep'] },
  { id: '9-d12', t: 'mc', q: '국제 무역의 문제와 해결 방안을 바르게 연결한 것은?', c: ['분배 불평등 – 아동 노동 감시', '인권 침해 – 대체 에너지 사용', '환경 오염 – 공정 무역 활성화', '분배 불평등 – 기후 협약 이행', '분배 불평등 – 공정 무역 활성화, 인권 침해 – 아동·강제 노동 감시'], a: 4, e: '환경 오염에는 대체 에너지, 자원 재활용, 기후 협약 이행이 짝이에요.', cs: ['sustrade', 'fairt', 'ils'], src: '천재2 92쪽' },
  // 통합형 (5개 가운데 3개)
  { id: '9-i1', t: 'mc', tag: '윤리 연계', q: '다음 글의 관점에서 바람직한 소비로 가장 적절한 것은?', data: '<p>우리가 사는 물건의 값에는 먼 나라 노동자의 땀이 들어 있다. 그들이 정당한 대가를 받았는지 묻는 것도 소비자의 책임이다.</p>', c: ['공정 무역 인증 상품을 고려해 산다.', '무조건 가장 싼 상품만 산다.', '생산 과정은 신경 쓰지 않는다.', '아동 노동으로 만든 상품도 싸면 산다.', '광고를 많이 하는 상품을 산다.'], a: 0, e: '윤리적 소비와 공정 무역이에요(4장과 연결).', cs: ['fairt'] },
  { id: '9-i2', t: 'mc', tag: '환경 연계', q: '다음 자료에 대한 설명으로 옳은 것은?', data: '<p>2015년 파리에서 채택된 협약에 따라 각국은 스스로 온실가스 감축 목표를 정하고 이를 지켜야 한다.</p>', c: ['무역과 환경은 관계없다.', '국제 무역 과정의 환경 오염을 줄이려면 이런 국제 협약을 각국이 이행해야 한다.', '이 협약은 관세를 없애는 협정이다.', '아동 노동을 금지하는 협약이다.', '이 협약은 한 나라만 지키면 된다.'], a: 1, e: '파리 협정이에요. 12장에서 더 자세히 배워요.', cs: ['envtrade'] },
  { id: '9-i3', t: 'mc', tag: '수학 연계', q: 'GDP가 500억 달러인 나라의 수출액이 150억 달러, 수입액이 100억 달러이다. 이 나라의 무역 의존도는?', c: ['20%', '30%', '50%', '25%', '250%'], a: 2, e: '(150 + 100) ÷ 500 × 100 = 50%예요.', cs: ['tdepcalc'] },
  { id: '9-i4', t: 'mc', tag: '지리 연계', q: '다음 지역 경제 협력체와 설명을 바르게 연결한 것은?', c: ['APEC – 유럽의 회원국 대부분이 같은 화폐를 쓴다.', 'EU – 아시아와 태평양 지역의 협력체이다.', 'USMCA – 유럽 국가들의 협정이다.', 'USMCA – 미국·멕시코·캐나다의 협정이다.', 'APEC – 미국·멕시코·캐나다만 참여한다.'], a: 3, e: 'EU는 유럽, APEC은 아시아·태평양이에요.', cs: ['bloc'] },
  { id: '9-i5', t: 'mc', tag: '인권 연계', q: '다음 사례에 대한 해결 방안으로 가장 적절한 것은?', data: '<p>어느 나라의 카카오 농장에서 어린이들이 학교에 가지 못하고 하루 종일 일하고 있다는 보도가 나왔다.</p>', c: ['값이 싸므로 계속 수입한다.', '어린이의 노동 시간을 조금 줄인다.', '보도를 무시한다.', '카카오 가격을 더 낮춘다.', '국제 노동 기준을 지키도록 감시하고 공정 무역을 활성화한다.'], a: 4, e: '아동 노동 금지와 공정한 대가가 함께 필요해요.', cs: ['ils', 'fairt'] },
  // 보스전: 통상 장관 청문회 (15개)
  { id: '9-b1', t: 'mc', q: '[청문 1] 골렘: "관세를 올리면 모두 부자가 된다!" 관세 인상의 결과에 대한 옳은 설명만을 <보기>에서 고른 것은?', box: ['수입품의 국내 가격이 오른다.', '국내 생산자를 보호할 수 있다.', '소비자의 부담은 줄어든다.', '상대국의 보복 걱정이 사라진다.'], c: COMBO, a: 0, e: '소비자 부담은 커지고 보복 가능성도 생겨요.', cs: ['tariff', 'protwhy'] },
  { id: '9-b2', t: 'mc', q: '[청문 2] 표에서 갑국의 수출 의존도는?', data: DEP9, c: ['20%', '30%', '50%', '10%', '300%'], a: 1, e: '300 ÷ 1,000 × 100 = 30%예요.', cs: ['tdepcalc'] },
  { id: '9-b3', t: 'mc', q: '[청문 3] 장관 후보: "FTA를 맺으면 피해 산업 대책도 함께 세우겠습니다." 이 발언의 근거로 가장 적절한 것은?', c: ['FTA는 모든 산업에 이익만 준다.', 'FTA는 관세와 관계없다.', 'FTA로 경쟁력이 약한 산업은 피해를 볼 수 있다.', 'FTA는 수출 기업에 손해를 준다.', 'FTA는 소비자에게 가장 큰 손해를 준다.'], a: 2, e: 'FTA의 이익과 손해가 산업마다 달라요.', cs: ['ftaeffect'] },
  { id: '9-b4', t: 'mc', q: '[청문 4] 무역 의존도가 60%인 나라와 20%인 나라를 비교한 설명으로 옳은 것은?', c: ['20%인 나라가 해외 경제 충격에 더 민감하다.', '60%인 나라는 무역을 거의 하지 않는다.', '두 나라의 무역 규모는 반드시 같다.', '60%인 나라가 해외 경제 문제의 영향을 더 크게 받기 쉽다.', '무역 의존도는 GDP와 관계없다.'], a: 3, e: '무역 의존도가 높을수록 해외 충격의 영향이 커요.', cs: ['tdep', 'spill'] },
  { id: '9-b5', t: 'mc', q: '[청문 5] WTO와 FTA를 비교한 설명으로 옳은 것은?', c: ['WTO는 두 나라만 맺는 협정이다.', 'FTA는 1995년 출범한 국제기구이다.', 'WTO와 FTA는 모두 무역 장벽을 높이려 한다.', 'FTA는 관세만 다룬다.', 'WTO는 국제기구이고, FTA는 협정을 맺은 나라끼리의 약속이다.'], a: 4, e: '둘 다 무역 장벽을 낮추려는 흐름이에요.', cs: ['wto', 'fta'] },
  { id: '9-b6', t: 'mc', q: '[청문 6] 수입 과일에 관세 20%를 매겼다. 국제 가격이 5,000원인 과일의 국내 가격은? (단, 다른 비용은 없다.)', c: ['6,000원', '5,000원', '4,000원', '5,200원', '10,000원'], a: 0, e: '5,000 × 1.2 = 6,000원이에요.', cs: ['tariff'] },
  { id: '9-b7', t: 'mc', q: '[청문 7] 보호 무역에 대한 설명으로 옳은 것은?', c: ['시장 원리에 맡겨 규제하지 않는 무역이다.', '국내 산업을 보호하려고 관세나 비관세 장벽으로 무역을 규제한다.', '비교 우위론이 이론적 근거이다.', '상대국의 보복을 부르지 않는다.', '소비자 가격을 낮춘다.'], a: 1, e: '보호 무역의 뜻이에요.', cs: ['protect'] },
  { id: '9-b8', t: 'mc', q: '[청문 8] 다음 대화에서 옳게 말한 사람만을 있는 대로 고른 것은?', data: '<p>갑: 공정 무역은 생산자에게 정당한 대가를 주려는 무역이에요.<br>을: 국제 노동 기준은 아동 노동을 허용해요.<br>병: 탄소국경조정제도는 탄소 배출량에 따라 비용을 물려요.</p>', c: ['갑', '을', '갑, 병', '을, 병', '갑, 을, 병'], a: 2, e: '국제 노동 기준은 아동 노동을 금지해요.', cs: ['fairt', 'ils', 'cbam'] },
  { id: '9-b9', t: 'mc', q: '[청문 9] 무역 확대의 긍정적 영향으로 가장 적절한 것은?', c: ['경쟁력 약한 산업의 실업이 늘어난다.', '선진국과 개발 도상국의 격차가 커진다.', '해외의 경제 문제가 퍼진다.', '해외 기업과 경쟁하며 기술과 품질이 좋아진다.', '국내 산업이 모두 사라진다.'], a: 3, e: '나머지는 부정적 영향이에요.', cs: ['tpos'] },
  { id: '9-b10', t: 'mc', q: '[청문 10] 지속가능한 국제 무역에 대한 옳은 설명만을 <보기>에서 고른 것은?', box: ['경제적 효율성만 따지면 된다.', '아동 노동은 비용을 줄이므로 허용한다.', '무역의 이익을 공정하게 나누려 노력한다.', '환경 관련 국제 협약을 지킨다.'], c: COMBO, a: 4, e: '효율성과 함께 사회적 책임과 환경을 고려해요.', cs: ['sustrade'] },
  { id: '9-b11', t: 'mc', q: '[청문 11] 골렘: "수입만 막으면 모두 부자가 돼!" 이 주장에 대한 반박으로 가장 적절한 것은?', c: ['수입을 막으면 무역의 이익도 사라지고 소비자 가격이 오르며 수출도 보복을 받을 수 있어요.', '수입을 막으면 모든 산업이 발전해요.', '관세는 소비자와 관계없어요.', '무역은 한쪽만 이익을 봐요.', '수출도 모두 막아야 해요.'], a: 0, e: '무역의 이익과 보복을 함께 떠올려요.', cs: ['protwhy', 'tpos'] },

  { id: '10-d1', t: 'mc', q: '표는 어느 나라의 세 시기 산업별 생산액 비율이다. (가)~(다)가 각각 1960년대, 1980년대, 2020년대 중 하나일 때 옳은 설명은?', data: tbl(['구분', '1차 산업', '2차 산업', '3차 산업'], [['(가)', '40%', '15%', '45%'], ['(나)', '13%', '35%', '52%'], ['(다)', '2%', '34%', '64%']]) + '<p class="note">가상의 자료</p>', c: ['(가)는 2020년대이다.', '(다)는 1차 산업 비율이 가장 높다.', '(가)에서 (다)로 갈수록 1차 산업 비율이 낮아진다.', '(나)는 1960년대이다.', '3차 산업 비율은 (가)가 가장 높다.'], a: 2, e: '1차 산업 비율이 가장 높은 (가)가 1960년대, 3차 산업 비율이 가장 높은 (다)가 2020년대예요.', cs: ['indus'] },
  { id: '10-d2', t: 'mc', q: '표는 두 나라의 도시화율 변화이다. 이에 대한 설명으로 옳은 것은?', data: tbl(['구분', '1990년', '2025년'], [['A국', '30%', '55%'], ['B국', '82%', '84%']]) + '<p class="note">가상의 자료</p>', c: ['A국은 종착 단계이다.', 'B국은 가속화 단계이다.', 'A국은 B국보다 도시화율이 높다.', 'B국은 이촌 향도가 가장 활발하다.', 'A국은 가속화 단계로, B국보다 도시화 속도가 빠르다.'], a: 4, e: 'A국은 도시화율이 빠르게 오르는 가속화 단계, B국은 거의 멈춘 종착 단계예요.', cs: ['urbstage'] },
  { id: '10-d3', t: 'mc', q: '표에 대한 설명으로 옳은 것은?', data: RENT10H, c: ['도심에서는 상업·업무 기능이 가장 높은 지대를 낼 수 있다.', '15km 지점에서는 주거 기능이 가장 높은 지대를 낸다.', '공업 기능은 도심에서 가장 높은 지대를 낸다.', '5km 지점은 상업·업무 기능이 차지한다.', '거리가 멀어질수록 상업·업무 기능의 지대는 오른다.'], a: 0, e: '5km는 주거(55), 15km는 공업(26)이 가장 높은 지대를 내요.', cs: ['rent', 'cbd'] },
  { id: '10-d4', t: 'mc', q: '다음 (가)~(라) 지역에 대한 설명으로 옳은 것은?', data: '<p>(가) 도시 중심부로 고층 건물이 많고 금융 기관과 기업 본사가 밀집해 있다.<br>(나) 교통이 모이는 곳에 백화점과 업무 시설이 들어서 있다.<br>(다) 외곽에 대규모 아파트 단지와 학교가 있다.<br>(라) 넓은 부지에 있던 공장들이 지식 산업 센터로 바뀌고 있다.</p>', c: ['(가)는 지대가 가장 낮다.', '(나)는 도심의 기능을 나누어 맡는 부도심이다.', '(다)는 상주인구가 가장 적다.', '(라)는 도심보다 접근성이 높다.', '(가)는 주거 기능이 가장 발달하였다.'], a: 1, e: '(가) 도심, (나) 부도심, (다) 주거 지역, (라) 공업 지역이에요.', cs: ['cbd', 'subcbd', 'resind'], src: '수특1 130쪽 자료 플러스와 같은 구조' },
  { id: '10-d5', t: 'mc', q: '다음 두 지역에 대한 설명으로 옳은 것은?', data: '<p>갑시: 대도시와 전철로 이어져 있고, 일하는 사람의 45%가 대도시로 출퇴근한다.<br>을군: 대도시 근처에서 비닐하우스 채소와 우유를 대도시로 보낸다.</p>', c: ['갑시는 대도시의 영향권 밖에 있다.', '을군에서는 첨단 연구소가 주로 발달한다.', '갑시와 을군 모두 대도시와 관계없다.', '갑시는 대도시로 출퇴근하는 인구가 많은 위성 도시의 모습을 보인다.', '교외화가 진행되면 대도시권은 좁아진다.'], a: 3, e: '갑시는 위성 도시, 을군은 배후 농촌 지역이에요.', cs: ['suburb'] },
  { id: '10-d6', t: 'mc', q: '다음 사례에 대한 옳은 설명만을 <보기>에서 고른 것은?', data: '<p>고속 철도가 개통된 뒤 A시(중소 도시) 주민들이 B시(대도시)의 대형 병원과 백화점을 이용하는 일이 크게 늘었다. A시 도심의 빈 상가는 늘어났다.</p>', box: ['A시와 B시 사이의 이동 시간이 늘었다.', 'A시의 쇼핑·의료 기능이 B시로 흡수되었다.', '지역 격차가 커질 수 있다.', 'A시 상권은 이전보다 활성화되었다.'], c: COMBO, a: 2, e: '빨대 효과로 지역 격차가 커질 수 있어요.', cs: ['straw', 'gaps'] },
  { id: '10-d7', t: 'mc', q: '표는 어느 도시의 변화이다. 이에 대한 설명으로 옳은 것은?', data: tbl(['구분', '5년 전', '현재'], [['온라인 쇼핑 거래액', '100', '220'], ['동네 오프라인 점포 수', '100', '80'], ['택배 물량', '100', '240']]) + '<p class="note">5년 전을 100으로 한 가상의 값</p>', c: ['오프라인 점포가 크게 늘었다.', '택배 물량이 줄었다.', '온라인 쇼핑이 줄었다.', '전자 상거래와 물류는 관계없다.', '무점포 상점과 물류 산업이 성장하였다.'], a: 4, e: '전자 상거래가 늘며 오프라인 점포는 줄고 물류가 성장했어요.', cs: ['ecom'] },
  { id: '10-d8', t: 'mc', q: '표는 다국적 기업 H사의 기능별 입지이다. 이에 대한 설명으로 옳은 것은?', data: tbl(['기능', '입지'], [['본사', 'A국(본국)의 대도시'], ['연구소', 'B국의 첨단 연구 단지'], ['공장 1', 'C국: 임금이 낮은 개발 도상국'], ['공장 2', 'D국: 시장이 크고 수입 관세가 높은 선진국']]), c: ['D국 공장은 무역 장벽을 피하고 시장을 확보하려는 목적이 크다.', 'C국 공장은 무역 장벽을 피하는 것이 주목적이다.', '본사는 저임금 노동력을 찾아 C국에 있다.', '연구소는 원료 산지에 있다.', '네 기능은 모두 한 나라에 모여 있다.'], a: 0, e: 'C국 공장은 생산비 절감, D국 공장은 무역 장벽 회피와 시장 확보가 목적이에요.', cs: ['spdiv', 'mnc'] },
  { id: '10-d9', t: 'mc', q: '다음 사례와 가장 관련 깊은 것은?', data: '<p>A 지역의 자동차 공장이 임금이 낮은 해외로 옮겨 간 뒤, 협력 업체들이 문을 닫고 실업자가 크게 늘었다.</p>', c: ['다국적 기업 입지 지역의 고용 창출', '산업 공동화', '빨대 효과', '지리적 표시제', '도시 재생'], a: 1, e: '공장이 떠난 지역의 산업 공동화예요.', cs: ['hollow'] },
  { id: '10-d10', t: 'mc', q: '표는 세계 도시를 고를 때 쓰는 지표의 예이다. 세계 도시에 대한 설명으로 옳은 것은?', data: tbl(['측면', '지표'], [['경제', '다국적 기업 본사 수, 금융 기관 수'], ['정치', '국제기구 본부 수, 국제회의 개최 수'], ['문화', '세계적 문화·예술 기관'], ['기반 시설', '국제공항, 첨단 정보 통신 시스템']]), c: ['세계 도시는 한 가지 기준으로만 뽑는다.', '세계 도시에는 소비자 서비스업만 발달한다.', '세계 도시는 국제공항과 관계없다.', '세계 도시에는 다국적 기업 본사와 생산자 서비스업이 모인다.', '세계 도시 안에서는 양극화가 나타나지 않는다.'], a: 3, e: '여러 지표를 종합해 뽑고, 도시 안 양극화 문제도 있어요.', cs: ['wcity'], src: '수특2 117쪽' },
  { id: '10-d11', t: 'mc', q: '(가)~(라)에 나타난 지역화 전략을 바르게 연결한 것은?', data: '<p>(가) 보성 녹차가 지명을 상품명으로 인증받았다.<br>(나) 브라질 리우에서 해마다 카니발을 연다.<br>(다) 뉴욕은 "I♥NY" 로고로 도시를 알린다.<br>(라) 햄버거 회사가 우리나라에서 불고기 버거를 판다.</p>', c: ['(가) 장소 마케팅', '(나) 지리적 표시제', '(가) 지리적 표시제 · (다) 지역 브랜드', '(다) 현지화 전략', '(라) 지역 브랜드'], a: 2, e: '(가) 지리적 표시제, (나) 장소 마케팅, (다) 지역 브랜드, (라) 현지화 전략이에요.', cs: ['gi', 'placemkt', 'mnc'] },
  { id: '10-d12', t: 'mc', q: '표는 계층별 디지털 정보화 수준(일반 국민 = 100)을 나타낸 가상의 자료이다. 이에 대한 설명으로 옳은 것은?', data: tbl(['계층', '고령층', '장애인', '저소득층'], [['정보화 수준', '70', '82', '95']]), c: ['고령층의 정보화 수준이 가장 높다.', '정보 격차는 없다.', '저소득층의 격차가 가장 크다.', '정보화 교육은 필요 없다.', '고령층의 격차가 가장 커서 맞춤형 정보화 교육이 필요하다.'], a: 4, e: '고령층의 격차가 가장 커요.', cs: ['gaps'] },
  // 통합형
  { id: '10-i1', t: 'mc', tag: '환경 연계', q: '열섬 현상과 도시 홍수를 함께 줄이는 방안으로 가장 적절한 것은?', c: ['옥상 정원과 빗물이 스며드는 포장을 늘린다.', '녹지를 모두 주차장으로 바꾼다.', '하천을 모두 덮는다.', '냉방기 사용을 늘린다.', '고층 건물을 빽빽하게 짓는다.'], a: 0, e: '녹지와 투수 면적을 늘리면 기온도 낮추고 빗물도 흡수해요.', cs: ['urbprob'] },
  { id: '10-i2', t: 'mc', tag: '역사 연계', q: '다음 시기에 대한 설명으로 옳은 것은?', data: '<p>1960~70년대 우리나라에서는 공업 도시와 서울로 일자리를 찾아 떠나는 사람들이 크게 늘었다.</p>', c: ['도시화의 초기 단계에 머물렀다.', '이촌 향도로 도시화의 가속화 단계가 진행되었다.', '촌락 인구가 크게 늘었다.', '3차 산업 비율이 가장 낮아졌다.', '교외화가 모두 끝났다.'], a: 1, e: '산업화와 함께 이촌 향도가 활발했어요.', cs: ['rural2urban', 'urbstage'] },
  { id: '10-i3', t: 'mc', tag: '경제 연계', q: '"같은 땅을 두고 여러 기능이 경쟁할 때 가장 높은 지대를 낼 수 있는 기능이 그 땅을 차지한다." 이 원리와 가장 비슷한 것은?', c: ['공공재의 무임승차', '외부 효과', '시장 가격의 자원 배분 기능', '담합', '정보의 비대칭성'], a: 2, e: '가격(지대)이 한정된 땅을 가장 가치 있게 쓰는 곳에 나누어 줘요(3장).', cs: ['rent'] },
  { id: '10-i4', t: 'mc', tag: '윤리 연계', q: '다음 자료의 문제를 해결하는 방안으로 가장 적절한 것은?', data: '<p>수도권으로 인구와 기능이 몰리는 동안 지방 소도시는 인구가 줄고 병원과 상점이 문을 닫고 있다.</p>', c: ['수도권 집중을 더 강화한다.', '지방의 교통을 끊는다.', '소도시의 공공 기관을 모두 없앤다.', '대도시 기능을 나누고 지역 균형 발전 정책을 편다.', '아무것도 하지 않는다.'], a: 3, e: '공정한 기회를 위해 균형 발전이 필요해요.', cs: ['gaps', 'straw'] },
  { id: '10-i5', t: 'mc', tag: '정치 연계', q: '인터넷 청원, 전자 투표처럼 전자 매체로 시민의 의견이 반영되는 민주주의에 대한 설명으로 옳은 것은?', c: ['정치 참여가 줄어든다.', '특정 장소에 모여야만 의견을 낼 수 있다.', '정보 통신 기술과 관계없다.', '정보 격차와 관계없다.', '시민이 모이지 않고도 의견을 낼 기회가 넓어진다.'], a: 4, e: '전자 민주주의예요. 정보 격차 해소가 함께 필요해요.', cs: ['tcdev', 'gaps'] },
  // 보스전: 도시 계획 위원회
  { id: '10-b1', t: 'mc', q: '[위원회 1] 빨대 괴물: "고속 교통망이 생기면 모든 지역이 똑같이 커져!" 이에 대한 반박으로 옳은 것만을 <보기>에서 고른 것은?', box: ['대도시로의 접근성이 좋아져 중소 도시의 기능이 흡수될 수 있다.', '지역 격차가 커질 수 있어 균형 발전 정책이 필요하다.', '교통이 발달하면 이동 시간이 늘어난다.', '모든 지역의 상권이 반드시 똑같이 커진다.'], c: COMBO, a: 0, e: '빨대 효과와 지역 격차예요.', cs: ['straw', 'gaps'] },
  { id: '10-b2', t: 'mc', q: '[위원회 2] 새 지하철 환승역이 생긴 외곽 지역에 나타날 변화로 가장 적절한 것은?', c: ['접근성이 떨어져 지대가 내린다.', '접근성이 좋아져 상업·업무 시설이 모이며 부도심으로 자랄 수 있다.', '공장이 도심으로 옮겨 간다.', '주거 기능이 모두 도심으로 이동한다.', '아무 변화도 없다.'], a: 1, e: '교통 결절지는 부도심이 돼요.', cs: ['subcbd', 'rent'] },

  { id: '11-r09', t: 'ox', q: '공간 불평등은 자연환경이나 생산 요소가 지역마다 달라서 생기기도 한다.', a: true, e: '공간 불평등의 원인이에요.', cs: ['spatial'] },
  { id: '11-r10', t: 'ox', q: '국민 건강 보험은 공공 부조에 속한다.', a: false, e: '사회 보험이에요.', cs: ['socins'] },
  { id: '11-r11', t: 'ox', q: '의료 급여는 공공 부조에 속한다.', a: true, e: '생활이 어려운 국민의 의료비를 지원해요.', cs: ['pubaid'] },
  { id: '11-r12', t: 'ox', q: '장애인 활동 지원은 사회 서비스에 속한다.', a: true, e: '비금전적 지원이에요.', cs: ['socserv'] },
  { id: '11-r13', t: 'ox', q: '고용 보험은 실업이라는 사회적 위험에 대비하는 사회 보험이다.', a: true, e: '사회 보험의 하나예요.', cs: ['socins'] },
  { id: '11-r14', t: 'ox', q: '적극적 평등 실현 조치는 역차별 논란과 전혀 관계가 없다.', a: false, e: '역차별 논란이 찬반 토론의 쟁점이 돼요.', cs: ['affirm'] },
  { id: '11-r15', t: 'ox', q: '공공 기관의 지방 이전은 지역 격차 완화 정책의 예이다.', a: true, e: '균형 발전 정책이에요.', cs: ['regional'] },
  { id: '11-r16', t: 'ox', q: '누진세는 소득이 적은 사람에게 더 높은 세율을 매긴다.', a: false, e: '소득이 많을수록 높은 세율이에요.', cs: ['progtax'] },
  { id: '11-r17', t: 'ox', q: '사회 보험은 대부분 가입이 의무이다.', a: true, e: '위험을 사회 전체가 함께 나누어 지기 위해서예요.', cs: ['socins'] },
  { id: '11-r18', t: 'ox', q: '기회의 평등은 모든 사람에게 제도와 지위에 접근할 기회가 공평하게 주어지는 것이다.', a: true, e: '기회의 평등의 뜻이에요.', cs: ['opportunity'] },
  { id: '11-r19', t: 'ox', q: '사회적 약자는 경제적 지위 때문에 생기지 않는다.', a: false, e: '경제적 지위도 이유가 돼요.', cs: ['weak'] },
  { id: '11-r20', t: 'ox', q: '최저 임금은 저임금 노동자의 생활 안정에 도움이 된다.', a: true, e: '경제적 안정을 위한 노력이에요.', cs: ['progtax', 'stabeffort'] },
  { id: '11-r21', t: 'ox', q: '1인당 GDP는 여가 시간과 환경의 질을 정확히 보여 준다.', a: false, e: 'GDP에 담기지 않는 것들이에요.', cs: ['gdplimit'] },
  { id: '11-r22', t: 'blank', q: '생활에 필요한 재화를 안정적으로 누릴 수 있는 상태는 경제적 (＿＿)이다.', c: ['안정', '성장'], a: 0, e: '경제적 안정이에요.', cs: ['econstab'] },
  { id: '11-r23', t: 'blank', q: '기본적 욕구를 채울 수 있도록 나누는 기준은 (＿＿)에 따른 분배이다.', c: ['업적', '필요'], a: 1, e: '필요에 따른 분배예요.', cs: ['need'] },
  { id: '11-r24', t: 'blank', q: '중간 계층이 줄고 양 끝이 늘어나는 현상은 사회 계층의 (＿＿)이다.', c: ['양극화', '평준화'], a: 0, e: '양극화예요.', cs: ['polar'] },
  { id: '11-r25', t: 'blank', q: '보험료로 질병·실업 등 위험에 대비하는 제도는 사회 (＿＿)이다.', c: ['서비스', '보험'], a: 1, e: '사회 보험이에요.', cs: ['socins'] },
  { id: '11-r26', t: 'blank', q: '국가가 생활이 어려운 국민의 최저 생활을 보장하는 제도는 공공 (＿＿)이다.', c: ['부조', '보험'], a: 0, e: '공공 부조예요.', cs: ['pubaid'] },
  { id: '11-r27', t: 'blank', q: '상담·재활·돌봄 같은 비금전적 지원 제도는 사회 (＿＿)이다.', c: ['보험', '서비스'], a: 1, e: '사회 서비스예요.', cs: ['socserv'] },
  { id: '11-r28', t: 'blank', q: '사회적 약자에게 혜택을 주어 불평등을 바로잡는 제도는 적극적 평등 실현 (＿＿)이다.', c: ['조치', '분업'], a: 0, e: '적극적 평등 실현 조치예요.', cs: ['affirm'] },
  { id: '11-r29', t: 'blank', q: '소득이 많을수록 높은 세율을 매기는 세금은 (＿＿)이다.', c: ['비례세', '누진세'], a: 1, e: '누진세예요.', cs: ['progtax'] },
  { id: '11-r30', t: 'blank', q: '일정한 생업을 뜻하는 맹자의 말은 (＿＿)이다.', c: ['항산', '항심'], a: 0, e: '항산이 있어야 항심이 있다고 했어요.', cs: ['hangsan'] },
  // 자료 해석
  { id: '11-d1', t: 'mc', q: '표는 갑섬과 을섬의 지표를 나타낸 가상의 자료이다. 이에 대한 설명으로 옳은 것은?', data: tbl(['구분', '1인당 GDP', '주당 여가 시간', '기대 수명', '삶의 만족도(10점)'], [['갑섬', '5만 달러', '20시간', '78세', '5.8'], ['을섬', '3만 달러', '32시간', '83세', '7.1']]), c: ['1인당 GDP가 높은 섬이 모든 지표에서 앞선다.', '을섬은 갑섬보다 소득 수준이 높다.', '1인당 GDP만으로 삶의 질을 온전히 판단하기 어렵다.', '갑섬의 기대 수명이 더 길다.', '여가 시간은 갑섬이 더 길다.'], a: 2, e: '소득이 낮은 을섬이 여가, 건강, 만족도에서 앞서요.', cs: ['gdplimit', 'qol'] },
  { id: '11-d2', t: 'mc', q: '다음 대화의 갑~병이 주장하는 분배 기준을 바르게 연결한 것은?', data: '<p>갑: 이번 판매에서 가장 많이 판 사람에게 더 많이 줘야 해요.<br>을: 자격증과 실력이 뛰어난 사람에게 더 줘야 해요.<br>병: 병원비가 급한 가정에 먼저 줘야 해요.</p>', c: ['갑 – 필요, 을 – 업적, 병 – 능력', '갑 – 능력, 을 – 필요, 병 – 업적', '갑 – 업적, 을 – 필요, 병 – 능력', '갑 – 필요, 을 – 능력, 병 – 업적', '갑 – 업적, 을 – 능력, 병 – 필요'], a: 4, e: '판매량은 업적, 실력은 능력, 급한 병원비는 필요예요.', cs: ['merit', 'ability', 'need'] },
  { id: '11-d3', t: 'mc', q: '다음 A, B 분배 기준에 대한 설명으로 옳은 것은? (단, A, B는 각각 업적, 필요 중 하나이다.)', data: '<p>A: 결과를 객관적으로 수량화할 수 있어 평가가 쉽다.<br>B: 사회적 약자에게 최소한의 인간다운 삶을 보장할 수 있다.</p>', c: ['A는 과열 경쟁으로 갈등을 키울 수 있다.', 'A는 필요, B는 업적에 따른 분배이다.', 'A는 사회적 약자에 대한 배려가 가장 뛰어나다.', 'B는 성취동기를 가장 크게 높인다.', 'B는 한정된 자원 문제에서 자유롭다.'], a: 0, e: 'A는 업적, B는 필요에 따른 분배예요.', cs: ['merit', 'need'] },
  { id: '11-d4', t: 'mc', q: '다음 A, B 제도에 대한 설명으로 옳은 것은? (단, A, B는 각각 사회 보험, 공공 부조 중 하나이다.)', data: AB1, c: ['A의 사례로 국민 기초 생활 보장 제도가 있다.', 'A의 사례로 국민 건강 보험이, B의 사례로 기초 연금이 있다.', 'B는 수혜자가 보험료를 부담한다.', 'A는 공공 부조, B는 사회 보험이다.', 'B의 사례로 고용 보험이 있다.'], a: 1, e: 'A는 사회 보험, B는 공공 부조예요.', cs: ['socins', 'pubaid'] },
  { id: '11-d5', t: 'mc', q: '표는 두 지역의 인구 1만 명당 병원 수와 문화 시설 수이다. 이에 대한 설명으로 옳은 것은?', data: tbl(['구분', '병원 수', '문화 시설 수'], [['A 지역(대도시)', '12', '9'], ['B 지역(농촌)', '3', '1']]) + '<p class="note">가상의 자료</p>', c: ['두 지역의 삶의 조건은 같다.', 'B 지역이 의료 시설을 더 쉽게 이용한다.', 'A 지역은 사회적 약자만 산다.', '공간 불평등이 나타난다.', '지역 격차 완화 정책은 필요 없다.'], a: 3, e: '사는 곳에 따라 누릴 수 있는 시설 차이가 커요.', cs: ['spatial', 'regional'] },
  { id: '11-d6', t: 'mc', q: '다음 사례에 대한 옳은 설명만을 <보기>에서 고른 것은?', data: '<p>A 기업은 전체 직원의 일정 비율 이상을 장애인으로 고용해야 한다. B 대학은 사회적 배려 대상자 전형으로 신입생 일부를 선발한다.</p>', box: ['두 사례는 사회 보험에 해당한다.', '두 사례는 적극적 평등 실현 조치에 해당한다.', '사회적 약자가 겪는 불평등을 바로잡으려는 제도이다.', '역차별 논란과는 관계가 없다.'], c: COMBO, a: 2, e: '적극적 평등 실현 조치로, 역차별 논란도 토론 쟁점이 돼요.', cs: ['affirm'] },
  { id: '11-d7', t: 'mc', q: '표는 소득 구간별 세율이다. 이에 대한 설명으로 옳은 것은?', data: tbl(['과세 대상 소득', '세율'], [['1,000만 원 이하', '6%'], ['1,000만 원 초과 ~ 5,000만 원 이하', '15%'], ['5,000만 원 초과', '35%']]) + '<p class="note">가상의 단순화 자료</p>', c: ['모든 소득에 같은 세율이 적용된다.', '소득이 적을수록 세율이 높다.', '이 제도는 소득 재분배와 관계없다.', '비례세 구조이다.', '소득이 많을수록 높은 세율이 적용되는 누진세 구조이다.'], a: 4, e: '누진세는 소득 재분배에 도움이 돼요.', cs: ['progtax'] },
  { id: '11-d8', t: 'mc', q: '다음 글에 나타난 사상가의 주장으로 가장 적절한 것은?', data: '<p>일정한 생업이 없으면 일반 백성은 흔들림 없는 도덕적 마음을 지키기 어렵다. 현명한 군주는 먼저 백성의 생업을 마련해 주어야 한다.</p>', c: ['경제적 안정이 도덕적 삶의 기반이다.', '도덕은 경제와 전혀 관계없다.', '백성은 굶주려도 도덕을 지켜야 한다.', '군주는 백성의 생업에 관여하면 안 된다.', '부유한 사람만 도덕적일 수 있다.'], a: 0, e: '맹자의 항산·항심이에요.', cs: ['hangsan'], src: '수특1 34쪽' },
  { id: '11-d9', t: 'mc', q: '(가)~(라)에 해당하는 복지 제도를 바르게 연결한 것은?', data: '<p>(가) 공장에서 일하다 다친 노동자가 치료비와 휴업 급여를 받았다.<br>(나) 소득이 거의 없는 가정이 매달 생계비를 지원받았다.<br>(다) 홀로 사는 어르신이 정기적으로 방문 돌봄을 받는다.<br>(라) 직장을 잃은 노동자가 구직 급여를 받았다.</p>', c: ['(가) 공공 부조', '(가) 사회 보험 · (나) 공공 부조', '(나) 사회 서비스', '(다) 사회 보험', '(라) 공공 부조'], a: 1, e: '(가) 산재 보험·(라) 고용 보험은 사회 보험, (나) 공공 부조, (다) 사회 서비스예요.', cs: ['socins', 'pubaid', 'socserv'] },
  { id: '11-d10', t: 'mc', q: '다음 글의 주장에 대한 설명으로 옳은 것은?', data: '<p>같은 시험 점수라도 어떤 학생은 좋은 환경에서, 어떤 학생은 어려운 환경에서 이뤄 냈다. 결과만으로 보상하면 출발선의 차이가 그대로 굳어진다.</p>', c: ['업적에 따른 분배를 전적으로 옹호한다.', '필요에 따른 분배의 단점을 지적한다.', '능력 평가가 가장 쉽다고 본다.', '업적에 따른 분배에 우연적 요소가 끼어들 수 있음을 지적한다.', '기회의 평등은 필요 없다고 본다.'], a: 3, e: '환경 같은 우연적 요소가 업적에 끼어들 수 있어요.', cs: ['merit', 'opportunity'] },
  { id: '11-d11', t: 'mc', q: '표는 섬 정부의 정책 목록이다. 경제적 안정을 위한 노력과 거리가 먼 것은?', data: '<p>(가) 청년 일자리 창출 사업<br>(나) 최저 임금 보장<br>(다) 복지관 건립<br>(라) 모든 복지 예산 폐지<br>(마) 저소득층 교육비 지원</p>', c: ['(가)', '(나)', '(라)', '(다)', '(마)'], a: 2, e: '복지를 없애면 경제적 안정이 흔들려요.', cs: ['stabeffort'] },
  { id: '11-d12', t: 'mc', q: '다음 두 지역 정책에 대한 설명으로 옳은 것은?', data: '<p>(가) 수도권의 공공 기관 일부를 지방 도시로 옮긴다.<br>(나) 지방으로 공장을 옮기는 기업에 세금을 깎아 준다.</p>', c: ['사회 계층의 양극화를 키우려는 정책이다.', '사회 보험 제도이다.', '공공 부조 제도이다.', '적극적 평등 실현 조치의 예이다.', '공간 불평등을 줄이려는 지역 격차 완화 정책이다.'], a: 4, e: '국토의 균형 발전을 꾀하는 정책이에요.', cs: ['regional', 'spatial'] },
  // 통합형
  { id: '11-i1', t: 'mc', tag: '경제 연계', q: '누진세로 걷은 세금을 공공 부조에 쓸 때 나타날 수 있는 효과로 가장 적절한 것은?', c: ['소득 재분배로 경제적 불평등이 줄어든다.', '고소득층의 소득이 늘어난다.', '모든 사람의 세율이 같아진다.', '사회 보험료가 사라진다.', '시장 가격이 모두 고정된다.'], a: 0, e: '정부의 소득 재분배 역할이에요(3장).', cs: ['progtax', 'pubaid'] },
  { id: '11-i2', t: 'mc', tag: '윤리 연계', q: '롤스의 입장에서 사회적·경제적 불평등이 정당화되는 조건으로 가장 적절한 것은?', c: ['최대 다수의 행복을 늘릴 때', '최소 수혜자에게 최대 이익이 되도록 편성될 때', '소유 권리를 배타적으로 보장할 때', '공동체의 전통을 따를 때', '모든 것을 똑같이 나눌 때'], a: 1, e: '롤스의 차등의 원칙이에요.', cs: ['justice'], src: '수특2 60쪽' },
  { id: '11-i3', t: 'mc', tag: '지리 연계', q: '10장의 빨대 효과와 11장의 공간 불평등을 함께 줄이는 정책으로 가장 적절한 것은?', c: ['대도시에 모든 병원을 모은다.', '지방 도시의 교통을 끊는다.', '공공 기관을 지방으로 옮기고 지방의 의료·문화 시설을 늘린다.', '농촌 인구를 모두 대도시로 옮긴다.', '지역 축제를 모두 없앤다.'], a: 2, e: '지역 격차 완화 정책이에요.', cs: ['regional', 'spatial'] },

  { id: '11-i5', t: 'mc', tag: '인권 연계', q: '다음 사례에 대한 판단으로 가장 적절한 것은?', data: '<p>어느 회사가 채용 과정에서 능력과 관계없이 나이가 많다는 이유만으로 지원자를 탈락시켰다.</p>', c: ['회사의 자유이므로 문제가 없다.', '업적에 따른 분배의 정당한 예이다.', '능력에 따른 분배의 모범 사례이다.', '사회적 약자에게 도움을 준 사례이다.', '나이를 이유로 한 차별로, 인간의 존엄과 권리를 침해할 수 있다.'], a: 4, e: '사회적 약자에 대한 차별이에요.', cs: ['weak'] },

  { id: '11-b1', t: 'mc', q: '[법정 1] A, B 제도에 대한 옳은 설명만을 <보기>에서 고른 것은? (단, A, B는 각각 사회 보험, 공공 부조 중 하나이다.)', data: AB1, box: ['A는 사회 보험이다.', 'B는 국가의 책임 아래 운영된다.', 'A의 사례로 의료 급여가 있다.', 'B의 수혜자는 보험료를 내야 한다.'], c: COMBO, a: 0, e: '의료 급여는 공공 부조예요.', cs: ['socins', 'pubaid'] },
  { id: '11-b2', t: 'mc', q: '[법정 2] 박사: "소득만 오르면 누구나 행복해진다!" 이에 대한 반박으로 가장 적절한 것은?', c: ['맞아요, 소득이 전부예요.', '소득 외에 분배, 건강, 여가, 환경 같은 삶의 질도 행복에 중요해요.', '소득은 행복과 전혀 관계없어요.', '복지가 소득을 모두 대신해요.', '1인당 GDP가 모든 걸 보여 줘요.'], a: 1, e: '1인당 GDP의 한계예요.', cs: ['gdplimit', 'qol'] },
  { id: '11-b3', t: 'mc', q: '[법정 3] A, B 분배 기준에 대한 설명으로 옳은 것은? (단, A, B는 각각 능력, 필요 중 하나이다.)', data: '<p>A: 뛰어난 사람에게 더 많이 보상해 잠재력을 실현하게 한다.<br>B: 인간다운 삶을 위한 기본적 욕구를 채우도록 나눈다.</p>', c: ['A는 필요에 따른 분배이다.', 'B는 성취동기를 가장 크게 높인다.', 'A는 평가 기준을 마련하기 어렵다는 단점이 있다.', 'B는 자원이 한정되어도 모든 필요를 채울 수 있다.', 'A와 B는 같은 기준이다.'], a: 2, e: 'A는 능력, B는 필요에 따른 분배예요.', cs: ['ability', 'need'] },
  { id: '11-b4', t: 'mc', q: '[법정 4] 다음 중 사회 서비스의 사례로 가장 적절한 것은?', c: ['국민연금', '고용 보험', '국민 기초 생활 보장 제도', '장애인 활동 지원', '기초 연금'], a: 3, e: '비금전적 지원이에요.', cs: ['socserv'] },
  { id: '11-b5', t: 'mc', q: '[법정 5] 표에 나타난 현상으로 가장 적절한 것은?', data: tbl(['계층', '과거', '현재'], [['상층', '10%', '20%'], ['중간층', '70%', '50%'], ['하층', '20%', '30%']]) + '<p class="note">가상의 자료</p>', c: ['공간 불평등의 해소', '사회 계층의 평준화', '중간층의 증가', '하층의 감소', '사회 계층의 양극화'], a: 4, e: '중간층이 줄고 양 끝이 늘었어요.', cs: ['polar'] },
  { id: '11-b6', t: 'mc', q: '[법정 6] A, B에 대한 설명으로 옳은 것은? (단, A, B는 각각 업적, 필요에 따른 분배 중 하나이다.)', data: '<p>A: 과열 경쟁으로 구성원 사이의 갈등이 커질 우려가 있다.<br>B: 업적을 쌓으려는 성취동기가 떨어질 수 있다.</p>', c: ['A는 업적, B는 필요에 따른 분배이다.', 'A는 필요, B는 업적에 따른 분배이다.', 'A는 사회적 약자를 가장 잘 배려한다.', 'B는 결과를 수량화하기 쉽다.', 'A와 B 모두 단점이 없다.'], a: 0, e: '각 기준의 단점이에요.', cs: ['merit', 'need'] },

  { id: '11-b8', t: 'mc', q: '[법정 8] 다음 대화에서 옳게 말한 사람만을 있는 대로 고른 것은?', data: '<p>갑: 고용 보험은 사회 보험이에요.<br>을: 기초 연금은 사회 서비스예요.<br>병: 국민 기초 생활 보장 제도는 공공 부조예요.</p>', c: ['갑', '을', '갑, 병', '을, 병', '갑, 을, 병'], a: 2, e: '기초 연금은 공공 부조예요.', cs: ['socins', 'pubaid'] },

  { id: '11-b11', t: 'mc', q: '[법정 11] 다음 글과 관련 깊은 개념은?', data: '<p>옆집보다 소득이 크게 모자라다고 느낀 주민이 먹고사는 데 문제가 없는데도 자신이 부당하게 덜 누린다고 괴로워한다.</p>', c: ['상대적 박탈감', '절대 빈곤', '규모의 경제', '빨대 효과', '교외화'], a: 0, e: '절대 빈곤이 없어도 생길 수 있어요.', cs: ['relative'] },
  { id: '11-b12', t: 'mc', q: '[법정 12] A, B 세금에 대한 설명으로 옳은 것은? (단, A, B는 각각 누진세, 비례세 중 하나이다.)', data: '<p>A: 소득이 많을수록 더 높은 세율을 적용한다.<br>B: 소득과 관계없이 같은 세율을 적용한다.</p>', c: ['A는 비례세이다.', 'A는 B보다 소득 재분배 효과가 크다.', 'B는 소득이 많을수록 세율이 높다.', 'A와 B의 재분배 효과는 같다.', 'B는 누진세이다.'], a: 1, e: '누진세가 재분배 효과가 커요.', cs: ['progtax'] },

function pyrSVG(rows, title) {
  const W = 140, mx = Math.max(...rows.flat());
  const bar = (v, left, y) => { const w = v / mx * 58; return left ? `<rect x="${70 - 4 - w}" y="${y}" width="${w}" height="12" fill="#3C6FD1"/>` : `<rect x="${74}" y="${y}" width="${w}" height="12" fill="#E0456A"/>`; };
  const labels = ['노년', '청장년', '', '', '유소년'];
  let s = rows.map(([m, f], i) => bar(m, 1, 8 + i * 14) + bar(f, 0, 8 + i * 14)).join('');
  s += `<line x1="70" y1="4" x2="70" y2="${8 + rows.length * 14}" stroke="currentColor"/>`;
  s += `<text x="70" y="${22 + rows.length * 14}" font-size="10" text-anchor="middle" fill="currentColor" font-weight="800">${title}</text>`;
  return `<svg viewBox="0 0 ${W} ${28 + rows.length * 14}" class="pyr" role="img" aria-label="${title} 인구 피라미드">${s}</svg>`;
}

  resource: { name: '자원의 특성', core: '자원은 인간에게 쓸모가 있고 기술·경제적으로 이용할 수 있는 것이에요. 유한성, 편재성, 가변성의 특성이 있어요.', why: '대부분 매장량이 한정되어 있고(유한성), 일부 지역에 몰려 있으며(편재성), 기술과 경제 조건에 따라 가치가 달라져요(가변성).', exam: '세 특성을 사례와 짝짓는 문항이 나와요.', deep: '예전에는 쓸모없던 물질이 기술 발달로 귀한 자원이 되기도 해요. 그것이 가변성이에요.', src: '수특2 170쪽' },
  reserve: { name: '가채 연수', core: '확인 매장량을 연 생산량으로 나눈 값으로, 앞으로 몇 년 동안 그 자원을 생산할 수 있는지 나타내요.', why: '확인 매장량이 1,000억 배럴이고 해마다 25억 배럴을 생산하면 가채 연수는 40년이에요.', exam: '새 매장지가 발견되거나 기술이 발달하면 가채 연수가 늘어날 수 있어요.', deep: '가채 연수는 자원의 유한성을 숫자로 보여 줘요.', src: '수특2 170쪽' },

  fossil: { name: '화석 에너지', core: '석유, 석탄, 천연가스처럼 오랜 시간 땅속에 묻힌 생물에서 만들어진 에너지예요.', why: '세계 1차 에너지 소비는 계속 늘고 있고, 여전히 화석 에너지 의존도가 높아요. 소비량은 석유 > 석탄 > 천연가스 순이에요(2024년).', exam: '중국·인도는 석탄, 사우디아라비아는 석유, 러시아·이란은 천연가스, 캐나다·브라질은 수력의 소비 비율이 상대적으로 높아요.', deep: '화석 에너지는 생산이 많은 지역에서 소비가 많은 지역으로 활발히 이동해요.', src: '수특2 170쪽' },
  renew: { name: '신재생 에너지', core: '태양광, 풍력처럼 고갈될 걱정이 적고 온실가스를 거의 내지 않는 재생 에너지와, 수소 같은 새로운 에너지를 함께 부르는 말이에요.', why: '기후 변화 대응에 꼭 필요하지만, 날씨에 따라 발전량이 달라지고 넓은 땅과 초기 비용이 필요한 단점도 있어요.', exam: '신재생 에너지의 장점(고갈 걱정 적음, 저탄소)과 단점(불안정한 공급, 입지 제약)을 함께 기억해요.', deep: '남는 전기를 저장하는 에너지 저장 장치가 불안정성을 보완해요.', src: '수특2 170쪽 · 수특1 76쪽' },
  climate: { name: '기후 변화 협약의 흐름', core: '유엔 기후변화 협약(1992년) → 교토 의정서(1997년) → 파리 협정(2015년)으로 이어져 왔어요.', why: '교토 의정서는 38개 선진국 등에 감축 목표를 주고 배출권 거래제를 도입했지만 일부 나라에만 의무가 있었어요. 파리 협정은 모든 당사국이 참여하게 했어요.', exam: '협약의 연도와 특징을 순서대로 짝짓는 문항이 나와요.', deep: '기후변화에 관한 정부 간 협의체(IPCC)는 기후 변화를 과학적으로 밝히는 국제기구예요(1988년 설립).', src: '수특2 173쪽 · 수특1 76쪽' },

  { id: '12-c2b', t: 'ox', q: '노년 부양비는 노년층 인구를 유소년층 인구로 나눈 값이다.', a: false, e: '분모는 청장년층이에요.', cs: ['depratio'] },
  { id: '12-c2c', t: 'ox', q: '65세 이상 인구 비율이 20% 이상이면 초고령 사회이다.', a: true, e: '7% 고령화, 14% 고령, 20% 초고령 사회예요.', cs: ['lowbirth'] },
  { id: '12-c2d', t: 'mc', q: '표에서 A국의 노년 부양비는?', data: DEP12, c: ['30', '60', '50', '100', '150'], a: 1, e: '(30 ÷ 50) × 100 = 60이에요.', cs: ['depratio'] },
  { id: '12-c2e', t: 'mc', q: '저출생·고령화의 영향으로 가장 적절한 것은?', c: ['경제 활동 인구가 줄고 노년층을 위한 사회적 비용이 늘어난다.', '유소년 부양비가 크게 늘어난다.', '노동력이 남아돈다.', '청장년층 비율이 계속 늘어난다.', '사회 보장 비용이 줄어든다.'], a: 0, e: '노동력 부족과 부양 부담 증가가 함께 나타나요.', cs: ['lowbirth'] },
  // 개념 2: 자원
  { id: '12-c3a', t: 'ox', q: '자원의 편재성은 특정 자원이 일부 지역에 몰려 있는 특성이다.', a: true, e: '자원 민족주의와 분쟁의 배경이에요.', cs: ['resource'] },
  { id: '12-c3b', t: 'ox', q: '가채 연수는 연 생산량을 확인 매장량으로 나눈 값이다.', a: false, e: '확인 매장량 ÷ 연 생산량이에요.', cs: ['reserve'] },
  { id: '12-c3c', t: 'ox', q: '신재생 에너지는 날씨에 따라 발전량이 달라질 수 있다.', a: true, e: '공급 안정성이 단점이에요.', cs: ['renew'] },
  { id: '12-c3d', t: 'mc', q: '확인 매장량이 1,000억 배럴이고 연 생산량이 25억 배럴인 석유의 가채 연수는?', c: ['25년', '1,000년', '40년', '2.5년', '400년'], a: 2, e: '1,000 ÷ 25 = 40년이에요.', cs: ['reserve'] },
  { id: '12-c3e', t: 'mc', q: '자원의 특성과 사례를 바르게 연결한 것은?', c: ['유한성 – 기술 발달로 쓸모없던 광물이 귀해졌다.', '편재성 – 석유는 모든 나라에 고르게 묻혀 있다.', '가변성 – 석유는 언젠가 고갈된다.', '편재성 – 석유가 일부 지역에 몰려 있어 자원 민족주의가 나타난다.', '유한성 – 문화에 따라 자원의 가치가 달라진다.'], a: 3, e: '유한성은 고갈, 가변성은 기술·경제·문화에 따른 가치 변화예요.', cs: ['resource', 'resnat'] },
  // 개념 3: 기후
  { id: '12-c4a', t: 'ox', q: '파리 협정은 모든 당사국이 온실가스 감축에 참여하도록 하였다.', a: true, e: '교토 의정서의 한계를 넘었어요.', cs: ['paris'] },
  { id: '12-c4b', t: 'ox', q: '탄소 중립은 온실가스를 단 한 톨도 배출하지 않는 상태이다.', a: false, e: '배출량과 흡수량을 상쇄해 순배출이 0인 상태예요.', cs: ['netzero'] },
  { id: '12-c4c', t: 'ox', q: '그린워싱은 일반 제품을 친환경 제품인 것처럼 광고하는 것이다.', a: true, e: '소비자를 속이는 행위예요.', cs: ['re100'] },
  { id: '12-c4d', t: 'mc', q: '기후 변화 협약을 채택된 순서대로 바르게 나열한 것은?', c: ['파리 협정 → 교토 의정서 → 유엔 기후변화 협약', '교토 의정서 → 유엔 기후변화 협약 → 파리 협정', '유엔 기후변화 협약 → 파리 협정 → 교토 의정서', '파리 협정 → 유엔 기후변화 협약 → 교토 의정서', '유엔 기후변화 협약 → 교토 의정서 → 파리 협정'], a: 4, e: '1992년 → 1997년 → 2015년이에요.', cs: ['climate'] },
  { id: '12-c4e', t: 'mc', q: '온실가스 배출권 거래제에 대한 설명으로 옳은 것은?', c: ['배출 총량을 정하고 남은 배출권을 사고팔 수 있게 한다.', '배출량과 관계없이 모든 기업이 같은 세금을 낸다.', '배출권은 한 번 받으면 거래할 수 없다.', '감축 비용이 높은 곳이 가장 많이 줄여야 한다.', '온실가스와 관계없는 제도이다.'], a: 0, e: '감축 비용이 낮은 곳이 더 줄이고 팔아요.', cs: ['ets'] },
  // 개념 4: 지속가능한 미래
  { id: '12-c5a', t: 'ox', q: '지속가능발전목표(SDGs)는 2030년까지 이루려는 17개 목표이다.', a: true, e: '2015년 UN 총회에서 채택됐어요.', cs: ['sdgs'] },
  { id: '12-c5b', t: 'ox', q: '지속가능한 발전은 현세대의 필요를 위해 미래 세대의 자원을 마음껏 써도 된다고 본다.', a: false, e: '미래 세대의 여건을 해치지 않는 범위여야 해요.', cs: ['sustdev'] },
  { id: '12-c5c', t: 'ox', q: '로컬 푸드 구매는 개인이 실천할 수 있는 지속가능한 발전의 노력이다.', a: true, e: '운송 거리가 짧아요.', cs: ['efforts12'] },
  { id: '12-c5d', t: 'mc', q: '인공지능 발달이 일자리에 미칠 영향에 대한 설명으로 가장 적절한 것은?', c: ['모든 일자리가 곧바로 사라진다.', '일부 일자리는 대체되고 새 일자리도 생겨 재교육이 필요하다.', '일자리에는 아무 영향이 없다.', '노동 시장의 양극화가 사라진다.', '고용 보험이 필요 없어진다.'], a: 1, e: '변화에 맞춘 재교육과 제도 정비가 필요해요.', cs: ['ai12'] },
  { id: '12-c5e', t: 'mc', q: '지속가능한 발전을 위한 노력의 주체와 사례를 바르게 연결한 것은?', c: ['개인 – 지속가능발전목표 채택', '국제 사회 – 로컬 푸드 구매', '국가 – 에너지 절약만', '국가 – 탄소 중립 포인트 제도, 개인 – 공정 무역 제품 이용', '개인 – 공적 개발 원조'], a: 3, e: 'SDGs 채택과 ODA는 국제 사회의 노력이에요.', cs: ['efforts12', 'sdgs'] },
  // 퀴즈 러시
  { id: '12-r01', t: 'ox', q: '개발 도상국은 대체로 유소년층 인구 비율이 높다.', a: true, e: '피라미드형이 나타나요.', cs: ['popstruct'] },
  { id: '12-r02', t: 'ox', q: '총부양비는 유소년 부양비와 노년 부양비를 곱한 값이다.', a: false, e: '두 값을 더해요.', cs: ['depratio'] },
  { id: '12-r03', t: 'ox', q: '고령화는 의학 발달에 따른 평균 수명 연장과 관계가 있다.', a: true, e: '고령화의 원인이에요.', cs: ['lowbirth'] },
  { id: '12-r04', t: 'ox', q: '인구 이동 가운데 경제적 이동이 가장 적다.', a: false, e: '경제적 이동이 가장 많아요.', cs: ['migration'] },
  { id: '12-r05', t: 'ox', q: '해수면 상승을 피해 이동하는 것은 환경적 이동이다.', a: true, e: '기후 변화에 따른 이동이에요.', cs: ['migration'] },
  { id: '12-r06', t: 'ox', q: '자원의 가변성은 기술과 경제 조건에 따라 자원의 가치가 달라지는 특성이다.', a: true, e: '가변성의 뜻이에요.', cs: ['resource'] },
  { id: '12-r07', t: 'ox', q: '대부분의 자원은 매장량이 한정되어 있지 않다.', a: false, e: '유한성이 있어요.', cs: ['resource'] },
  { id: '12-r08', t: 'ox', q: '2024년 세계 화석 에너지 소비량은 석유가 가장 많다.', a: true, e: '석유 > 석탄 > 천연가스 순이에요.', cs: ['fossil'] },
  { id: '12-r09', t: 'ox', q: '신재생 에너지는 온실가스를 가장 많이 배출한다.', a: false, e: '온실가스를 거의 배출하지 않아요.', cs: ['renew'] },
  { id: '12-r10', t: 'ox', q: '교토 의정서는 모든 당사국에 감축 의무를 부과하였다.', a: false, e: '일부 선진국 등에만 부과했어요.', cs: ['climate'] },
  { id: '12-r11', t: 'ox', q: '파리 협정은 기온 상승을 1.5℃ 이하로 제한하도록 노력하는 것을 목표로 한다.', a: true, e: '2℃보다 상당히 낮게, 1.5℃ 이하를 위해 노력해요.', cs: ['paris'] },
  { id: '12-r12', t: 'ox', q: '배출권 거래제에서는 감축 비용이 낮은 기업이 더 줄이고 배출권을 팔 수 있다.', a: true, e: '그래서 전체 감축 비용이 줄어요.', cs: ['ets'] },
  { id: '12-r13', t: 'ox', q: 'RE100은 기업이 쓰는 전력을 모두 화석 에너지로 바꾸자는 캠페인이다.', a: false, e: '재생 에너지로 바꾸자는 캠페인이에요.', cs: ['re100'] },
  { id: '12-r14', t: 'ox', q: '그린워싱은 소비자를 속이는 행위이다.', a: true, e: '친환경인 척하는 광고예요.', cs: ['re100'] },
  { id: '12-r15', t: 'ox', q: '지속가능한 발전은 환경 보전만 생각하고 경제 성장은 포기한다.', a: false, e: '경제·사회·환경을 함께 생각해요.', cs: ['sustdev'] },
  { id: '12-r16', t: 'ox', q: '공적 개발 원조(ODA)는 국제 사회의 노력에 해당한다.', a: true, e: '개발 도상국을 지원해요.', cs: ['sdgs'] },
  { id: '12-r17', t: 'ox', q: '인공지능의 발달은 사생활 침해나 데이터 편향 같은 문제와 관계가 없다.', a: false, e: '함께 대비해야 할 문제예요.', cs: ['ai12'] },
  { id: '12-r18', t: 'ox', q: '미래학을 이용하면 미래를 정확하게 예측할 수 있다.', a: false, e: '어느 정도 내다볼 수 있을 뿐이에요.', cs: ['future'] },
  { id: '12-r19', t: 'ox', q: '자원 민족주의는 자원의 편재성과 관계가 있다.', a: true, e: '자원이 몰린 나라가 자원을 통제해요.', cs: ['resnat'] },
  { id: '12-r20', t: 'ox', q: 'IPCC는 기후 변화를 과학적으로 밝히는 데 기여하는 국제기구이다.', a: true, e: '1988년에 설립됐어요.', cs: ['climate'] },
  { id: '12-r21', t: 'ox', q: '인구 유입국에서는 이주민과 기존 주민의 갈등이 전혀 생기지 않는다.', a: false, e: '경제적·문화적 갈등이 생길 수 있어요.', cs: ['migration'] },
  { id: '12-r22', t: 'blank', q: '노년 부양비 = (노년층 ÷ (＿＿)) × 100이다.', c: ['청장년층', '유소년층'], a: 0, e: '분모는 청장년층이에요.', cs: ['depratio'] },
  { id: '12-r23', t: 'blank', q: '65세 이상 인구 비율이 14% 이상 20% 미만이면 (＿＿) 사회이다.', c: ['고령화', '고령'], a: 1, e: '고령 사회예요.', cs: ['lowbirth'] },
  { id: '12-r24', t: 'blank', q: '확인 매장량을 연 생산량으로 나눈 값은 (＿＿) 연수이다.', c: ['가채', '내구'], a: 0, e: '가채 연수예요.', cs: ['reserve'] },
  { id: '12-r25', t: 'blank', q: '자원이 일부 지역에 몰려 있는 특성은 (＿＿)이다.', c: ['가변성', '편재성'], a: 1, e: '편재성이에요.', cs: ['resource'] },
  { id: '12-r26', t: 'blank', q: '2015년 채택되어 모든 당사국이 참여하는 기후 협약은 (＿＿) 협정이다.', c: ['파리', '교토'], a: 0, e: '파리 협정이에요.', cs: ['paris'] },
  { id: '12-r27', t: 'blank', q: '순배출량이 0인 상태는 탄소 (＿＿)이다.', c: ['포집', '중립'], a: 1, e: '탄소 중립(넷 제로)이에요.', cs: ['netzero'] },
  { id: '12-r28', t: 'blank', q: '배출 허용량을 사고파는 제도는 온실가스 배출권 (＿＿)제이다.', c: ['거래', '할당'], a: 0, e: '배출권 거래제예요.', cs: ['ets'] },
  { id: '12-r29', t: 'blank', q: '일반 제품을 친환경인 것처럼 광고하는 것은 (＿＿)이다.', c: ['RE100', '그린워싱'], a: 1, e: '그린워싱이에요.', cs: ['re100'] },
  { id: '12-r30', t: 'blank', q: '2030년까지 이루려는 17개 목표는 지속가능발전(＿＿)이다.', c: ['목표', '협약'], a: 0, e: '지속가능발전목표(SDGs)예요.', cs: ['sdgs'] },
  // 자료 해석
  { id: '12-d1', t: 'mc', q: '그림은 세 나라 (가)~(다)의 인구 피라미드이다. 이에 대한 설명으로 옳은 것은?', data: PYRS, c: ['(가)는 노년층 비율이 가장 높다.', '(나)는 유소년층 비율이 가장 높다.', '(가)는 개발 도상국, (나)는 선진국의 인구 구조에 가깝다.', '(다)는 피라미드형이다.', '세 나라의 노년 부양비는 같다.'], a: 2, e: '(가)는 아래가 넓은 피라미드형, (나)는 노년층이 두꺼운 선진국형이에요.', cs: ['popstruct'] },
  { id: '12-d2', t: 'mc', q: '표에 대한 설명으로 옳은 것은?', data: DEP12, c: ['A국의 유소년 부양비는 20이다.', 'B국의 노년 부양비는 A국보다 높다.', 'B국의 총부양비는 100이다.', 'A국은 B국보다 유소년 부양비가 높다.', 'A국의 총부양비는 100이다.'], a: 4, e: 'A국: 유소년 40 + 노년 60 = 100. B국: 유소년 약 72.7 + 노년 약 9.1이에요.', cs: ['depratio'] },
  { id: '12-d3', t: 'mc', q: '표는 어느 나라의 65세 이상 인구 비율 변화이다. 이에 대한 설명으로 옳은 것은?', data: tbl(['연도', '2000년', '2018년', '2025년'], [['65세 이상 비율', '7.2%', '14.3%', '20.3%']]) + '<p class="note">가상의 자료</p>', c: ['2025년에 초고령 사회가 되었다.', '2000년에 고령 사회였다.', '2018년에 초고령 사회였다.', '노년층 비율이 줄었다.', '고령화가 멈추었다.'], a: 0, e: '7% 고령화 사회 → 14% 고령 사회 → 20% 초고령 사회예요.', cs: ['lowbirth'] },
  { id: '12-d4', t: 'mc', q: '다음 사례에 나타난 인구 이동의 유형으로 가장 적절한 것은?', data: '<p>(가) 임금이 높은 나라로 일자리를 찾아 떠났다.<br>(나) 전쟁을 피해 이웃 나라로 피난했다.<br>(다) 해수면이 높아져 섬을 떠났다.</p>', c: ['(가) 정치적, (나) 경제적, (다) 환경적', '(가) 경제적, (나) 정치적, (다) 환경적', '(가) 환경적, (나) 정치적, (다) 경제적', '(가) 경제적, (나) 환경적, (다) 정치적', '(가) 정치적, (나) 환경적, (다) 경제적'], a: 1, e: '일자리는 경제적, 전쟁은 정치적, 해수면 상승은 환경적 이동이에요.', cs: ['migration'] },
  { id: '12-d5', t: 'mc', q: '표는 두 자원의 확인 매장량과 연 생산량이다. 이에 대한 설명으로 옳은 것은?', data: tbl(['구분', '확인 매장량', '연 생산량'], [['A 자원', '600억 톤', '20억 톤'], ['B 자원', '1,000억 톤', '50억 톤']]) + '<p class="note">가상의 자료</p>', c: ['A 자원의 가채 연수는 20년이다.', 'B 자원의 가채 연수는 50년이다.', 'B 자원의 가채 연수가 A 자원보다 길다.', 'A 자원의 가채 연수가 B 자원보다 10년 길다.', '두 자원의 가채 연수는 같다.'], a: 3, e: 'A는 600 ÷ 20 = 30년, B는 1,000 ÷ 50 = 20년이에요.', cs: ['reserve'] },
  { id: '12-d6', t: 'mc', q: '다음 자료에 대한 옳은 설명만을 <보기>에서 고른 것은?', data: '<p>석유 매장량의 절반 이상이 한 지역에 몰려 있다. 이 지역의 산유국들이 생산량을 줄이자 국제 유가가 크게 올랐다.</p>', box: ['자원의 편재성을 보여 준다.', '자원 민족주의와 관계없다.', '자원을 수입하는 나라의 경제가 영향을 받을 수 있다.', '석유는 고르게 분포한다.'], c: COMBO, a: 1, e: '편재성과 자원 민족주의가 수입국 경제를 흔들어요.', cs: ['resource', 'resnat'] },
  { id: '12-d7', t: 'mc', q: '표는 두 공장의 온실가스 1톤 감축 비용이다. 두 공장이 합쳐서 20톤을 줄여야 할 때, 옳은 설명은?', data: tbl(['구분', '1톤 감축 비용'], [['A 공장', '10만 원'], ['B 공장', '50만 원']]), c: ['두 공장이 10톤씩 줄이는 것이 가장 싸다.', 'B 공장이 20톤을 모두 줄이는 것이 가장 싸다.', '어떻게 나누어 줄여도 전체 비용은 같다.', 'A 공장이 20톤을 줄이고 B 공장에 배출권을 팔면 전체 감축 비용이 가장 적다.', '배출권 거래는 비용과 관계없다.'], a: 3, e: '10톤씩이면 600만 원, A가 20톤을 줄이면 200만 원이에요.', cs: ['ets'] },
  { id: '12-d8', t: 'mc', q: '다음 대화에서 옳게 말한 사람만을 있는 대로 고른 것은?', data: '<p>갑: 교토 의정서에서 배출권 거래제가 도입되었어요.<br>을: 파리 협정은 일부 선진국에만 의무를 주었어요.<br>병: 파리 협정은 2015년에 채택되었어요.</p>', c: ['갑, 병', '갑', '을', '을, 병', '갑, 을, 병'], a: 0, e: '일부 선진국에만 의무를 준 것은 교토 의정서예요.', cs: ['climate', 'paris'] },
  { id: '12-d9', t: 'mc', q: '다음 광고에 대한 판단으로 가장 적절한 것은?', data: '<p>"100% 친환경 생수!" — 조사해 보니 병과 뚜껑은 일반 플라스틱이고, 친환경 인증도 받지 않았다.</p>', c: ['RE100의 모범 사례이다.', 'ESG 경영의 좋은 예이다.', '탄소 중립을 이룬 사례이다.', '신재생 에너지 사용 사례이다.', '그린워싱으로 소비자를 속일 수 있다.'], a: 4, e: '친환경인 척하는 그린워싱이에요.', cs: ['re100'] },
  { id: '12-d10', t: 'mc', q: '다음 (가)~(다)를 노력의 주체와 바르게 연결한 것은?', data: '<p>(가) 2030년까지 17개 목표를 채택했다.<br>(나) 탄소 중립 포인트 제도를 넓혔다.<br>(다) 가까운 농장의 로컬 푸드를 샀다.</p>', c: ['(가) 개인, (나) 국가, (다) 국제 사회', '(가) 국가, (나) 국제 사회, (다) 개인', '(가) 국제 사회, (나) 국가, (다) 개인', '(가) 개인, (나) 국제 사회, (다) 국가', '(가) 국가, (나) 개인, (다) 국제 사회'], a: 2, e: 'SDGs는 국제 사회, 포인트 제도는 국가, 로컬 푸드는 개인의 노력이에요.', cs: ['sdgs', 'efforts12'] },
  { id: '12-d11', t: 'mc', q: '표는 두 발전 방식의 특징을 가상의 점수로 나타낸 것이다(점수가 클수록 높음). 이에 대한 설명으로 옳은 것은?', data: tbl(['구분', '탄소 배출', '공급 안정성', '연료 고갈 걱정'], [['A(석탄 화력)', '5', '5', '4'], ['B(태양광)', '1', '2', '1']]), c: ['A는 B보다 탄소 배출이 적다.', 'B는 A보다 공급 안정성이 높다.', 'B는 연료 고갈 걱정이 가장 크다.', 'A와 B는 모든 점에서 같다.', 'B는 탄소 배출이 적지만 공급 안정성을 보완해야 한다.'], a: 4, e: '신재생 에너지는 저탄소지만 날씨에 따라 공급이 흔들려요.', cs: ['renew', 'fossil'] },
  { id: '12-d12', t: 'mc', q: '다음 글에 대한 설명으로 옳은 것은?', data: '<p>지금 세대가 편하자고 자원을 다 써 버리고 환경을 망가뜨리면, 미래 세대는 스스로의 필요를 채울 기회를 잃는다.</p>', c: ['현세대의 필요만 중요하다고 본다.', '경제 성장은 필요 없다고 본다.', '미래 세대의 여건을 해치지 않는 지속가능한 발전을 강조한다.', '환경 문제는 세대와 관계없다고 본다.', '자원은 고갈되지 않는다고 본다.'], a: 2, e: '세대 간 정의에 바탕을 둔 지속가능한 발전이에요.', cs: ['sustdev'] },
  // 통합형
  { id: '12-i1', t: 'mc', tag: '경제 연계', q: '배출권 거래제가 전체 감축 비용을 줄이는 까닭과 가장 관련 깊은 경제 개념은?', c: ['비교 우위처럼 비용이 낮은 쪽이 더 맡는 원리', '매몰 비용', '인플레이션', '빨대 효과', '예금자 보호'], a: 0, e: '감축 비용이 낮은 공장이 감축을 더 맡는 것은 8장의 비교 우위·특화와 같은 원리예요.', cs: ['ets'] },
  { id: '12-i2', t: 'mc', tag: '복지 연계', q: '고령화가 11장의 복지 제도에 주는 영향으로 가장 적절한 것은?', c: ['연금 수급자가 줄어든다.', '노년층을 위한 연금과 의료 비용이 늘어 재원 마련이 과제가 된다.', '복지 제도가 필요 없어진다.', '사회 보험료를 낼 사람이 늘어난다.', '돌봄 서비스 수요가 줄어든다.'], a: 1, e: '부양 부담이 커져 제도의 지속 가능성이 과제가 돼요.', cs: ['lowbirth', 'depratio'] },
  { id: '12-i3', t: 'mc', tag: '무역 연계', q: '9장의 탄소국경조정제도와 12장의 탄소 중립을 함께 볼 때 가장 적절한 설명은?', c: ['탄소 배출은 무역과 관계없다.', '탄소 중립은 수출 기업과 관계없다.', '탄소 배출이 많은 수출 기업은 비용 부담이 커져 감축 노력이 필요하다.', '탄소국경조정제도는 모든 관세를 없앤다.', '재생 에너지를 쓰면 수출이 금지된다.'], a: 2, e: '탄소 감축이 수출 경쟁력과도 이어져요.', cs: ['netzero', 're100'] },
  { id: '12-i4', t: 'mc', tag: '금융 연계', q: '기후 변화가 금융 결정에 줄 수 있는 영향으로 가장 적절한 것은?', c: ['친환경 산업은 어떤 경우에도 투자 대상이 아니다.', '기후 변화는 금융과 관계없다.', '온실가스를 많이 내는 기업의 가치가 반드시 오른다.', '친환경 에너지 산업의 투자 수익이 늘어날 수 있다.', '모든 주가가 똑같이 움직인다.'], a: 3, e: '7장에서 배운 사회적 환경 변화의 한 예예요.', cs: ['renew', 'sustdev'] },
  { id: '12-i5', t: 'mc', tag: '세계시민 연계', q: '미래 사회를 준비하는 세계시민의 자세로 가장 적절한 것은?', c: ['자기 나라의 이익만 생각한다.', '과학 기술의 부작용은 무시한다.', '기후 변화는 다른 나라의 문제라고 본다.', '빈곤은 개인의 문제일 뿐이다.', '인류 공동의 문제에 참여와 연대의 자세로 대응한다.'], a: 4, e: '참여와 연대, 올바른 가치관이 세계시민의 자세예요.', cs: ['future'] },
  // 보스전: 2050 탄소 중립 회의
  { id: '12-b1', t: 'mc', q: '[회의 1] 굴뚝 용: "모든 공장이 똑같이 줄이는 게 가장 싸!" 이에 대한 반박으로 옳은 것만을 <보기>에서 고른 것은?', box: ['감축 비용이 공장마다 다르면 거래로 전체 비용을 줄일 수 있다.', '감축 비용이 낮은 공장이 더 줄이고 배출권을 팔 수 있다.', '배출권 거래를 하면 감축량 목표가 사라진다.', '모든 공장의 감축 비용은 언제나 같다.'], c: COMBO, a: 0, e: '총량은 지키면서 비용을 줄이는 제도예요.', cs: ['ets'] },
  { id: '12-b2', t: 'mc', q: '[회의 2] 표에서 B국의 노년 부양비는? (소수점 아래는 버린다.)', data: DEP12, c: ['5', '9', '55', '11', '45'], a: 1, e: '(5 ÷ 55) × 100 ≈ 9예요.', cs: ['depratio'] },
  { id: '12-b3', t: 'mc', q: '[회의 3] 탄소 중립에 대한 설명으로 옳은 것은?', c: ['온실가스를 전혀 배출하지 않는 상태이다.', '온실가스 흡수는 고려하지 않는다.', '배출량에서 흡수량을 빼 순배출량이 0이 되는 상태이다.', '화석 에너지만 쓰는 상태이다.', '2100년에야 목표로 삼을 수 있다.'], a: 2, e: '넷 제로예요. 우리나라는 2050년을 목표로 해요.', cs: ['netzero'] },
  { id: '12-b4', t: 'mc', q: '[회의 4] 신재생 에너지를 늘릴 때 함께 고려해야 할 점으로 가장 적절한 것은?', c: ['연료 고갈', '온실가스 대량 배출', '석유 수입 증가', '날씨에 따라 달라지는 발전량과 공급 안정성', '가채 연수 감소'], a: 3, e: '에너지 저장 장치 등으로 보완해요.', cs: ['renew'] },
  { id: '12-b5', t: 'mc', q: '[회의 5] 저출생 문제를 해결하기 위한 방안으로 가장 적절한 것은?', c: ['육아 지원을 줄인다.', '양성 평등 문화를 없앤다.', '일과 가정의 양립을 어렵게 한다.', '가족 친화적 문화를 막는다.', '출산·양육 지원과 가족 친화적 문화를 넓힌다.'], a: 4, e: '제도와 인식이 함께 바뀌어야 해요.', cs: ['popsol'] },
  { id: '12-b6', t: 'mc', q: '[회의 6] 교토 의정서와 파리 협정을 비교한 설명으로 옳은 것은?', c: ['파리 협정은 모든 당사국이 참여하는 반면, 교토 의정서는 일부 나라에 감축 의무를 주었다.', '교토 의정서가 파리 협정보다 늦게 채택되었다.', '파리 협정은 배출권 거래제를 처음 도입하였다.', '두 협약 모두 오존층 보호를 위한 것이다.', '교토 의정서는 지금도 효력이 있다.'], a: 0, e: '교토 의정서는 2020년에 만료됐어요.', cs: ['climate', 'paris'] },
  { id: '12-b7', t: 'mc', q: '[회의 7] 자원 민족주의가 나타나는 배경으로 가장 적절한 것은?', c: ['자원의 가변성', '자원의 편재성', '자원의 무한성', '재생 에너지의 확대', '인구 감소'], a: 1, e: '자원이 일부 지역에 몰려 있기 때문이에요.', cs: ['resnat', 'resource'] },

  { id: '1-d11', t: 'mc', q: '다음 갑, 을의 주장에 대한 설명으로 옳은 것은?', data: '<p>갑: 사람들은 자기 이익을 열심히 추구하는 과정에서 사회 전체의 이익도 늘린다.<br>을: 누구나 쓸 수 있는 목초지에서는 저마다 가축을 늘리다가 결국 목초지가 망가진다.</p>', c: ['을은 사익 추구가 공익을 해칠 수 있다고 본다.', '갑은 공유지의 비극을 강조한다.', '을은 시장에 맡기면 공유 자원이 잘 지켜진다고 본다.', '갑과 을 모두 사익 추구를 부정한다.', '갑은 정부 규제가 반드시 필요하다고 본다.'], a: 0, e: '갑은 애덤 스미스, 을은 공유지의 비극의 관점이에요.', cs: ['selfpub', 'commons'] },
  { id: '1-d12', t: 'mc', q: '다음 사례에 대한 옳은 설명만을 <보기>에서 고른 것은?', data: '<p>한 동네에서 "용기 내 캠페인"이 열렸다. 가게는 손님이 가져온 용기에 음식을 담아 주고 값을 조금 깎아 주었으며, 구청은 참여 가게를 홍보해 주었다.</p>', box: ['가게는 포장 용기 비용이 크게 늘어난다.', '손님에게는 할인이라는 편익이 생긴다.', '캠페인 참여는 환경 보호에도 도움이 된다.', '구청은 이 캠페인과 관계없는 경제 주체이다.'], c: COMBO, a: 2, e: '가게는 포장 비용을 아끼고, 손님은 할인을 받고, 구청은 환경 보호를 위해 참여했어요.', cs: ['yonggi'], src: '천재2 72쪽 사례와 같은 구조' },
  { id: '1-i4', t: 'mc', tag: '환경 연계', q: '다음 자료에 나타난 문제와 해결 방안에 대한 설명으로 옳은 것은?', data: '<p>지구의 대기는 모든 나라가 함께 쓰는 자원이다. 나라마다 온실가스를 더 많이 배출하면 당장 생산을 늘릴 수 있지만, 지구 온난화가 심해져 모든 나라가 피해를 본다.</p>', c: ['각국이 자국 이익만 따르면 문제가 저절로 해결된다.', '대기는 한 나라가 소유한 자원이라 문제가 생기지 않는다.', '온실가스 배출은 외부 경제의 사례이다.', '국제 협약과 탄소 배출권 거래제 같은 제도로 함께 해결할 수 있다.', '한 나라만 배출을 줄이면 모든 문제가 해결된다.'], a: 3, e: '대기를 둘러싼 공유지의 비극이에요. 국제적 협의와 제도로 함께 풀어야 해요.', cs: ['commons', 'commonsfix'], src: '천재2 61쪽' },
  { id: '1-i5', t: 'mc', tag: '윤리 연계', q: '다음 글의 관점에서 공유 자원 관리에 대해 가장 적절하게 주장한 것은?', data: '<p>공동체 구성원은 공동체의 일을 자신의 일로 여기고, 신뢰와 협력을 바탕으로 함께 책임을 나누어야 한다.</p>', c: ['공유 자원은 모두 정부가 강제로 관리해야 한다.', '각자 자기 몫만 챙기면 된다.', '공유 자원은 가장 힘센 사람이 가져야 한다.', '규칙 없이 먼저 쓰는 사람이 임자이다.', '구성원들이 함께 규칙을 만들고 지키며 공유 자원을 관리해야 한다.'], a: 4, e: '공동체의 자율적 관리에 가까운 주장이에요.', cs: ['commonsfix'] },
  { id: '1-b11', t: 'mc', q: '다음 대화에서 옳게 말한 학생만을 있는 대로 고른 것은?', data: '<p>갑: 기회비용은 명시적 비용과 암묵적 비용을 합한 거예요.<br>을: 이미 내서 돌려받을 수 없는 돈도 기회비용에 넣어야 해요.<br>병: 암묵적 비용은 포기한 대안 가운데 가치가 가장 큰 것이에요.</p>', c: ['갑, 병', '갑', '을', '을, 병', '갑, 을, 병'], a: 0, e: '매몰 비용은 기회비용에 넣지 않아요.', cs: ['octrap', 'sunk', 'imp'] },
  { id: '1-b12', t: 'mc', q: '다음 사례에 대한 설명으로 옳은 것은?', data: '<p>을은 환불이 안 되는 놀이공원 입장권을 3만 원에 샀다. 당일에 비가 많이 와서, 놀이공원에 가면 편익이 2만 원, 집에서 쉬면 편익이 4만 원일 것 같다. (단, 놀이공원까지 가는 추가 비용은 없다.)</p>', c: ['입장권 3만 원이 아까우니 놀이공원에 가야 한다.', '놀이공원에 가는 기회비용은 7만 원이다.', '집에서 쉬는 선택의 순편익은 음(−)이다.', '입장권 값은 매몰 비용이므로, 편익이 더 큰 집에서 쉬는 것이 합리적이다.', '두 선택의 기회비용은 모두 3만 원이다.'], a: 3, e: '입장권 값은 매몰 비용이에요. 놀이공원의 순편익은 2 − 4 = −2, 휴식은 4 − 2 = +2예요.', cs: ['sunk', 'net'] },
  { id: '1-b13', t: 'mc', q: '다음 사례에 가장 가까운 공유지의 비극 해결 방안은?', data: '<p>한 어촌 마을은 주민 회의에서 해마다 잡을 수 있는 물고기의 양과 잡지 않는 기간을 스스로 정하고, 서로 지키는지 살피며 바다를 관리해 왔다.</p>', c: ['공유 자원의 사유화', '정부의 벌금 부과', '공동체의 자율적 관리', '자유로운 경쟁 강화', '공유 자원의 방치'], a: 2, e: '주민들이 스스로 규칙을 만들고 지키는 공동체 관리예요.', cs: ['commonsfix'] },
  { id: '1-b14', t: 'mc', q: 'A, B 가운데 하나를 선택하려 한다. 표에 대한 설명으로 옳은 것은?', data: tbl(['구분', 'A', 'B'], [['편익', '50', '40'], ['명시적 비용', '30', '10']]), c: ['A의 기회비용은 30이다.', 'B의 암묵적 비용은 30이다.', 'A를 선택하는 것이 합리적이다.', 'A의 순편익은 양(+)이다.', 'B의 기회비용은 30이고, B를 선택하는 것이 합리적이다.'], a: 4, e: 'A: 기회비용 30 + 30 = 60, 순편익 −10. B: 기회비용 10 + 20 = 30, 순편익 +10이에요.', cs: ['oc', 'net'] },
  { id: '1-b15', t: 'mc', q: '사익과 공익에 대한 옳은 설명만을 <보기>에서 고른 것은?', box: ['애덤 스미스는 사익 추구가 사회 전체의 이익을 늘릴 수 있다고 보았다.', '공유지의 비극은 사익 추구가 언제나 공익을 늘림을 보여 준다.', '공유지의 비극은 사익 추구가 공익을 해칠 수 있음을 보여 준다.', '공유 자원 문제는 어떤 제도로도 해결할 수 없다.'], c: COMBO, a: 1, e: '스미스의 관점과 공유지의 비극은 서로 대비돼요. 공유 자원 문제는 여러 제도로 풀 수 있어요.', cs: ['selfpub', 'commonsfix'] }
);

  { id: '2-c4e', t: 'mc', q: '큰 정부에 대한 설명으로 옳은 것은?', c: ['정부의 역할을 국방과 치안으로 한정한다.', '신자유주의가 추구하는 정부이다.', '공공사업과 복지 정책으로 시장에 적극 개입한다.', '애덤 스미스가 주장한 정부이다.', '규제 완화와 민영화를 추진한다.'], a: 2, e: '큰 정부는 수정 자본주의 시기의 정부예요.', cs: ['govsize', 'keynes'] },
  { id: '2-c5d', t: 'ox', q: '하이에크와 프리드먼은 정부의 적극적인 시장 개입을 주장하였다.', a: false, e: '정부 개입을 비판하고 시장 기능을 강조했어요.', cs: ['hayek'] },
  { id: '2-c5e', t: 'mc', q: '신자유주의에 대한 비판으로 가장 적절한 것은?', c: ['정부 지출이 지나치게 늘어난다.', '생산 수단을 국가가 소유하게 된다.', '시장 가격 기구가 작동하지 않는다.', '경제 활동의 자유가 크게 줄어든다.', '빈부 격차가 커지고 시장이 불안정해질 수 있다.'], a: 4, e: '규제 완화와 자본의 국제 이동이 불평등과 불안정을 키울 수 있다는 비판이에요.', cs: ['neolimit'] },
  { id: '2-r21', t: 'ox', q: '『국부론』의 저자는 케인스이다.', a: false, e: '애덤 스미스예요.', cs: ['smith'] },
  { id: '2-r22', t: 'ox', q: '산업 자본주의는 생산 과정에서 이윤을 추구하였다.', a: true, e: '상업 자본주의는 유통 과정이었어요.', cs: ['ind', 'indrev'] },
  { id: '2-r23', t: 'ox', q: '하이에크는 계획경제를 옹호하였다.', a: false, e: '정부의 계획은 실패하기 쉽다고 비판했어요.', cs: ['hayek'] },
  { id: '2-r24', t: 'ox', q: '2008년 세계 금융 위기 뒤 정부의 역할을 다시 강조하는 흐름이 나타났다.', a: true, e: '금융 규제가 다시 강화되었어요.', cs: ['neolimit'] },
  { id: '2-r25', t: 'ox', q: '신자유주의는 노동 시장을 더 경직되게 만들려고 하였다.', a: false, e: '노동 시장 유연화를 추진했어요.', cs: ['neolib'] },
  { id: '2-r26', t: 'ox', q: '분업은 생산성을 떨어뜨린다.', a: false, e: '분업은 생산성을 크게 높여요.', cs: ['smith'] },
  { id: '2-r27', t: 'ox', q: '큰 정부는 자유방임주의가 바라는 정부이다.', a: false, e: '자유방임주의는 작은 정부를 바라요.', cs: ['laissez', 'govsize'] },
  { id: '2-r28', t: 'blank', q: '보이지 않는 손을 말한 학자는 (＿＿)이다.', c: ['케인스', '애덤 스미스'], a: 1, e: '애덤 스미스예요.', cs: ['smith'] },
  { id: '2-r29', t: 'blank', q: '증기 기관과 공장제 기계 공업으로 대표되는 변화는 (＿＿) 혁명이다.', c: ['산업', '상업'], a: 0, e: '산업 혁명이에요.', cs: ['indrev'] },
  { id: '2-r30', t: 'blank', q: '정부 실패를 비판하며 작은 정부를 주장한 학자는 (＿＿)이다.', c: ['케인스', '하이에크'], a: 1, e: '하이에크예요. 프리드먼도 같은 입장이에요.', cs: ['hayek'] },
  { id: '2-d9', t: 'mc', q: '다음은 경제사상가 갑~병의 주장이다. 이에 대한 설명으로 옳은 것은? (단, 갑~병은 각각 애덤 스미스, 케인스, 하이에크 중 한 명이다.)', data: '<p>갑: 개인이 자유롭게 이익을 좇으면 보이지 않는 손이 사회 전체의 부를 늘린다.<br>을: 불황기에는 정부가 지출을 늘려 유효 수요를 만들어야 한다.<br>병: 정부가 시장을 계획하려 할수록 자유와 효율이 무너진다.</p>', c: ['갑은 대공황 극복을 위한 정부 지출을 주장했다.', '을의 주장은 뉴딜 정책의 이론적 바탕이 되었다.', '병은 큰 정부를 지지한다.', '갑과 을은 모두 신자유주의 사상가이다.', '을과 병은 정부의 역할에 대해 같은 입장이다.'], a: 1, e: '갑은 스미스, 을은 케인스, 병은 하이에크예요. 케인스의 이론은 뉴딜 정책과 맥을 같이해요.', cs: ['smith', 'keynes', 'hayek'] },
  { id: '2-d10', t: 'mc', q: '표는 자본주의 전개 과정에서 정부 역할의 변화를 나타낸 것이다. (가)~(다)는 각각 산업 자본주의, 수정 자본주의, 신자유주의 중 하나이다. 이에 대한 설명으로 옳은 것은?', data: tbl(['구분', '(가)', '(나)', '(다)'], [['정부의 역할', '작음', '큼', '다시 줄어듦'], ['등장 배경', '산업 혁명', '대공황', '석유 파동과 정부 실패']]), c: ['(가)에서는 정부가 공공사업으로 유효 수요를 만들었다.', '(나)는 하이에크의 주장이 바탕이 되었다.', '(다)는 뉴딜 정책으로 대표된다.', '(가)는 (다)보다 늦게 나타났다.', '(나)는 케인스의 이론이, (다)는 하이에크·프리드먼의 주장이 바탕이 되었다.'], a: 4, e: '(가) 산업 자본주의, (나) 수정 자본주의, (다) 신자유주의예요.', cs: ['ind', 'keynes', 'neolib', 'hayek'] },
  { id: '2-d11', t: 'mc', q: '다음 자료에 나타난 시기에 대한 설명으로 옳은 것은?', data: '<p>증기 기관으로 돌아가는 방직 기계가 들어선 공장에서 수많은 노동자가 일을 나누어 맡아 옷감을 대량으로 생산하였다. 공장 주인들은 정부에 시장에 간섭하지 말 것을 요구하였다.</p>', c: ['생산 과정에서 이윤을 추구하는 산업 자본주의가 발달하였다.', '정부가 대규모 공공사업으로 일자리를 만들었다.', '석유 파동으로 스태그플레이션이 나타났다.', '절대 왕정이 수입을 막고 금은을 모았다.', '공기업 민영화가 활발하게 추진되었다.'], a: 0, e: '산업 혁명과 자유방임의 시기, 곧 산업 자본주의예요.', cs: ['indrev', 'ind', 'laissez'] },
  { id: '2-d12', t: 'mc', q: '다음 자료에 대한 옳은 설명만을 <보기>에서 고른 것은?', data: '<p>1980년대 이후 여러 나라에서 금융 규제가 크게 풀렸다. 2008년 미국에서 시작된 세계 금융 위기로 여러 금융 회사가 무너지자, 각국 정부는 금융 규제를 다시 강화하였다.</p>', box: ['세계 금융 위기는 대공황과 같은 시기에 일어났다.', '규제 완화는 신자유주의 정책의 특징이다.', '금융 위기 뒤 각국은 정부 역할을 더욱 줄였다.', '신자유주의의 한계에 대한 비판과 관련 있다.'], c: COMBO, a: 3, e: '규제 완화는 신자유주의의 특징이고, 금융 위기 뒤 규제를 다시 강화한 것은 그 한계에 대한 반성이에요.', cs: ['neolib', 'neolimit'] },
  { id: '2-i4', t: 'mc', tag: '역사 연계', q: '다음 자료에 나타난 변화가 경제에 준 영향으로 옳은 것은?', data: '<p>18세기 후반 영국에서는 면직물 공업을 중심으로 증기 기관을 이용한 기계가 널리 쓰이기 시작하였고, 사람들이 일자리를 찾아 공업 도시로 몰려들었다.</p>', c: ['상업 자본주의가 처음 나타났다.', '절대 왕정의 중상주의가 강화되었다.', '공장제 기계 공업이 발달하고 산업 자본가가 성장하였다.', '케인스의 유효 수요 이론이 등장하였다.', '석유 파동으로 물가가 급등하였다.'], a: 2, e: '산업 혁명으로 산업 자본주의가 발달했어요.', cs: ['indrev', 'ind'] },
  { id: '2-i5', t: 'mc', tag: '국가 비교', q: '다음 두 나라의 경제 운영에 대한 설명으로 옳은 것은?', data: '<p>갑국: 정부가 5개년 계획으로 생산 목표를 정하고 공장마다 원료를 나누어 준다.<br>을국: 기업이 시장 가격을 보고 생산량을 정하되, 정부는 공정 거래를 감시하고 복지 제도를 운영한다.</p>', c: ['갑국은 시장경제 체제에 가깝다.', '을국은 혼합 경제 체제의 모습을 보인다.', '갑국은 을국보다 경제적 유인이 강하다.', '을국은 생산 수단의 국유화를 원칙으로 한다.', '갑국과 을국 모두 정부가 시장에 전혀 개입하지 않는다.'], a: 1, e: '을국은 시장을 바탕으로 정부가 보완하는 혼합 경제, 갑국은 계획경제에 가까워요.', cs: ['mixed', 'plan', 'mkt'] },
  { id: '2-b11', t: 'mc', q: '(가)~(라)를 일어난 순서대로 바르게 나열한 것은?', data: '<p>(가) 하이에크와 프리드먼의 주장이 힘을 얻었다.<br>(나) 애덤 스미스가 『국부론』을 펴냈다.<br>(다) 미국에서 뉴딜 정책이 실시되었다.<br>(라) 세계 금융 위기가 일어났다.</p>', c: ['(나)-(다)-(가)-(라)', '(나)-(가)-(다)-(라)', '(다)-(나)-(가)-(라)', '(나)-(다)-(라)-(가)', '(가)-(나)-(다)-(라)'], a: 0, e: '1776년 『국부론』 → 1930년대 뉴딜 → 1970~80년대 신자유주의 → 2008년 금융 위기예요.', cs: ['smith', 'newdeal', 'hayek', 'neolimit'] },
  { id: '2-b12', t: 'mc', q: '다음 수업 장면에서 옳게 답한 학생만을 있는 대로 고른 것은?', data: '<p>교사: 신자유주의가 등장한 배경을 말해 볼까요?<br>갑: 1970년대 석유 파동 뒤 스태그플레이션이 나타났어요.<br>을: 1929년 대공황으로 대량 실업이 생겼어요.<br>병: 정부 실패와 복지 확대로 재정이 나빠졌어요.</p>', c: ['갑', '을', '병', '갑, 병', '을, 병'], a: 3, e: '대공황은 수정 자본주의의 배경이에요.', cs: ['stag', 'neolib', 'dep'] },
  { id: '2-b13', t: 'mc', q: '(가), (나) 자본주의에 대한 설명으로 옳은 것은?', data: '<p>(가) 무역선을 띄워 먼 곳의 향신료를 싸게 사서 비싸게 팔았다.<br>(나) 공장을 세워 기계로 옷감을 대량 생산해 팔았다.</p>', c: ['(가)는 산업 혁명 이후에 나타났다.', '(나)는 유통 과정에서 이윤을 추구했다.', '(가)는 상업 자본주의, (나)는 산업 자본주의에 해당한다.', '(나)는 절대 왕정의 중상주의가 바탕이다.', '(가)와 (나) 모두 대공황 이후에 나타났다.'], a: 2, e: '유통에서 이윤을 얻은 (가)는 상업, 생산에서 이윤을 얻은 (나)는 산업 자본주의예요.', cs: ['merc', 'ind'] },
  { id: '2-b14', t: 'mc', q: '다음 사례가 보여 주는 경제 체제의 한계로 가장 적절한 것은?', data: '<p>어느 나라 정부가 신발 공장의 성과를 만든 켤레 수로만 평가하자, 공장들은 작은 신발만 잔뜩 만들어 목표를 채웠고 어른들은 발에 맞는 신발을 구하기 어려웠다.</p>', c: ['시장경제 체제의 빈부 격차', '계획경제 체제에서 소비자의 욕구를 반영하기 어려운 문제', '혼합 경제 체제에서 나타나는 독과점 문제', '신자유주의의 규제 완화 문제', '자유방임주의의 공공재 부족 문제'], a: 1, e: '정부 계획이 소비자의 필요를 반영하지 못한 계획경제의 한계예요.', cs: ['plan'] },
  { id: '2-b15', t: 'mc', q: '애덤 스미스와 케인스에 대한 옳은 설명만을 <보기>에서 고른 것은?', box: ['스미스는 대공황 극복을 위한 공공사업을 주장했다.', '케인스는 시장이 언제나 스스로 균형을 찾는다고 보았다.', '스미스는 분업과 자유로운 경쟁을 강조했다.', '케인스는 불황기의 정부 지출 확대를 주장했다.'], c: COMBO, a: 4, e: '스미스는 자유로운 경쟁, 케인스는 불황기 정부 지출 확대를 강조했어요.', cs: ['smith', 'keynes'] }
);

Object.assign(CARDS3, {
  govfail: { name: '정부 실패', core: '시장 실패를 바로잡으려던 정부의 개입이 오히려 자원을 비효율적으로 배분하는 현상이에요.', why: '정부도 정보가 부족해 잘못 판단할 수 있고, 경쟁이 없는 조직은 효율이 떨어지기 쉬워요.', exam: '시장 실패와 정부 실패를 짝지어 기억해요. 정부 실패는 신자유주의가 등장한 배경으로도 나와요.', deep: '그래서 정부의 개입도 비용과 편익을 따져 신중하게 해야 해요.', src: '비상2 63쪽 · 수특2 75쪽' },

  { id: '3-d11', t: 'mc', q: '다음 갑, 을의 주장에 대한 설명으로 옳은 것은?', data: '<p>갑: 시장에 문제가 생기면 정부가 적극적으로 나서야 해요.<br>을: 정부도 정보가 부족해 잘못 판단할 수 있어요. 개입은 신중해야 해요.</p>', c: ['갑은 정부 실패를 가장 우려한다.', '을은 시장 실패가 전혀 없다고 본다.', '갑은 정부의 개입을 반대한다.', '갑과 을 모두 공공재가 필요 없다고 본다.', '을은 정부 실패의 가능성을 강조한다.'], a: 4, e: '을은 정부 개입도 실패할 수 있다고 보아 신중함을 강조해요.', cs: ['govfail', 'govrole'] },
  { id: '3-d12', t: 'mc', q: '다음 사례에 대한 옳은 설명만을 <보기>에서 고른 것은?', data: '<p>A시는 누구나 이용할 수 있는 가로등과 도로를 세금으로 설치하였다. 또 상수도는 시가 세운 공기업이 공급한다.</p>', box: ['가로등은 비배제성과 비경합성을 지닌 공공재의 예이다.', '공공재는 시장에 맡기면 과다 공급된다.', '정부가 공공재 생산에 직접 참여한 사례이다.', '공기업은 민간인이 이윤만을 위해 세운 기업이다.'], c: COMBO, a: 1, e: '공공재는 시장에 맡기면 부족하게 공급돼서 정부가 직접 공급해요. 공기업은 정부 자본으로 세운 기업이에요.', cs: ['pubcorp', 'pubgood'] },
  { id: '3-i4', t: 'mc', tag: '환경 연계', q: '다음 사례에 대한 정부 대책으로 가장 적절한 것은?', data: '<p>한 마을의 양봉가가 벌을 치자 주변 과수원의 꽃가루받이가 잘되어 수확이 늘었다. 하지만 양봉가는 아무 대가도 받지 못해 벌통을 줄이려 한다.</p>', c: ['양봉가에게 부담금을 부과한다.', '벌꿀에 원산지 표시제를 시행한다.', '양봉을 금지한다.', '양봉가에게 보조금을 지급해 양봉을 장려한다.', '과수원 수를 줄인다.'], a: 3, e: '외부 경제라 사회적으로 바람직한 양보다 적게 생산돼요. 보조금으로 늘려요.', cs: ['extpos', 'overunder'] },
  { id: '3-i5', t: 'mc', tag: '윤리 연계', q: '다음 글의 관점에서 지지할 제도로 가장 적절한 것은?', data: '<p>거래에서 한쪽이 중요한 사실을 숨기면 상대방은 공정하게 판단할 수 없다. 공정한 거래를 위해서는 판매자가 알고 있는 결함을 알려야 한다.</p>', c: ['판매자가 결함을 숨겨도 되는 계약', '모든 거래의 금지', '중고차 성능·사고 이력 공개 제도', '가격 담합 허용', '공공재의 민영화'], a: 2, e: '정보를 공개해 정보의 비대칭성을 줄이는 제도예요.', cs: ['origin', 'asym'] },

  { id: '3-b12', t: 'mc', q: '다음 사례에 대한 설명으로 옳은 것은?', data: '<p>소수의 영화관 체인이 전국 상영관 대부분을 차지하고 있는데, 비슷한 시기에 관람료를 함께 올렸다.</p>', c: ['이 시장은 완전 경쟁에 가깝다.', '공공재 부족 문제의 사례이다.', '관람료 인상은 외부 경제에 해당한다.', '정부는 영화관에 보조금을 지급해야 한다.', '과점 시장에서 담합이 의심되므로 공정 거래 제도로 조사할 수 있다.'], a: 4, e: '과점 시장의 담합 의심 사례예요. 공정 거래 제도로 조사하고 규제해요.', cs: ['oligo', 'cartel', 'ftclaw'] },

// ===== 엔진 코어 =====
const CHAPTERS = [CH1, CH2, CH3, CH4, CH5, CH6, CH7, CH8, CH9, CH10, CH11, CH12];
const chOpen = n => n === 1 || (CHAP(n - 1) && chS(n - 1).built);
const curCh = () => { for (const c of CHAPTERS) if (chOpen(c.n) && !chS(c.n).built) return c.n; return CHAPTERS[CHAPTERS.length - 1].n; };
const QBANK = {}, CARDBANK = {};
CHAPTERS.forEach(ch => {
  ch.questions.forEach(q => { q.ch = ch.n; QBANK[q.id] = q; });
  Object.entries(ch.cards).forEach(([id, c]) => { c.id = id; c.ch = ch.n; CARDBANK[id] = c; });
});
const CHAP = n => CHAPTERS.find(c => c.n === n);
// 받침에 맞는 조사: josa('창고', '이/가') → '창고가'
const josa = (w, pair) => { const c = String(w).charCodeAt(String(w).length - 1), has = c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0, [a, b] = pair.split('/'); return w + (has ? a : b); };

// ---------- 저장 v2 ----------
const KEY = 'saebom-game-v2';
function DEF() { return { v: 2, coins: 0, xp: 0, ch: {}, mast: {}, srs: {}, story: {}, tut: {}, stats: { ans: 0, ok: 0, lastDay: 0, streak: 0, days: 0 }, set: { sfx: true, bgm: false, vib: true, reduce: false }, avatar: { skin: 0, hc: 0, hair: 0, top: 0, prop: 0 }, owned: ['hair0', 'hair1', 'top0', 'prop0'], skills: { ana: 0, calc: 0, integ: 0, mem: 0 }, town: null, quests: {}, debate: {} }; }
function merge(o) { const d = DEF(), z = DEF(); Object.assign(d, o); d.set = Object.assign(z.set, o.set || {}); d.stats = Object.assign(z.stats, o.stats || {}); d.avatar = Object.assign(z.avatar, o.avatar || {}); d.skills = Object.assign(z.skills, o.skills || {}); d.owned = Array.isArray(o.owned) ? o.owned : z.owned; d.quests = o.quests || {}; d.debate = o.debate || {}; return d; }
function load() { try { const o = JSON.parse(localStorage.getItem(KEY) || 'null'); if (o && o.v === 2) return merge(o); } catch (e) { } return DEF(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) { } }
let ST = load();
Object.assign(SET, ST.set);
if (SET.reduce) document.documentElement.classList.add('reduce');
const today = () => { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); };
function touchDay() { const t = today(), s = ST.stats; if (s.lastDay !== t) { s.streak = s.lastDay === t - 1 ? s.streak + 1 : 1; s.lastDay = t; s.days++; save(); } }

// 저장 코드: 기기를 바꿔도 이어 하기
function sum32(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
function exportCode() { const b = btoa(unescape(encodeURIComponent(JSON.stringify(ST)))); return `SB2.${b}.${sum32(b)}`; }
function importCode(code) {
  const m = String(code).replace(/\s+/g, '').match(/^SB2\.([A-Za-z0-9+/=]+)\.([a-z0-9]+)$/);
  if (!m || sum32(m[1]) !== m[2]) return false;
  try { const o = JSON.parse(decodeURIComponent(escape(atob(m[1])))); if (!o || o.v !== 2) return false; ST = merge(o); Object.assign(SET, ST.set); save(); return true; } catch (e) { return false; }
}

// ---------- 챕터와 스테이지 ----------
const chS = n => ST.ch[n] || (ST.ch[n] = { st: {}, built: false });
const stS = (c, n) => { const o = chS(c); return o.st[n] || (o.st[n] = { done: false, stars: 0, plays: 0 }); };
const stOpen = (c, n) => n === 1 || stS(c, n - 1).done;
const chStars = c => Object.values(chS(c).st).reduce((a, s) => a + (s.stars || 0), 0);
const chDone = c => Object.values(chS(c).st).filter(s => s.done).length;
function nextStage(c) { const ch = CHAP(c); for (const s of ch.stages) if (!stS(c, s.n).done) return s.n; return null; }

const TITLES = ['새내기 기록원', '노트 수습생', '희소성 관찰자', '비용 계산원', '선택 설계자', '시장 산책자', '정책 조수', '금융 수습생', '저축 전략가', '환율 해석가', '무역 항해사', '비교 우위 선장', '도시 설계자', '복지 조정자', '인구 분석가', '기후 협상가', '자료 해석 달인', '통합형 해결사', '섬의 경제 고문', '핑구섬 경제 박사'];
const needXP = L => 150 + 60 * (L - 1);
function lvOf(xp) { let L = 1, x = xp; while (L < 20 && x >= needXP(L)) { x -= needXP(L); L++; } return { L, cur: x, need: L < 20 ? needXP(L) : 1, title: TITLES[L - 1] }; }

  $$('#coins span').forEach(s => s.textContent = ST.coins);
}

}

// ---------- 숙련도 0~4와 간격 반복 복습 ----------
const MST = c => ST.mast[c] || (ST.mast[c] = { lv: 0, ok: 0, ng: 0, streak: 0 });
function markSeen(c) { const m = MST(c); if (m.lv < 1) { m.lv = 1; save(); } }
const snapMast = () => Object.fromEntries(Object.entries(ST.mast).map(([k, v]) => [k, v.lv]));
const GAPS = [1, 2, 4, 7, 15];
function record(q, ok, unsure, review) {
  touchDay(); ST.stats.ans++; if (ok) ST.stats.ok++;
  const s = ST.srs[q.id];
  (q.cs || []).forEach(c => {
    const m = MST(c);
    if (ok) { m.ok++; m.streak++; m.lv = Math.max(m.lv, 2); if (m.streak >= 3 && !unsure) m.lv = Math.max(m.lv, 3); if (review && s && s.box >= 2) m.lv = 4; }
    else { m.ng++; m.streak = 0; m.lv = Math.min(Math.max(m.lv, 1), 2); }
  });
  if (!ok) ST.srs[q.id] = { box: 0, due: today() + GAPS[0], wrong: (s ? s.wrong : 0) + 1, last: today() };
  else if (s && !s.done) { s.box++; s.last = today(); if (s.box >= GAPS.length) s.done = true; else s.due = today() + GAPS[s.box]; }
  else if (!s && unsure) ST.srs[q.id] = { box: 1, due: today() + GAPS[1], wrong: 0, last: today(), unsure: true };
  save();
}
const dueIds = () => { const t = today(); return Object.entries(ST.srs).filter(([id, s]) => !s.done && s.due <= t && QBANK[id]).map(([id]) => id); };
const noteIds = () => Object.entries(ST.srs).filter(([id, s]) => (s.wrong > 0 || s.unsure) && QBANK[id]).sort((a, b) => b[1].last - a[1].last).map(([id]) => id);
const dots = lv => `<span class="mdots" aria-label="숙련도 ${lv}/4">${[1, 2, 3, 4].map(k => `<i class="${k <= lv ? 'on' : ''}"></i>`).join('')}</span>`;

<div class="rew"><span>${ICON.coin} +${coins}</span><span class="xpchip">XP +${xp}</span>${mul > 1 ? `<span class="skchip">역량 ×${mul.toFixed(1)}</span>` : ''}</div>
${ups.length ? `<div class="ups"><div class="ut">숙련도가 올랐어요</div>${ups.map(k => `<span class="up">${CARDBANK[k].name} ${dots(after[k])}</span>`).join('')}</div>` : ''}
${r.msg ? `<p class="rmsg">${r.msg}</p>` : ''}

<button class="btn line block sm" id="rAgain" style="margin-top:8px">다시 하기</button></div>`;
  sc.appendChild(d);

}

function barChart(c) {
  const two = !!c.b, W = 320, H = 170, max = Math.max(...c.a, ...(c.b || [])), gx = 44, gw = (W - gx - 10) / c.labels.length, bw = two ? 20 : 28, y0 = 136, sc = 110 / max, stepv = max > 12 ? 5 : 2;
  let s = `<line x1="${gx}" y1="${y0}" x2="${W - 6}" y2="${y0}" stroke="currentColor" stroke-width="1.5"/>`;
  for (let v = 0; v <= max; v += stepv) s += `<line x1="${gx}" x2="${W - 6}" y1="${y0 - v * sc}" y2="${y0 - v * sc}" stroke="currentColor" stroke-opacity=".12"/><text x="${gx - 6}" y="${y0 - v * sc + 4}" font-size="11" text-anchor="end" fill="currentColor">${v}</text>`;
  c.labels.forEach((l, i) => {
    const cx = gx + gw * i + gw / 2;
    if (two) {
      s += `<rect x="${cx - bw - 2}" y="${y0 - c.a[i] * sc}" width="${bw}" height="${c.a[i] * sc}" fill="#E0456A" stroke="#1E2230" stroke-width="1.4"/><rect x="${cx + 2}" y="${y0 - c.b[i] * sc}" width="${bw}" height="${c.b[i] * sc}" fill="#8FB2FF" stroke="#1E2230" stroke-width="1.4"/>`;
      s += `<text x="${cx - bw / 2 - 2}" y="${y0 - c.a[i] * sc - 4}" font-size="11" text-anchor="middle" fill="currentColor">${c.a[i]}</text><text x="${cx + bw / 2 + 2}" y="${y0 - c.b[i] * sc - 4}" font-size="11" text-anchor="middle" fill="currentColor">${c.b[i]}</text>`;
    } else {
      s += `<rect x="${cx - bw / 2}" y="${y0 - c.a[i] * sc}" width="${bw}" height="${c.a[i] * sc}" fill="#E0456A" stroke="#1E2230" stroke-width="1.4"/><text x="${cx}" y="${y0 - c.a[i] * sc - 4}" font-size="11" text-anchor="middle" fill="currentColor">${c.a[i]}</text>`;
    }
    s += `<text x="${cx}" y="${y0 + 18}" font-size="13" font-weight="700" text-anchor="middle" fill="currentColor">${l}</text>`;
  });
  s += `<rect x="${gx + 6}" y="6" width="12" height="12" fill="#E0456A" stroke="#1E2230"/><text x="${gx + 22}" y="16" font-size="12" fill="currentColor">${c.an}</text>` + (two ? `<rect x="${gx + 96}" y="6" width="12" height="12" fill="#8FB2FF" stroke="#1E2230"/><text x="${gx + 112}" y="16" font-size="12" fill="currentColor">${c.bn}</text>` : '');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${c.labels.map((l, i) => `${l}: ${c.an} ${c.a[i]}${two ? `, ${c.bn} ${c.b[i]}` : ''}`).join('; ')}">${s}</svg>`;
}

function askQ(host, q, o = {}) {
  return new Promise(res => {
    delete host.dataset.done; host.dataset.qid = q.id;
    host.innerHTML = `<div class="qhead">${o.head || `<span class="qtype">${TYPE_NAME[q.t]}</span>`}<span class="sp"></span><button class="unsure" aria-pressed="false" title="맞혀도 복습에 넣어요">헷갈림</button>${hintBtn()}</div>${qBodyHTML(q)}${hintBox(q.h || q.cs, q.steps)}${choicesHTML(q)}<div class="qfb-wrap"></div>`;
    host.scrollTop = 0;
    bindHint(host, o.onHint);
    const uns = $('.unsure', host); uns.onclick = () => { uns.setAttribute('aria-pressed', String(uns.getAttribute('aria-pressed') !== 'true')); sfx('tap'); };
    const btns = $$('.oxb,.chb', host), ans = ansOf(q);
    btns.forEach(b => b.onclick = () => {
      if (host.dataset.done) return; host.dataset.done = 1;
      const v = +b.dataset.v, ok = v === ans, unsure = uns.getAttribute('aria-pressed') === 'true';
      btns.forEach(x => { const xv = +x.dataset.v; if (xv === ans) x.classList.add('right'); else if (xv === v) x.classList.add('wrong'); });
      penMark(b, ok);
      record(q, ok, unsure, o.review);
      sfx(ok ? 'correct' : 'wrong'); vib(ok ? 25 : [20, 40, 20]);
      const fb = $('.qfb-wrap', host);
      fb.innerHTML = `<div class="qfb ${ok ? 'ok' : 'ng'}"><span class="v hw">${ok ? '정답!' : '아쉬워요'}</span>${q.e}${!ok && q.trap ? `<div class="trap">함정: ${q.trap}</div>` : ''}${q.src ? `<div class="src">교과서 대조: ${q.src}</div>` : ''}${unsure && ok ? '<div class="src">헷갈림 표시를 해서 복습 센터에 넣어 둘게요.</div>' : ''}</div><button class="btn block qnext">${o.nextLabel || '다음'}</button>`;
      if (o.onAnswer) o.onAnswer(ok, b);
      setTimeout(() => fb.scrollIntoView({ block: 'nearest', behavior: SET.reduce ? 'auto' : 'smooth' }), 60);
      $('.qnext', fb).onclick = () => { sfx('tap'); res({ ok, unsure }); };
    });

}
// 여러 문항 연속 풀기
async function quizLoop(sc, ids, o = {}) {
  const host = $('#pBody', sc); let ok = 0;
  for (let i = 0; i < ids.length; i++) {
    const q = QBANK[ids[i]]; setProg(sc, i, ids.length);
    const r = await askQ(host, q, { head: `<span class="qno">${i + 1} / ${ids.length}</span><span class="qtype">${q.tag || TYPE_NAME[q.t]}</span>`, nextLabel: i === ids.length - 1 ? (o.lastLabel || '결과 보기') : '다음 문제', review: o.review, onHint: o.onHint });
    if (r.ok) ok++;
    if (o.onEach) o.onEach(r, q);
  }
  setProg(sc, ids.length, ids.length, '완료');
  return { ok, n: ids.length };
}

function STAGE_rush(sc, ch, stg) {
  sc.innerHTML = pageHTML(stg.title, `${CHAP(ch).n}장 · ${stg.label}`);
  let running = false, timer = null; bindClose(sc, ch, () => running);
  const body = $('#pBody', sc), ids = stg.take && stg.qs.length > stg.take ? shuffle(stg.qs.slice()).slice(0, stg.take) : stg.qs.slice(), N = ids.length, snap = snapMast();
  stg = { ...stg, secs: Math.round(stg.secs * skillMul('calc')) };
  setProg(sc, 0, N, `0 / ${N}`);
  body.innerHTML = `<div class="intro"><div class="ichr">${charSVG('merchant', 'determined', 'idle')}</div><div class="bubble">${N}문항을 ${stg.secs}초 안에! 연속으로 맞히면 점수가 불어나요. 틀린 문제는 끝나고 한꺼번에 해설해 줄게요.</div></div><button class="btn omr block" id="go">시작하기</button>`;
  $('#go', sc).onclick = () => { sfx('tap'); start(); };
  function start() {
    running = true;
    let i = 0, ok = 0, combo = 0, best = 0, score = 0, left = stg.secs; const wrong = [];
    body.innerHTML = `<div class="rush"><div class="rtop"><div class="rtime"><i id="rT"></i></div><span id="rS">0점</span></div><div class="rcombo" id="rC"></div><div class="rcard" id="rQ"></div><div id="rA"></div></div>`;
    const T = $('#rT', body);
    timer = setInterval(() => { left -= .1; T.style.width = Math.max(0, left / stg.secs * 100) + '%'; T.classList.toggle('low', left < 15); if (left <= 0) finish(); }, 100);
    function show() {
      if (i >= N) return finish();
      const q = QBANK[ids[i]]; setProg(sc, i, N);
      $('#rQ', body).innerHTML = `<span class="rn">${i + 1}</span>${q.q}`; $('#rQ', body).dataset.qid = q.id;
      $('#rA', body).innerHTML = q.t === 'ox' ? `<div class="oxrow"><button class="oxb" data-v="1">O</button><button class="oxb" data-v="0">X</button></div>` : `<div class="chips">${q.c.map((c, k) => `<button class="chip" data-v="${k}">${c}</button>`).join('')}</div>`;
      $$('#rA button', body).forEach(b => b.onclick = () => answer(q, +b.dataset.v, b));
    }
    function answer(q, v, b) {
      if (!running || b.disabled) return; $$('#rA button', body).forEach(x => x.disabled = true);
      const good = v === ansOf(q); record(q, good, false, false);
      const card = $('#rQ', body);
      if (good) { ok++; combo++; best = Math.max(best, combo); score += 10 + Math.min(combo, 10) * 2; sfx('correct'); vib(15); card.classList.add('good'); if (combo >= 3) { const r = rel($('#rC', body)); burst(r.x, r.y, 8, { spread: 50 }); } }
      else { combo = 0; wrong.push(q); sfx('wrong'); vib([20, 30, 20]); card.classList.add('bad'); shake(card); }
      $('#rS', body).textContent = score + '점'; $('#rC', body).innerHTML = combo >= 2 ? `<b>${combo}연속!</b>` : '';
      setTimeout(() => { card.classList.remove('good', 'bad'); i++; show(); }, SET.reduce ? 80 : 380);
    }
    function finish() {
      if (!running) return; running = false; clearInterval(timer); setProg(sc, N, N, '완료');
      body.innerHTML = `<div class="rdone"><h3>${score}점</h3><p>정답 ${ok} / ${N} · 최고 ${best}연속</p>${wrong.length ? `<div class="wlist"><b>틀린 문제 해설</b>${wrong.map(q => `<div class="witem"><p>${q.q}</p><p class="wa">정답: ${q.t === 'ox' ? (q.a ? 'O' : 'X') : q.c[q.a]}</p><p class="ex">${q.e}</p></div>`).join('')}</div>` : '<p class="hw" style="font-size:24px;color:var(--pen)">모두 맞혔어요!</p>'}<button class="btn omr block" id="fin">결과 보기</button></div>`;
      $('#fin', body).onclick = () => { sfx('tap'); stageClear(sc, ch, stg.n, { stars: ok >= 18 ? 3 : ok >= 14 ? 2 : 1, xp: 3 * ok + 10, coins: Math.round(score / 20), lines: [['점수', score + '점'], ['정답', `${ok} / ${N}`], ['최고 연속', best + '연속']], snap }); };
    }
    show();
  }
  return () => clearInterval(timer);

const GRAZE = { eat: 4, pay: 10, r: 1.2, cap: 100 };
function grazeStep(G, chs) {
  const S = chs.reduce((a, c) => a + c, 0), demand = GRAZE.eat * S, ratio = G >= demand ? 1 : G / demand;
  const earn = chs.map(c => Math.round(c * GRAZE.pay * ratio)), after = Math.max(0, G - demand);
  const grown = Math.min(GRAZE.cap, after + GRAZE.r * after * (1 - after / GRAZE.cap));
  return { S, earn, after, grown };
}
function pastureSVG(G, sheep) {
  const t = Math.max(0, Math.min(1, G / 100)), mix = (a, c) => Math.round(a + (c - a) * t);
  const field = `rgb(${mix(233, 184)},${mix(217, 226)},${mix(166, 150)})`;
  let s = `<rect x="4" y="4" width="312" height="132" rx="16" fill="${field}" stroke="#1E2230" stroke-width="2.4"/>`;
  const tufts = Math.round(G / 4);
  for (let i = 0; i < tufts; i++) { const x = 16 + (i * 53) % 290, y = 18 + ((i * 37) % 108); s += `<path d="M${x} ${y + 6} l3 -8 l3 8 l3 -6 l2 6" fill="none" stroke="#5E9A5A" stroke-width="2" stroke-linecap="round"/>`; }
  for (let i = 0; i < sheep; i++) { const x = 30 + (i * 71) % 260, y = 36 + ((i * 29) % 80); s += `<g class="sheep" style="animation-delay:${i * 40}ms" transform="translate(${x} ${y})"><ellipse cx="0" cy="0" rx="12" ry="8.5" fill="#fff" stroke="#1E2230" stroke-width="1.8"/><circle cx="11" cy="-2" r="4.6" fill="#1E2230"/><path d="M-6 7 v5 M5 7 v5" stroke="#1E2230" stroke-width="2"/></g>`; }
  return `<svg viewBox="0 0 320 140" class="pasture" role="img" aria-label="목초지, 풀 ${Math.round(G)}, 양 ${sheep}마리">${s}</svg>`;
}

    }

    let last = performance.now();
    const loop = now => {
      if (!running) return;
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      left -= dt; T.style.width = Math.max(0, left / secs * 100) + '%'; T.classList.toggle('low', left < 12);

function dialSVG(v, lo, hi) {
  const ang = d => Math.PI * (1 - d / 100), pt = (d, r) => [160 + r * Math.cos(ang(d)), 150 - r * Math.sin(ang(d))];
  const arc = (a, b, r) => { const [x1, y1] = pt(a, r), [x2, y2] = pt(b, r); return `M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`; };
  const [nx, ny] = pt(v, 104);
  return `<svg viewBox="0 0 320 180" class="dial" aria-hidden="true"><path d="${arc(0, 100, 120)}" fill="none" stroke="var(--line)" stroke-width="22"/>${lo !== undefined ? `<path d="${arc(lo, hi, 120)}" fill="none" stroke="#1E7A4C" stroke-width="22" opacity=".85"/>` : ''}<path d="${arc(0, 33, 120)}" fill="none" stroke="#3C6FD1" stroke-width="4" opacity=".6"/><path d="${arc(67, 100, 120)}" fill="none" stroke="#E0456A" stroke-width="4" opacity=".6"/>
<line x1="160" y1="150" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="${INK}" stroke-width="5" stroke-linecap="round"/><circle cx="160" cy="150" r="10" fill="#FFE45A" stroke="${INK}" stroke-width="2.4"/>
<text x="26" y="172" font-size="12.5" font-weight="800" fill="currentColor">작은 정부</text><text x="294" y="172" font-size="12.5" font-weight="800" text-anchor="end" fill="currentColor">큰 정부</text><text x="160" y="22" font-size="12" text-anchor="middle" fill="currentColor">혼합</text></svg>`;
}

            }, SET.reduce ? 60 : 900);
          } else {

            $('#cf', body).innerHTML = `<div class="qfb ${ok ? 'ok' : 'ng'}"><span class="v hw">${ok ? '알맞은 처방!' : '처방이 달라요'}</span><b>${DX.find(d => d[0] === c.dx)[1]}</b>에는 <b>${rn}</b>가 알맞아요.</div>`;

      });
